<title>Power &amp; Presence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Four interactive studies: healing and the gifts, the prophetic and sonship, music and worship, and curses, demonology and deliverance. English and Tamil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Tamil:wght@400;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap">
<style>
/* Layout: an atlas of four studies. Sticky header with the language switch at top right,
   a rail of studies on wide screens (bottom tab bar on phones), one long study plate per study
   with a sticky in-study section index. Each study carries its own accent. */
:root {
  --bg: #0f1220;
  --bg-2: #151a2c;
  --surface: #1b2136;
  --line: #2c3450;
  --ink: #efe8d8;
  --muted: #a0a7bf;
  --flame: #eaa040;   /* power */
  --sky: #9d8cf5;     /* prophetic */
  --tide: #57c4b3;    /* worship */
  --rose: #e46c7e;    /* freedom */
  --gold: #e4b25a;
  --acc: var(--gold);
  --shadow: 0 18px 46px rgba(3, 5, 14, .5);
  --display: "Bricolage Grotesque", "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 12px;
  --rail: 248px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1f0ec; --bg-2: #e8e6df; --surface: #ffffff; --line: #d6d2c6; --ink: #1b1e2c; --muted: #5d6075;
    --flame: #a85f07; --sky: #5a46c9; --tide: #18786b; --rose: #b13049; --gold: #8f6410;
    --shadow: 0 14px 36px rgba(30, 30, 50, .14); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f1f0ec; --bg-2: #e8e6df; --surface: #ffffff; --line: #d6d2c6; --ink: #1b1e2c; --muted: #5d6075;
  --flame: #a85f07; --sky: #5a46c9; --tide: #18786b; --rose: #b13049; --gold: #8f6410;
  --shadow: 0 14px 36px rgba(30, 30, 50, .14); color-scheme: light;
}
.acc-flame { --acc: var(--flame); } .acc-sky { --acc: var(--sky); } .acc-tide { --acc: var(--tide); } .acc-rose { --acc: var(--rose); } .acc-gold { --acc: var(--gold); }
:root, [class*="acc-"] { --acc-soft: color-mix(in srgb, var(--acc) 14%, transparent); }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 120px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--acc); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.015em; }
p { margin: 0; }
.label { font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ref { font-family: var(--mono); font-size: 12.5px; color: var(--acc); letter-spacing: .02em; }
.muted { color: var(--muted); }
.soft { --acc-soft: color-mix(in srgb, var(--acc) 14%, transparent); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--display); font-weight: 700; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.icon-btn:hover { color: var(--ink); border-color: var(--gold); }
.icon-btn svg { width: 16px; height: 16px; }
.lang-switch { display: inline-flex; height: 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; flex: none; }
.lang-switch button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 0 11px; font: 600 12px/1 var(--body); cursor: pointer; min-width: 38px; }
.lang-switch button[lang="ta"] { font-family: "Noto Sans Tamil", var(--body); font-size: 13px; }
.lang-switch button[aria-pressed="true"] { background: var(--gold); color: var(--bg); }
@media (max-width: 560px) { .hide-sm { display: none; } .brand-name { font-size: 16px; } }

/* Tamil typography */
html[lang="ta"] { --display: "Noto Sans Tamil", "Bricolage Grotesque", system-ui, sans-serif; --body: "Noto Sans Tamil", "Nunito Sans", system-ui, sans-serif; }
html[lang="ta"] body { line-height: 1.75; font-size: 16px; }
html[lang="ta"] body * { letter-spacing: normal !important; }
html[lang="ta"] h1, html[lang="ta"] h2, html[lang="ta"] h3 { line-height: 1.4; }
html[lang="ta"] .shead h1, html[lang="ta"] .hero h1 { font-size: clamp(28px, 3.8vw, 44px); }
html[lang="ta"] .sec-h h2 { font-size: clamp(21px, 2.8vw, 28px); }
html[lang="ta"] main { overflow-wrap: anywhere; }

/* shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100vh - 60px); }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 59px); align-self: start; height: calc(100vh - 59px - env(safe-area-inset-top, 0px)); overflow-y: auto; border-right: 1px solid var(--line); padding: 18px 10px 30px max(10px, env(safe-area-inset-left, 0px)); display: grid; align-content: start; gap: 2px; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--muted); text-decoration: none; font-size: 15.5px; line-height: 1.3; }
.rail a .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); flex: none; opacity: .6; }
.rail a:hover { color: var(--ink); background: var(--bg-2); }
.rail a[aria-current="page"] { color: var(--ink); background: var(--acc-soft); }
.rail a[aria-current="page"] .dot { opacity: 1; box-shadow: 0 0 10px var(--acc); }
.rail .sub { padding-left: 29px; font-size: 14px; }
.rail .sub.on { color: var(--ink); }
.rail .label { margin: 16px 10px 6px; }
main { min-width: 0; padding-block: 26px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.plate { max-width: 1080px; margin: 0 auto; display: grid; gap: 44px; grid-template-columns: minmax(0, 1fr); animation: rise .45s ease both; }
@keyframes rise { from { transform: translateY(8px); opacity: .5; } to { transform: none; opacity: 1; } }
.tabbar { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; text-decoration: none; color: var(--muted); font-size: 11.5px; line-height: 1.2; text-align: center; border-radius: 8px; }
  .tabbar a i { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }
  .tabbar a[aria-current="page"] { color: var(--ink); background: var(--acc-soft); }
}

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.hero h1 { font-size: clamp(36px, 5.6vw, 64px); }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero .lede { font-size: 19.5px; color: var(--muted); margin-top: 14px; max-width: 58ch; }
.atlas { width: 100%; max-width: 480px; justify-self: center; aspect-ratio: 1; }
.atlas svg { width: 100%; height: 100%; overflow: visible; }
.atlas .orb { cursor: pointer; transition: transform .3s; transform-box: fill-box; transform-origin: center; }
.atlas .orb:hover, .atlas .orb:focus-visible { transform: scale(1.06); }
.atlas text { font-family: var(--display); font-weight: 700; fill: var(--ink); font-size: 15px; }
.atlas .sm { font-family: var(--mono); font-size: 10px; fill: var(--muted); font-weight: 400; letter-spacing: .1em; }
.spin { animation: spin 90s linear infinite; transform-origin: 250px 250px; }
@keyframes spin { to { transform: rotate(360deg); } }
.study-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 14px; }
.scard { display: grid; gap: 8px; align-content: start; padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); position: relative; overflow: hidden; transition: transform .2s, border-color .2s; }
.scard::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--acc); }
.scard:hover { transform: translateY(-3px); border-color: var(--acc); }
.scard h3 { font-size: 22px; }
.scard p { color: var(--muted); font-size: 15.5px; line-height: 1.5; }
.scard .n { font-family: var(--mono); font-size: 11px; color: var(--acc); letter-spacing: .12em; text-transform: uppercase; }
.bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--acc); }

/* study head */
.shead { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 24px; align-items: center; }
.shead h1 { font-size: clamp(32px, 5vw, 54px); }
.shead .tag { font-size: 20px; color: var(--muted); margin-top: 10px; max-width: 60ch; }
.sglyph { width: 100%; max-width: 220px; aspect-ratio: 1; justify-self: center; }
.sglyph svg { width: 100%; height: 100%; }
.verse-band { border-left: 3px solid var(--acc); padding: 6px 0 6px 16px; font-style: italic; font-size: 19px; max-width: 70ch; }
.verse-band .ref { display: block; font-style: normal; margin-top: 4px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 59px); z-index: 15; display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.toc a { flex: none; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; white-space: nowrap; }
.toc a:hover, .toc a.on { color: var(--ink); border-color: var(--acc); background: var(--acc-soft); }

/* sections */
.sec { display: grid; gap: 18px; scroll-margin-top: 120px; }
.sec-h { display: flex; gap: 14px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 22px; }
.sec-h h2 { font-size: clamp(24px, 3.4vw, 32px); }
.sec-h .kind { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); }
.lead { font-size: 18.5px; color: var(--muted); max-width: 70ch; }
.prose { display: grid; gap: 14px; max-width: 70ch; }
.prose p { font-size: 18px; }
strong, b { font-weight: 700; }
.done-btn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); cursor: pointer; }
.done-btn[aria-pressed="true"] { color: var(--bg); background: var(--acc); border-color: var(--acc); }

.verses { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.verse { padding: 14px 16px; border-top: 2px solid var(--acc); font-style: italic; background: linear-gradient(var(--acc-soft), transparent 80%); border-radius: 0 0 8px 8px; }
.verse .ref { display: block; font-style: normal; margin-bottom: 4px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.card { display: grid; align-content: start; gap: 8px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-align: left; min-width: 0; transition: border-color .2s, transform .2s; }
button.card { cursor: pointer; }
button.card:hover { border-color: var(--acc); transform: translateY(-2px); }
.card h3 { font-size: 19px; }
.card p { color: var(--muted); font-size: 15.5px; line-height: 1.5; }
.card .tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--acc); }
.card .more { font-family: var(--mono); font-size: 11px; color: var(--acc); }

.panel { padding: 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg-2); display: grid; gap: 8px; align-content: start; min-width: 0; }
.panel.hi { border-color: var(--acc); background: var(--acc-soft); }
.detail { animation: rise .3s both; }
.note { color: var(--muted); font-size: 14.5px; font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 14px; line-height: 1.3; text-align: left; }
.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--acc-soft); color: var(--ink); border-color: var(--acc); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--acc); background: var(--acc); color: var(--bg); cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--acc); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* radial map */
.map { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.map-fig { width: 100%; max-width: 560px; justify-self: center; }
.map-fig svg { width: 100%; height: auto; overflow: visible; display: block; }
.mnode { cursor: pointer; }
.mnode rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: fill .25s, stroke .25s; }
.mnode text { fill: var(--ink); font-family: var(--body); font-size: 13px; font-weight: 600; }
.mnode:hover rect, .mnode.on rect { stroke: var(--acc); fill: var(--acc-soft); }
.mcenter circle { fill: var(--acc); }
.mcenter text { fill: var(--bg); font-family: var(--display); font-weight: 700; font-size: 15px; }
.medge { stroke: var(--line); stroke-width: 1.5; fill: none; transition: stroke .25s; }
.medge.on { stroke: var(--acc); stroke-width: 2.5; }
.map-side { position: sticky; top: 130px; }

/* cycle */
.cycle { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; }
.cycle-fig svg { width: 100%; max-width: 460px; height: auto; display: block; margin: auto; overflow: visible; }
.cnode { cursor: pointer; }
.cnode circle { fill: var(--surface); stroke: var(--line); stroke-width: 2; transition: all .3s; }
.cnode.on circle { fill: var(--acc); stroke: var(--acc); }
.cnode .num { fill: var(--ink); font-family: var(--mono); font-size: 13px; }
.cnode.on .num { fill: var(--bg); }
.cnode .lbl { fill: var(--ink); font-family: var(--body); font-size: 12.5px; font-weight: 600; }
.carc { stroke: var(--line); stroke-width: 2; fill: none; }
.carc.on { stroke: var(--acc); }

/* flowchart */
.flow { display: grid; gap: 0; justify-items: center; padding: 18px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-2); overflow-x: auto; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px) minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; max-width: 1000px; }
.fnode { grid-column: 2; width: 100%; text-align: left; display: grid; gap: 4px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .2s, box-shadow .2s; }
.fnode:hover, .fnode.on { border-color: var(--acc); box-shadow: 0 0 0 4px var(--acc-soft); }
.fnode b { font-size: 16px; display: flex; gap: 10px; align-items: baseline; }
.fnode b .n { font-family: var(--mono); font-size: 11px; color: var(--acc); flex: none; }
.fnode .fp { font-size: 15px; color: var(--muted); }
.fnode.q { border-style: dashed; border-color: var(--acc); }
.fnode.q b::before { content: "◆"; color: var(--acc); font-size: 12px; }
.fnode.end { background: var(--acc-soft); border-color: var(--acc); }
.fside { grid-column: 3; font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--line); color: var(--muted); position: relative; }
.fside::before { content: "→"; position: absolute; left: -14px; top: 50%; transform: translateY(-50%); color: var(--acc); }
.fside b { color: var(--ink); display: block; font-size: 14px; }
.fleft { grid-column: 1; font-size: 13px; color: var(--muted); text-align: right; }
.farrow { width: 2px; height: 26px; background: var(--acc); opacity: .55; position: relative; margin: 2px 0; }
.farrow::after { content: ""; position: absolute; bottom: -2px; left: -5px; border: 6px solid transparent; border-top-color: var(--acc); border-bottom: 0; }
.fx { display: none; font-size: 15px; color: var(--ink); border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.fnode.on .fx { display: block; }
@media (max-width: 720px) { .frow { grid-template-columns: minmax(0, 1fr); } .fnode, .fside, .fleft { grid-column: 1; } .fside::before { content: "↳"; left: 6px; top: 8px; transform: none; } .fside { padding-left: 26px; } .fleft { text-align: left; } }

/* decision tree */
.decide { display: grid; gap: 14px; padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
.decide .q { font-size: 21px; font-family: var(--display); }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; }
.crumb { font-size: 12.5px; color: var(--muted); padding: 3px 10px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); }
.res { padding: 16px; border-radius: 10px; border: 1px solid var(--acc); background: var(--acc-soft); display: grid; gap: 8px; animation: rise .3s both; }

/* timeline */
.tl-wrap { overflow-x: auto; padding-bottom: 8px; }
.tl { display: flex; gap: 12px; position: relative; padding: 4px 2px; width: max-content; }
.tl::before { content: ""; position: absolute; left: 0; right: 0; top: 34px; height: 2px; background: linear-gradient(90deg, var(--line), var(--acc), var(--line)); }
.tl-era { display: grid; gap: 10px; align-content: start; }
.tl-era > .label { color: var(--acc); padding-left: 4px; height: 20px; }
.tl-items { display: flex; gap: 10px; }
.tli { position: relative; width: 200px; display: grid; gap: 6px; align-content: start; text-align: left; padding: 30px 12px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .2s, transform .2s; }
.tli::before { content: ""; position: absolute; top: -8px; left: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 10px var(--acc); }
.tli:hover, .tli.on { border-color: var(--acc); transform: translateY(-2px); }
.tli .y { position: absolute; top: 8px; left: 12px; font-family: var(--mono); font-size: 11px; color: var(--acc); }
.tli b { font-size: 15px; line-height: 1.3; }
.tli span { font-size: 13.5px; color: var(--muted); line-height: 1.45; }

/* lens tabs */
.lens { display: grid; gap: 12px; }
.lens-q { font-family: var(--display); font-size: 21px; }
.lens-body { padding: 18px; border-radius: var(--radius); border: 1px solid var(--acc); background: var(--acc-soft); display: grid; gap: 10px; animation: rise .3s both; }
.lens-body .crit { border-top: 1px dashed var(--line); padding-top: 10px; color: var(--muted); font-size: 15.5px; }

/* spectrum */
.spec { display: grid; gap: 14px; padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
.spec-track { position: relative; height: 10px; border-radius: 10px; background: linear-gradient(90deg, var(--sky), var(--gold), var(--flame), var(--rose)); }
.spec-ends { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
.spec input { width: 100%; accent-color: var(--acc); }

/* flip */
.flips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }

/* stepper */
.stepper { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }

.step-list button { text-align: left; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; color: var(--muted); display: flex; gap: 10px; align-items: baseline; font-size: 15px; line-height: 1.35; }

.step-card { display: grid; gap: 12px; padding: 22px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); animation: rise .3s both; }

.check { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: start; }

.check-list input { accent-color: var(--acc); margin-top: 4px; flex: none; }

  tickHint: ["Tick what fits. The bars show which kind of help to seek first; most people need more than one.", "பொருந்துவதைக் குறியுங்கள். எந்த வகை உதவியை முதலில் நாட வேண்டும் என்பதைப் பட்டைகள் காட்டும்; பெரும்பாலோருக்கு ஒன்றுக்கு மேற்பட்டது தேவை."],

  heroTitle: ["Power that flows from <em>Presence</em>", "<em>பிரசன்னத்திலிருந்து</em> பாயும் வல்லமை"],
  heroLede: ["Four deep studies on healing and the gifts, the prophetic and sonship, music and worship, and curses, demons and deliverance. Each one is read through Scripture, church history and the relational gospel: God is a loving Father, Jesus shows us exactly what He is like, and every gift flows out of union with Him.", "சுகமாக்குதலும் வரங்களும், தீர்க்கதரிசனமும் புத்திரத்துவமும், இசையும் ஆராதனையும், சாபங்கள், பிசாசுகள், விடுதலை ஆகிய நான்கு ஆழமான படிப்புகள். ஒவ்வொன்றும் வேதவாக்கியம், திருச்சபை வரலாறு, உறவுமுறை சுவிசேஷம் வழியாக வாசிக்கப்படுகிறது: தேவன் அன்புள்ள பிதா, இயேசு அவர் எப்படிப்பட்டவர் என்பதைச் சரியாகக் காட்டுகிறார், ஒவ்வொரு வரமும் அவரோடுள்ள ஐக்கியத்திலிருந்து பாய்கிறது."],
  heroVerse: { t: ["God anointed Jesus of Nazareth with the Holy Spirit and with power, and He went about doing good and healing all who were oppressed by the devil, for God was with Him.", "நாசரேத்தூரானாகிய இயேசுவைத் தேவன் பரிசுத்த ஆவியினாலும் வல்லமையினாலும் அபிஷேகம்பண்ணினார்; தேவன் அவரோடேகூட இருந்தபடியினால், அவர் நன்மைசெய்கிறவராயும், பிசாசின் வல்லமையில் அகப்பட்ட யாவரையும் குணமாக்குகிறவராயும் சுற்றித்திரிந்தார்."], r: "Acts 10:38" },
  hubCenter: ["Union with Christ", "கிறிஸ்துவோடு ஐக்கியம்"],
  mapLabel: ["Map of the four studies around union with Christ", "கிறிஸ்துவோடுள்ள ஐக்கியத்தைச் சுற்றிய நான்கு படிப்புகளின் வரைபடம்"],
  foot1: ["This atlas presents Scripture, church history and several traditions side by side so you can weigh them. It is a study aid, not medical, psychological or legal advice. Where body or mind are hurting, prayer and good medical and counselling care belong together.", "இந்த வரைபடம் வேதவாக்கியம், திருச்சபை வரலாறு, பல பாரம்பரியங்களை அருகருகே வைக்கிறது, நீங்கள் சீர்தூக்கிப் பார்க்க. இது படிப்பு உதவி மட்டுமே; மருத்துவ, உளவியல் அல்லது சட்ட ஆலோசனை அல்ல. உடலோ மனமோ வேதனைப்படும்போது ஜெபமும் நல்ல மருத்துவ, ஆலோசனை உதவியும் இணைந்தே செல்ல வேண்டும்."],
  foot2: ["Key sources: the Bible; Augustine, *City of God* 22.8; Paul Hiebert, \"The Flaw of the Excluded Middle\" (Missiology, 1982); Pew Research Center, *Tolerance and Tension* (2010); Derek Prince, *Blessing or Curse*; Neil Anderson, *The Bondage Breaker*; Charles Kraft, *Confronting Powerless Christianity*; the Prophetic Standards statement (2021).", "முக்கிய ஆதாரங்கள்: வேதாகமம்; அகஸ்டின், *தேவனுடைய நகரம்* 22.8; பால் ஹீபர்ட், \"விலக்கப்பட்ட நடுப்பகுதியின் குறைபாடு\" (Missiology, 1982); பியூ ஆய்வு மையம், *Tolerance and Tension* (2010); டெரெக் பிரின்ஸ், *ஆசீர்வாதமா சாபமா*; நீல் ஆண்டர்சன், *The Bondage Breaker*; சார்லஸ் கிராஃப்ட், *Confronting Powerless Christianity*; தீர்க்கதரிசனத் தரநிலைகள் அறிக்கை (2021)."],
  k_prose: ["read", "வாசிப்பு"], k_cards: ["explore", "ஆராய்க"], k_map: ["visual map", "காட்சி வரைபடம்"], k_cycle: ["cycle", "சுழற்சி"], k_flow: ["flowchart", "ஓட்ட வரைபடம்"], k_decide: ["decision tree", "முடிவு மரம்"], k_timeline: ["timeline", "காலவரிசை"], k_lens: ["perspectives", "கண்ணோட்டங்கள்"], k_spectrum: ["spectrum", "வரம்பு"], k_flip: ["flip cards", "திருப்பு அட்டைகள்"], k_steps: ["step by step", "படிப்படியாக"], k_table: ["comparison", "ஒப்பீடு"], k_matrix: ["matrix", "அணி"], k_check: ["self-check", "சுய ஆய்வு"], k_scale: ["balance", "தராசு"], k_pyramid: ["levels", "நிலைகள்"], k_wheel: ["word wheel", "சொல் சக்கரம்"], k_builder: ["builder", "உருவாக்கி"], k_quiz: ["quiz", "வினாடி வினா"], k_vs: ["contrast", "வேறுபாடு"]

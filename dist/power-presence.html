PP.studies.push({
  id: "power", n: 1, accent: "flame",
  title: ["Healing, Gifts, Miracles, Signs & Wonders", "சுகமாக்குதல், வரங்கள், அற்புதங்கள், அடையாளங்கள் & அதிசயங்கள்"],
  short: ["Healing & Power", "சுகமும் வல்லமையும்"], tab: ["Power", "வல்லமை"],
  tagline: ["Moving in power and authority as a beloved son or daughter, the way Jesus did: from the Father, with compassion, for people.", "இயேசு செய்தது போலவே, நேசிக்கப்பட்ட மகனாக, மகளாக வல்லமையிலும் அதிகாரத்திலும் நடத்தல்: பிதாவிடமிருந்து, மனதுருக்கத்தோடு, மனிதர்களுக்காக."],
  verse: { t: ["The Son can do nothing of Himself, but what He sees the Father do.", "பிதாவானவர் செய்யக் குமாரன் காண்கிறது எதுவோ, அதையேயன்றி, வேறொன்றையும் தாமாய்ச் செய்யமாட்டார்."], r: "John 5:19" },
  sections: [
    { id: "big", type: "prose", title: ["The big picture: the Kingdom breaking in", "பெரிய படம்: உள்நுழையும் ராஜ்யம்"], short: ["Big picture", "பெரிய படம்"],
      paras: [
        ["Healing and miracles are not side attractions in the Bible. They are what it looks like when the reign of God touches a broken world. Jesus announced His mission from Isaiah 61: good news to the poor, release to captives, sight to the blind, freedom for the oppressed (Luke 4:18). Then He did exactly that.", "சுகமாக்குதலும் அற்புதங்களும் வேதாகமத்தின் பக்கக் காட்சிகள் அல்ல. உடைந்த உலகத்தை தேவனுடைய ஆட்சி தொடும்போது அது இப்படித்தான் தெரியும். இயேசு ஏசாயா 61-லிருந்து தம் பணியை அறிவித்தார்: ஏழைகளுக்கு நற்செய்தி, சிறைப்பட்டவர்களுக்கு விடுதலை, குருடருக்குப் பார்வை, நொறுக்கப்பட்டவர்களுக்கு விடுதலை (லூக்கா 4:18). பிறகு அதையே செய்தார்."],
        ["About one fifth of the Gospel material deals with healing and deliverance. Jesus sent the Twelve and then the Seventy to do the same works (Luke 9:1–2; 10:9), and promised that believers would do \"the works that I do\" (John 14:12). The book of Acts shows ordinary believers, not only apostles, carrying that power: Stephen, Philip, Ananias.", "சுவிசேஷங்களின் ஏறக்குறைய ஐந்தில் ஒரு பங்கு சுகமாக்குதல், விடுதலை பற்றியது. இயேசு பன்னிருவரையும் பின்னர் எழுபதுபேரையும் அதே கிரியைகளைச் செய்ய அனுப்பினார் (லூக்கா 9:1–2; 10:9); \"நான் செய்கிற கிரியைகளை\" விசுவாசிகளும் செய்வார்கள் என்றார் (யோவான் 14:12). அப்போஸ்தலர் மட்டுமல்ல, ஸ்தேவான், பிலிப்பு, அனனியா போன்ற சாதாரண விசுவாசிகளும் அந்த வல்லமையைச் சுமந்ததை அப்போஸ்தலர் நடபடிகள் காட்டுகிறது."],
        ["**The relational key:** Jesus did not heal to prove a doctrine or to build a platform. He was \"moved with compassion\" (Matt 14:14), and He only did what He saw the Father doing (John 5:19). Power in the New Testament is never a technique detached from love. It flows out of union: \"apart from Me you can do nothing\" (John 15:5), and without love even miracle-working faith is \"nothing\" (1 Cor 13:2).", "**உறவுமுறைத் திறவுகோல்:** ஒரு கோட்பாட்டை நிரூபிக்கவோ ஒரு மேடையைக் கட்டவோ இயேசு சுகமாக்கவில்லை. அவர் \"மனதுருகினார்\" (மத்தேயு 14:14); பிதா செய்வதைக் கண்டதையே செய்தார் (யோவான் 5:19). புதிய ஏற்பாட்டில் வல்லமை ஒருபோதும் அன்பிலிருந்து பிரிந்த நுட்பம் அல்ல. அது ஐக்கியத்திலிருந்து பாய்கிறது: \"என்னையன்றி உங்களால் ஒன்றும் செய்யக்கூடாது\" (யோவான் 15:5); அன்பில்லாவிட்டால் மலைகளைப் பெயர்க்கும் விசுவாசமும் \"ஒன்றுமில்லை\" (1 கொரிந்தியர் 13:2)."]
      ],
      verses: [
        { t: ["Heal the sick, cleanse the lepers, raise the dead, cast out demons. Freely you have received, freely give.", "வியாதியுள்ளவர்களைச் சொஸ்தமாக்குங்கள், குஷ்டரோகிகளைச் சுத்தமாக்குங்கள், மரித்தோரை எழுப்புங்கள், பிசாசுகளைத் துரத்துங்கள்; இலவசமாய்ப் பெற்றீர்கள், இலவசமாய்க் கொடுங்கள்."], r: "Matt 10:8" },
        { t: ["For this purpose the Son of God was manifested, that He might destroy the works of the devil.", "பிசாசின் கிரியைகளை அழிக்கும்படிக்கே தேவனுடைய குமாரன் வெளிப்பட்டார்."], r: "1 John 3:8" },
        { t: ["Jesus Christ is the same yesterday, today, and forever.", "இயேசுகிறிஸ்து நேற்றும் இன்றும் என்றும் மாறாதவராயிருக்கிறார்."], r: "Heb 13:8" }
      ] },

    { id: "authority", type: "flow", title: ["Authority and power: where it comes from and how it flows", "அதிகாரமும் வல்லமையும்: எங்கிருந்து வருகிறது, எப்படிப் பாய்கிறது"], short: ["Authority & power", "அதிகாரம் & வல்லமை"],
      lead: ["Two Greek words matter. *Exousia* is authority: the right to act, like a police officer's badge. *Dunamis* is power: the ability to act, like the strength to stop a truck. Jesus gave His disciples both (Luke 9:1). Tap each box to open it.", "இரண்டு கிரேக்கச் சொற்கள் முக்கியம். *எக்ஸூசியா* அதிகாரம்: செயல்படும் உரிமை, காவலரின் அடையாள பதக்கம் போல. *டுனாமிஸ்* வல்லமை: செயல்படும் திறன், லாரியை நிறுத்தும் பலம் போல. இயேசு தம் சீஷருக்கு இரண்டையும் கொடுத்தார் (லூக்கா 9:1). ஒவ்வொரு பெட்டியையும் தொட்டுத் திறங்கள்."],
      steps: [
        { h: ["The Father: source of all authority", "பிதா: எல்லா அதிகாரத்தின் மூலம்"], p: ["Love is the origin; power serves love.", "அன்பே மூலம்; வல்லமை அன்புக்குச் சேவை செய்கிறது."], x: ["All authority belongs to God and is exercised in love. He is not a distant power-broker but a Father who delights to give good gifts (Luke 11:13).", "எல்லா அதிகாரமும் தேவனுடையது, அன்பில் செயல்படுகிறது. அவர் தூரத்தில் இருக்கும் அதிகார வியாபாரி அல்ல; நல்ல ஈவுகளைக் கொடுக்க மகிழும் பிதா (லூக்கா 11:13)."], r: "Rom 13:1" },
        { h: ["The Son: all authority given to Him", "குமாரன்: எல்லா அதிகாரமும் அவருக்குக் கொடுக்கப்பட்டது"], p: ["Won back at the cross and resurrection.", "சிலுவையிலும் உயிர்த்தெழுதலிலும் மீட்கப்பட்டது."], x: ["\"All authority has been given to Me in heaven and on earth\" (Matt 28:18). At the cross He disarmed principalities and powers (Col 2:15). Every believer's authority is borrowed authority: it is His name, not ours.", "\"வானத்திலும் பூமியிலும் சகல அதிகாரமும் எனக்குக் கொடுக்கப்பட்டிருக்கிறது\" (மத்தேயு 28:18). சிலுவையில் துரைத்தனங்களையும் அதிகாரங்களையும் உரிந்துகொண்டார் (கொலோசெயர் 2:15). ஒவ்வொரு விசுவாசியின் அதிகாரமும் கடனாகப் பெற்றது: அது அவருடைய நாமம், நம்முடையதல்ல."], r: "Matt 28:18" },
        { h: ["The Spirit: power poured out", "ஆவியானவர்: ஊற்றப்பட்ட வல்லமை"], p: ["Dunamis comes with the Spirit's coming.", "ஆவியானவரின் வருகையோடு டுனாமிஸ் வருகிறது."], x: ["\"You shall receive power when the Holy Spirit has come upon you\" (Acts 1:8). Even Jesus ministered as a man anointed by the Spirit (Acts 10:38), which is why His life is a pattern we can follow.", "\"பரிசுத்த ஆவி உங்களிடத்தில் வரும்போது நீங்கள் பெலனடைவீர்கள்\" (அப்போஸ்தலர் 1:8). இயேசுவும் ஆவியினால் அபிஷேகம் பெற்ற மனிதராகவே ஊழியம் செய்தார் (அப்போஸ்தலர் 10:38); அதனால்தான் அவர் வாழ்க்கை நாம் பின்பற்றக்கூடிய மாதிரி."], r: "Acts 1:8" },
        { h: ["The son or daughter: seated with Christ", "மகன் அல்லது மகள்: கிறிஸ்துவோடு உட்கார்ந்திருப்பவர்"], p: ["Identity comes before activity.", "செயலுக்கு முன் அடையாளம்."], x: ["We are seated with Christ in heavenly places (Eph 2:6), far above every power (Eph 1:21). Authority is not earned by performance. It is the inheritance of sons (Gal 4:6–7) and is exercised from rest, not striving.", "நாம் கிறிஸ்துவோடு உன்னதங்களில் உட்கார்ந்திருக்கிறோம் (எபேசியர் 2:6), எல்லா அதிகாரத்துக்கும் மேலாக (எபேசியர் 1:21). அதிகாரம் செயல்திறனால் சம்பாதிப்பது அல்ல. அது புத்திரரின் சுதந்தரம் (கலாத்தியர் 4:6–7); போராட்டத்திலிருந்து அல்ல, இளைப்பாறுதலிலிருந்து செயல்படுகிறது."], r: "Eph 2:6" },
        { h: ["Is love the motive?", "அன்பே நோக்கமா?"], kind: "q", p: ["Check the heart before the hands.", "கைகளுக்கு முன் இருதயத்தைச் சோதியுங்கள்."], side: { h: ["If not: pause", "இல்லையென்றால்: நில்லுங்கள்"], p: ["Power used for status, money or control is how Simon the sorcerer thought (Acts 8:18–23).", "அந்தஸ்து, பணம், கட்டுப்பாட்டுக்காக வல்லமையைப் பயன்படுத்துவது மாயவித்தைக்காரன் சீமோனின் சிந்தனை (அப்போஸ்தலர் 8:18–23)."] } },
        { h: ["Release: speak, touch, pray, command", "விடுவித்தல்: பேசுதல், தொடுதல், ஜெபித்தல், கட்டளையிடுதல்"], p: ["Jesus used words, touch, and simple obedience.", "இயேசு வார்த்தைகள், தொடுதல், எளிய கீழ்ப்படிதலைப் பயன்படுத்தினார்."], x: ["Jesus commanded fevers and storms, laid hands on the sick, and sometimes asked people to act (\"Go, wash\"). The epistles add the elders' prayer with oil (Jas 5:14–16) and the gifts given through the body (1 Cor 12).", "இயேசு காய்ச்சலுக்கும் புயலுக்கும் கட்டளையிட்டார், நோயாளிகள்மேல் கைகளை வைத்தார், சிலநேரம் மக்களைச் செயல்படச் சொன்னார் (\"போய்க் கழுவு\"). நிருபங்கள் மூப்பர்கள் எண்ணெய் பூசி ஜெபிப்பதையும் (யாக்கோபு 5:14–16) சரீரத்தின் மூலம் கொடுக்கப்படும் வரங்களையும் (1 கொரிந்தியர் 12) சேர்க்கின்றன."], r: "Mark 16:17–18" },
        { h: ["Fruit: people healed, God glorified, love multiplied", "கனி: மக்கள் சுகமடைதல், தேவன் மகிமைப்படுதல், அன்பு பெருகுதல்"], kind: "end", p: ["The goal is the Father seen, not the minister admired.", "நோக்கம் பிதா காணப்படுவது, ஊழியர் போற்றப்படுவது அல்ல."], r: "Matt 5:16" }
      ] },

    { id: "gifts", type: "cards", title: ["The gifts of the Spirit", "ஆவியின் வரங்கள்"], short: ["Gifts", "வரங்கள்"],
      lead: ["Paul lists nine manifestations in 1 Corinthians 12:7–11. A common teaching grouping is three that reveal, three that speak and three that act. Other lists add serving, teaching, giving, leading and mercy (Rom 12:6–8) and the equipping roles of Ephesians 4:11. Open any card.", "1 கொரிந்தியர் 12:7–11-ல் பவுல் ஒன்பது வெளிப்பாடுகளைக் குறிப்பிடுகிறார். பொதுவான போதனை வகைப்பாடு: வெளிப்படுத்தும் மூன்று, பேசும் மூன்று, செயல்படும் மூன்று. மற்ற பட்டியல்கள் ஊழியம், போதித்தல், கொடுத்தல், நடத்துதல், இரக்கம் (ரோமர் 12:6–8), எபேசியர் 4:11-ன் தகுதிப்படுத்தும் ஊழியங்களைச் சேர்க்கின்றன. எந்த அட்டையையும் திறங்கள்."],
      items: [
        { tag: ["Reveal", "வெளிப்படுத்தல்"], h: ["Word of wisdom", "ஞானத்தைப் போதிக்கும் வசனம்"], p: ["Divine insight into what to do next.", "அடுத்து என்ன செய்வது என்பதற்கான தேவ உள்ளொளி."], r: "1 Cor 12:8", more: [["A Spirit-given understanding of how to apply God's purposes in a situation. Example: Jesus' answer about paying taxes to Caesar (Matt 22:21), or the Jerusalem council's decision (Acts 15:28).", "ஒரு சூழ்நிலையில் தேவனுடைய நோக்கங்களை எப்படிப் பயன்படுத்துவது என்ற ஆவியின் புரிதல். உதாரணம்: இராயனுக்கு வரி பற்றிய இயேசுவின் பதில் (மத்தேயு 22:21), எருசலேம் சங்கத்தின் தீர்மானம் (அப்போஸ்தலர் 15:28)."], ["**Practice:** ask, \"Father, what are You doing here?\" before giving advice. **Caution:** wisdom from above is \"pure, peaceable, gentle\" (Jas 3:17), never controlling.", "**நடைமுறை:** ஆலோசனை சொல்லும் முன் \"பிதாவே, இங்கே நீர் என்ன செய்கிறீர்?\" என்று கேளுங்கள். **எச்சரிக்கை:** மேலிருந்து வரும் ஞானம் \"சுத்தமும், சமாதானமும், சாந்தமும்\" உள்ளது (யாக்கோபு 3:17), ஒருபோதும் கட்டுப்படுத்துவது அல்ல."]] },
        { tag: ["Reveal", "வெளிப்படுத்தல்"], h: ["Word of knowledge", "அறிவை உணர்த்தும் வசனம்"], p: ["A fact you could not naturally know.", "இயல்பாக அறிய முடியாத ஓர் உண்மை."], r: "1 Cor 12:8", more: [["Jesus knew the Samaritan woman's history (John 4:18) and Nathanael under the fig tree (John 1:48). In healing ministry it often comes as an impression, a picture or a sympathetic pain that points to someone God wants to touch.", "சமாரிய ஸ்திரீயின் வரலாற்றையும் (யோவான் 4:18) அத்திமரத்தின் கீழிருந்த நாத்தான்வேலையும் (யோவான் 1:48) இயேசு அறிந்திருந்தார். சுகமாக்கும் ஊழியத்தில் இது பெரும்பாலும் ஓர் உணர்வாக, படமாக, அல்லது தேவன் தொட விரும்பும் ஒருவரைச் சுட்டும் உடல் உணர்வாக வருகிறது."], ["Notice the purpose in John 4: knowledge led to dignity and worship, not exposure and shame.", "யோவான் 4-ன் நோக்கத்தைக் கவனியுங்கள்: அறிவு மானத்துக்கும் ஆராதனைக்கும் வழிநடத்தியது, அம்பலப்படுத்தலுக்கும் அவமானத்துக்கும் அல்ல."]] },
        { tag: ["Reveal", "வெளிப்படுத்தல்"], h: ["Discerning of spirits", "ஆவிகளைப் பகுத்தறிதல்"], p: ["Sensing what spirit is at work.", "எந்த ஆவி செயல்படுகிறது என்று உணர்தல்."], r: "1 Cor 12:10", more: [["The ability to distinguish the Holy Spirit, the human spirit and evil spirits. Paul discerned a spirit of divination behind a slave girl's true-sounding words (Acts 16:16–18).", "பரிசுத்த ஆவி, மனித ஆவி, தீய ஆவிகளை வேறுபடுத்தும் திறன். உண்மையாகத் தோன்றிய ஓர் அடிமைப் பெண்ணின் வார்த்தைகளுக்குப் பின்னால் குறிசொல்லும் ஆவியைப் பவுல் பகுத்தறிந்தார் (அப்போஸ்தலர் 16:16–18)."], ["Discernment is not suspicion. It grows with maturity (Heb 5:14) and always serves freedom, never accusation.", "பகுத்தறிவு சந்தேகம் அல்ல. அது முதிர்ச்சியோடு வளர்கிறது (எபிரெயர் 5:14); எப்போதும் விடுதலைக்குச் சேவை செய்கிறது, குற்றஞ்சாட்டுதலுக்கு அல்ல."]] },
        { tag: ["Speak", "பேசுதல்"], h: ["Prophecy", "தீர்க்கதரிசனம்"], p: ["Speaking God's heart to build up.", "கட்டியெழுப்ப தேவனுடைய இருதயத்தைப் பேசுதல்."], r: "1 Cor 14:3", more: [["New Testament prophecy edifies, exhorts and comforts (1 Cor 14:3) and is weighed by others (14:29). See Study 2 for a full treatment.", "புதிய ஏற்பாட்டுத் தீர்க்கதரிசனம் பக்திவிருத்தி, புத்தி, ஆறுதல் தருகிறது (1 கொரிந்தியர் 14:3); மற்றவர்களால் சீர்தூக்கப்படுகிறது (14:29). முழு விளக்கத்துக்குப் படிப்பு 2-ஐப் பாருங்கள்."]] },
        { tag: ["Speak", "பேசுதல்"], h: ["Tongues", "அந்நிய பாஷைகள்"], p: ["Prayer and praise beyond the mind.", "மனதைக் கடந்த ஜெபமும் துதியும்."], r: "1 Cor 14:2", more: [["Speaking in a language not learned, either to God in private devotion (1 Cor 14:2, 14) or in a gathering when it is interpreted (14:27). Paul valued it (\"I thank God I speak in tongues more than you all\", 14:18) yet put love and understanding first.", "கற்றுக்கொள்ளாத மொழியில் பேசுதல்: தனிப்பட்ட ஜெபத்தில் தேவனிடம் (1 கொரிந்தியர் 14:2, 14), அல்லது சபையில் வியாக்கியானத்தோடு (14:27). பவுல் அதை மதித்தார் (\"உங்கள் எல்லாரைப் பார்க்கிலும் நான் அதிகமாய் அந்நியபாஷைகளில் பேசுகிறேன்\", 14:18); ஆனாலும் அன்பையும் புரிதலையும் முதலில் வைத்தார்."]] },
        { tag: ["Speak", "பேசுதல்"], h: ["Interpretation of tongues", "பாஷைகளை வியாக்கியானம்பண்ணுதல்"], p: ["Making a tongue understandable.", "பாஷையைப் புரியும்படி செய்தல்."], r: "1 Cor 14:13", more: [["Not a word-for-word translation but conveying the meaning, so the whole church is built up. Paul's rule: in the gathering, without interpretation, keep silent and pray privately (14:28).", "வார்த்தைக்கு வார்த்தை மொழிபெயர்ப்பு அல்ல; முழு சபையும் பக்திவிருத்தியடைய அர்த்தத்தைச் சொல்லுதல். பவுலின் விதி: சபையில் வியாக்கியானம் இல்லாவிட்டால், அமைதியாயிருந்து தனக்குள் ஜெபிக்கவும் (14:28)."]] },
        { tag: ["Act", "செயல்"], h: ["Faith (the gift)", "விசுவாசம் (வரம்)"], p: ["A surge of certainty for a specific moment.", "குறிப்பிட்ட தருணத்துக்கான உறுதியின் எழுச்சி."], r: "1 Cor 12:9", more: [["Different from saving faith every believer has. It is a sudden, God-given confidence that He will act now, like Elijah on Carmel (1 Kgs 18) or Peter at the temple gate (Acts 3:6).", "எல்லா விசுவாசிகளுக்கும் உள்ள இரட்சிக்கும் விசுவாசத்திலிருந்து வேறானது. தேவன் இப்போதே செயல்படுவார் என்ற திடீர், தேவன் கொடுக்கும் நம்பிக்கை: கர்மேலில் எலியா (1 இராஜாக்கள் 18), தேவாலய வாசலில் பேதுரு (அப்போஸ்தலர் 3:6) போல."]] },
        { tag: ["Act", "செயல்"], h: ["Gifts of healings", "குணமாக்கும் வரங்கள்"], p: ["Plural in Greek: many kinds, many occasions.", "கிரேக்கத்தில் பன்மை: பல வகைகள், பல சந்தர்ப்பங்கள்."], r: "1 Cor 12:9", more: [["Paul writes *charismata iamatōn*, \"gifts of healings\", both plural. Many teachers take this to mean each healing is itself a gift given to the sick person through the one who prays, rather than a permanent power owned by a minister.", "பவுல் *கரிஸ்மாட்டா இயாமாட்டோன்*, \"குணமாக்கும் வரங்கள்\" என்று இரண்டையும் பன்மையில் எழுதுகிறார். ஒவ்வொரு சுகமும் ஜெபிப்பவர் மூலம் நோயாளிக்குக் கொடுக்கப்படும் வரம்; ஓர் ஊழியர் சொந்தமாக வைத்திருக்கும் நிரந்தர வல்லமை அல்ல என்று பல போதகர்கள் விளக்குகிறார்கள்."], ["That keeps the focus on the person and on God, and frees ordinary believers to pray.", "இது கவனத்தை அந்த மனிதர்மேலும் தேவன்மேலும் வைக்கிறது; சாதாரண விசுவாசிகளும் ஜெபிக்கச் சுதந்தரம் தருகிறது."]] },
        { tag: ["Act", "செயல்"], h: ["Working of miracles", "அற்புதங்களைச் செய்தல்"], p: ["Power that overrides the natural order.", "இயற்கை ஒழுங்கைக் கடக்கும் வல்லமை."], r: "1 Cor 12:10", more: [["*Energēmata dunameōn*, \"operations of powers\". Examples: calming the storm, multiplying food, Paul's handkerchiefs (Acts 19:11–12), Peter's shadow (Acts 5:15). Miracles in Scripture are signs: they point beyond themselves to who Jesus is (John 20:30–31).", "*எனர்ஜேமாட்டா டுனாமியோன்*, \"வல்லமைகளின் செயல்பாடுகள்\". உதாரணங்கள்: புயலை அமர்த்துதல், உணவைப் பெருக்குதல், பவுலின் உறுமால்கள் (அப்போஸ்தலர் 19:11–12), பேதுருவின் நிழல் (அப்போஸ்தலர் 5:15). வேதத்தில் அற்புதங்கள் அடையாளங்கள்: அவை இயேசு யார் என்பதைச் சுட்டுகின்றன (யோவான் 20:30–31)."]] }
      ] },

    { id: "healing-map", type: "map", title: ["How God heals: a visual map", "தேவன் எப்படிச் சுகமாக்குகிறார்: காட்சி வரைபடம்"], short: ["How God heals", "எப்படிச் சுகம்"],
      center: ["God our Healer", "சுகமாக்கும் தேவன்"],
      hint: ["Scripture shows many channels, not one formula. Jesus rarely healed the same way twice.", "வேதம் ஒரே சூத்திரத்தை அல்ல, பல வழிகளைக் காட்டுகிறது. இயேசு ஒரே முறையில் இருமுறை சுகமாக்கியது அரிது."],
      nodes: [
        { h: ["Word & command", "வார்த்தை & கட்டளை"], r: "Ps 107:20; Matt 8:8", p: ["\"He sent His word and healed them.\" The centurion understood authority: \"only speak a word\".", "\"அவர் தம்முடைய வசனத்தை அனுப்பி அவர்களைக் குணமாக்கினார்.\" நூற்றுக்கு அதிபதி அதிகாரத்தைப் புரிந்துகொண்டான்: \"ஒரு வார்த்தை மாத்திரம் சொல்லும்\"."] },
        { h: ["Touch & laying on of hands", "தொடுதல் & கைவைத்தல்"], r: "Mark 16:18; Luke 4:40", p: ["Jesus touched lepers whom no one would touch. Healing restores dignity and belonging, not just bodies.", "யாரும் தொடாத குஷ்டரோகிகளை இயேசு தொட்டார். சுகம் உடலை மட்டுமல்ல, மானத்தையும் உறவையும் மீட்டெடுக்கிறது."] },
        { h: ["Elders, oil & confession", "மூப்பர்கள், எண்ணெய் & அறிக்கை"], r: "Jas 5:14–16", p: ["Healing in community: oil, prayer of faith, mutual confession. Body, soul and relationships heal together.", "சமூகத்தில் சுகம்: எண்ணெய், விசுவாச ஜெபம், ஒருவருக்கொருவர் அறிக்கை. உடல், ஆத்துமா, உறவுகள் இணைந்து சுகமடைகின்றன."] },
        { h: ["The Lord's Table", "கர்த்தருடைய பந்தி"], r: "1 Cor 11:29–30", p: ["Paul links discerning the Lord's body with health. Many traditions pray for healing at Communion; relationally, it is also discerning one another as His body.", "கர்த்தருடைய சரீரத்தை நிதானித்தறிவதைப் பவுல் ஆரோக்கியத்தோடு இணைக்கிறார். பல பாரம்பரியங்கள் திருவிருந்தில் சுகத்துக்காக ஜெபிக்கின்றன; உறவுமுறையில் இது ஒருவரையொருவர் அவருடைய சரீரமாக மதிப்பதுமாகும்."] },
        { h: ["Faith of the sick or friends", "நோயாளி அல்லது நண்பர்களின் விசுவாசம்"], r: "Mark 5:34; Mark 2:5", p: ["Sometimes the sick person's faith (\"your faith has made you well\"), sometimes friends' faith (the roof was opened), sometimes no faith at all (Lazarus was dead).", "சிலநேரம் நோயாளியின் விசுவாசம் (\"உன் விசுவாசம் உன்னை இரட்சித்தது\"), சிலநேரம் நண்பர்களின் விசுவாசம் (கூரை பிரிக்கப்பட்டது), சிலநேரம் விசுவாசமே இல்லை (லாசரு மரித்திருந்தான்)."] },
        { h: ["Deliverance", "விடுதலை"], r: "Luke 13:11–16", p: ["Some sickness had a spirit behind it (\"a spirit of infirmity\"); most healings in the Gospels did not. Discern, don't assume. See Study 4.", "சில நோய்களுக்குப் பின்னால் ஆவி இருந்தது (\"பலவீனப்படுத்தும் ஆவி\"); சுவிசேஷங்களின் பெரும்பாலான சுகங்களில் அப்படி இல்லை. ஊகிக்காமல் பகுத்தறியுங்கள். படிப்பு 4-ஐப் பாருங்கள்."] },
        { h: ["Medicine & means", "மருத்துவமும் வழிமுறைகளும்"], r: "Isa 38:21; 1 Tim 5:23; Col 4:14", p: ["Isaiah prescribed a fig poultice; Paul told Timothy to take wine for his stomach; Luke was a physician. Doctors are allies of God's healing, not rivals of faith.", "ஏசாயா அத்திப்பழ அடையைப் பரிந்துரைத்தார்; வயிற்றுக்காகத் திராட்சரசம் சாப்பிடச் சொன்னார் பவுல்; லூக்கா ஒரு வைத்தியர். மருத்துவர்கள் தேவனுடைய சுகத்தின் கூட்டாளிகள், விசுவாசத்தின் போட்டியாளர்கள் அல்ல."] },
        { h: ["Inner healing of the heart", "இருதயத்தின் உள்சுகம்"], r: "Ps 147:3; Luke 4:18", p: ["\"He heals the brokenhearted.\" Trauma, shame and unforgiveness can keep bodies and minds unwell; healing the story often precedes healing the symptom.", "\"இருதயம் நொறுங்குண்டவர்களை அவர் குணமாக்குகிறார்.\" அதிர்ச்சி, வெட்கம், மன்னியாமை உடலையும் மனதையும் நோயில் வைத்திருக்கலாம்; அறிகுறி சுகமாவதற்கு முன் கதை சுகமாவது அடிக்கடி நடக்கிறது."] }
      ] },

    { id: "history", type: "timeline", title: ["Healing and miracles through church history", "திருச்சபை வரலாற்றில் சுகமும் அற்புதங்களும்"], short: ["History", "வரலாறு"],
      lead: ["The claim that miracles stopped with the apostles is not what the early church reported. Scroll the timeline and tap an event.", "அற்புதங்கள் அப்போஸ்தலரோடு நின்றுவிட்டன என்ற கூற்றை ஆதித் திருச்சபை சொல்லவில்லை. காலவரிசையை நகர்த்தி ஒரு நிகழ்வைத் தொடுங்கள்."],
      eras: [
        { era: ["Early church", "ஆதித் திருச்சபை"], items: [
          { y: "c. 155", h: ["Justin Martyr", "ஜஸ்டின் மார்டிர்"], p: ["Christians cast out demons in Jesus' name where pagan exorcists failed (*Second Apology* 6).", "பிற மத மந்திரவாதிகள் தோற்ற இடத்தில் கிறிஸ்தவர்கள் இயேசுவின் நாமத்தில் பிசாசுகளைத் துரத்தினார்கள் (*இரண்டாம் மன்னிப்புரை* 6)."] },
          { y: "c. 180", h: ["Irenaeus", "ஐரேனியஸ்"], p: ["Reports healings, prophecy, tongues and even the dead raised among believers (*Against Heresies* 2.32.4).", "விசுவாசிகளிடையே சுகங்கள், தீர்க்கதரிசனம், பாஷைகள், மரித்தோர் உயிர்த்தெழுதலும் நடந்ததாகக் குறிப்பிடுகிறார் (*மதபேதங்களுக்கு எதிராக* 2.32.4)."] },
          { y: "c. 197", h: ["Tertullian", "தெர்த்துல்லியன்"], p: ["Dares Roman magistrates to bring a demonized person before a Christian and watch (*Apology* 23).", "பிசாசு பிடித்த ஒருவரை ஒரு கிறிஸ்தவர் முன் கொண்டுவந்து பாருங்கள் என்று ரோம நீதிபதிகளுக்குச் சவால் விடுகிறார் (*மன்னிப்புரை* 23)."] },
          { y: "c. 215", h: ["Apostolic Tradition", "அப்போஸ்தலிக்கப் பாரம்பரியம்"], p: ["Baptism candidates were exorcised and renounced Satan before baptism, a practice still echoed in many liturgies.", "ஞானஸ்நானம் பெறுவோர் அதற்கு முன் பேயோட்டப்பட்டு சாத்தானை மறுதலித்தனர்; பல வழிபாட்டு முறைகளில் இன்றும் இது எதிரொலிக்கிறது."] }
        ] },
        { era: ["Fathers & medieval", "பிதாக்கள் & இடைக்காலம்"], items: [
          { y: "c. 426", h: ["Augustine changes his mind", "அகஸ்டின் மனம் மாறுகிறார்"], p: ["Once doubtful, he records many healings in his own diocese and notes some 70 attested in Hippo within two years (*City of God* 22.8).", "முதலில் சந்தேகப்பட்டவர், தன் சொந்த மறைமாவட்டத்தில் பல சுகங்களைப் பதிவு செய்கிறார்; ஹிப்போவில் இரண்டு ஆண்டுகளில் ஏறக்குறைய 70 சான்றளிக்கப்பட்டதைக் குறிப்பிடுகிறார் (*தேவனுடைய நகரம்* 22.8)."] },
          { y: "500–1500", h: ["Saints, shrines & relics", "பரிசுத்தவான்கள், புனிதத்தலங்கள், திருப்பண்டங்கள்"], p: ["Healing became attached to holy people and places. Real testimonies mixed with legend and commerce, which later provoked the Reformers.", "சுகம் பரிசுத்த மனிதர்களோடும் இடங்களோடும் இணைந்தது. உண்மையான சாட்சிகள் கட்டுக்கதைகளோடும் வியாபாரத்தோடும் கலந்தன; இது பின்னர் சீர்திருத்தவாதிகளைத் தூண்டியது."] }
        ] },
        { era: ["Reformation to revival", "சீர்திருத்தம் முதல் எழுப்புதல் வரை"], items: [
          { y: "1500s", h: ["Reformers' caution", "சீர்திருத்தவாதிகளின் எச்சரிக்கை"], p: ["Calvin saw extraordinary gifts as mainly for the apostolic age; Luther, though cautious, prayed for a dying Melanchthon who recovered.", "அசாதாரண வரங்கள் பெரும்பாலும் அப்போஸ்தலர் காலத்துக்கானவை என்று கால்வின் கருதினார்; லூத்தர் எச்சரிக்கையாக இருந்தபோதும் மரணத்தருவாயிலிருந்த மெலாங்தனுக்காக ஜெபித்தார், அவர் குணமடைந்தார்."] },
          { y: "1740s", h: ["Wesley's journals", "வெஸ்லியின் நாட்குறிப்புகள்"], p: ["John Wesley records healings and deliverances during the Methodist revival.", "மெதடிஸ்ட் எழுப்புதலின்போது நடந்த சுகங்களையும் விடுதலைகளையும் ஜான் வெஸ்லி பதிவு செய்கிறார்."] },
          { y: "1842", h: ["Blumhardt: \"Jesus is Victor\"", "புளூம்ஹார்ட்: \"இயேசுவே ஜெயவீரர்\""], p: ["A German Lutheran pastor's two-year struggle for Gottliebin Dittus ends in deliverance and a local revival of repentance and healing.", "காட்லீபின் டிட்டஸுக்காக ஒரு ஜெர்மன் லூத்தரன் போதகரின் இரண்டு ஆண்டுப் போராட்டம் விடுதலையிலும் மனந்திரும்புதல், சுகம் நிறைந்த உள்ளூர் எழுப்புதலிலும் முடிகிறது."] },
          { y: "1918", h: ["Warfield's *Counterfeit Miracles*", "வார்ஃபீல்டின் *போலி அற்புதங்கள்*"], p: ["B.B. Warfield gives classic cessationism its fullest defence.", "பி.பி. வார்ஃபீல்ட் பாரம்பரிய நிறுத்தக் கோட்பாட்டுக்கு முழுமையான பாதுகாப்பைத் தருகிறார்."] }
        ] },
        { era: ["Pentecostal century", "பெந்தெகொஸ்தே நூற்றாண்டு"], items: [
          { y: "1906", h: ["Azusa Street", "அசூசா தெரு"], p: ["A multiracial revival in Los Angeles under William Seymour; tongues, healing and mission spread worldwide, including to India.", "வில்லியம் சீமோர் தலைமையில் லாஸ் ஏஞ்சல்ஸில் பல இன எழுப்புதல்; பாஷைகள், சுகம், மிஷனரி பணி இந்தியா உட்பட உலகமெங்கும் பரவியது."] },
          { y: "1905–07", h: ["Mukti revival, India", "முக்தி எழுப்புதல், இந்தியா"], p: ["At Pandita Ramabai's Mukti Mission near Pune, young women experience Spirit outpouring, repentance and tongues, alongside Azusa.", "புனே அருகே பண்டிதா ரமாபாயின் முக்தி மிஷனில் இளம் பெண்கள் ஆவியின் ஊற்றல், மனந்திரும்புதல், பாஷைகளை அனுபவிக்கிறார்கள், அசூசாவோடு ஒரே காலத்தில்."] },
          { y: "1947–58", h: ["Healing revival", "சுகமளிக்கும் எழுப்புதல்"], p: ["Mass healing campaigns (Oral Roberts, T.L. Osborn, others) take the message to stadiums worldwide, with both fruit and excess.", "பெரிய சுகமளிக்கும் கூட்டங்கள் (ஓரல் ராபர்ட்ஸ், டி.எல். ஆஸ்பர்ன் மற்றும் பலர்) இந்தச் செய்தியை உலகெங்கும் அரங்குகளுக்குக் கொண்டுசெல்கின்றன; கனியும் மிகைப்படுத்தலும் இரண்டும் இருந்தன."] },
          { y: "1960s–80s", h: ["Charismatic renewal & Third Wave", "கரிஸ்மாட்டிக் புதுப்பித்தல் & மூன்றாம் அலை"], p: ["Gifts enter historic churches; John Wimber teaches that every believer can pray for the sick (\"everyone gets to play\").", "வரங்கள் வரலாற்றுச் சபைகளுக்குள் நுழைகின்றன; ஒவ்வொரு விசுவாசியும் நோயாளிகளுக்காக ஜெபிக்கலாம் என்று ஜான் விம்பர் போதிக்கிறார்."] },
          { y: "Today", h: ["The Global South", "உலகின் தென்பகுதி"], p: ["Pentecostal and charismatic Christians number in the hundreds of millions; healing is one of the most common reasons people in Africa and Asia give for coming to faith.", "பெந்தெகொஸ்தே, கரிஸ்மாட்டிக் கிறிஸ்தவர்கள் கோடிக்கணக்கானோர்; ஆப்பிரிக்கா, ஆசியாவில் மக்கள் விசுவாசத்துக்கு வருவதற்குச் சொல்லும் பொதுவான காரணங்களில் சுகமும் ஒன்று."] }
        ] }
      ] },

    { id: "views", type: "spectrum", title: ["Where Christians stand on the gifts today", "இன்று வரங்கள் பற்றி கிறிஸ்தவர்கள் எங்கே நிற்கிறார்கள்"], short: ["Views", "கருத்துகள்"],
      left: ["Gifts ceased", "வரங்கள் நின்றுவிட்டன"], right: ["Gifts expected constantly", "வரங்கள் எப்போதும் எதிர்பார்க்கப்படுகின்றன"], start: 3,
      stops: [
        { name: ["Cessationist", "நிறுத்தக் கோட்பாட்டாளர்"], p: ["Sign gifts authenticated the apostles and Scripture and ceased with them. God still heals in answer to prayer, but no one has a \"gift of healing\" today.", "அடையாள வரங்கள் அப்போஸ்தலரையும் வேதத்தையும் உறுதிப்படுத்தின, அவர்களோடு நின்றன. தேவன் ஜெபத்துக்குப் பதிலாக இன்னும் சுகமாக்குகிறார், ஆனால் இன்று யாருக்கும் \"சுகமாக்கும் வரம்\" இல்லை."], who: ["B.B. Warfield, John MacArthur, many Reformed churches", "பி.பி. வார்ஃபீல்ட், ஜான் மெக்கார்தர், பல சீர்திருத்தச் சபைகள்"], r: "1 Cor 13:8–10; Heb 2:3–4" },
        { name: ["Open but cautious", "திறந்த ஆனால் எச்சரிக்கையான"], p: ["No biblical reason to say the gifts stopped, but wary of excess. Welcomes healing prayer quietly; tests everything.", "வரங்கள் நின்றுவிட்டன என்று சொல்ல வேத ஆதாரம் இல்லை; ஆனால் மிகைப்படுத்தலில் எச்சரிக்கை. சுகத்துக்கான ஜெபத்தை அமைதியாக வரவேற்கிறது; எல்லாவற்றையும் சோதிக்கிறது."], who: ["Many evangelicals; Anglican and Catholic healing ministries", "பல சுவிசேஷகர்கள்; ஆங்கிலிகன், கத்தோலிக்க சுகமளிக்கும் ஊழியங்கள்"], r: "1 Thess 5:19–21" },
        { name: ["Pentecostal", "பெந்தெகொஸ்தே"], p: ["Baptism in the Spirit is a distinct experience, often with tongues; healing is in the atonement; all nine gifts are for today.", "ஆவியின் ஞானஸ்நானம் தனித்த அனுபவம், அடிக்கடி பாஷைகளோடு; சுகம் பாவநிவாரணத்தில் உள்ளது; ஒன்பது வரங்களும் இன்றைக்கானவை."], who: ["Assemblies of God, Church of God, India Pentecostal Church, The Pentecostal Mission (Chennai)", "அசெம்பிளீஸ் ஆஃப் காட், சர்ச் ஆஃப் காட், இந்தியா பெந்தெகொஸ்தே சபை, தி பெந்தெகொஸ்தே மிஷன் (சென்னை)"], r: "Acts 2:4; Isa 53:5" },
        { name: ["Charismatic / Third Wave", "கரிஸ்மாட்டிக் / மூன்றாம் அலை"], p: ["Gifts for every believer in every church tradition; stresses intimacy, hearing God, and equipping the saints to pray for the sick in daily life.", "எல்லாச் சபைப் பாரம்பரியத்திலும் ஒவ்வொரு விசுவாசிக்கும் வரங்கள்; நெருக்கம், தேவனைக் கேட்டல், அன்றாட வாழ்வில் நோயாளிகளுக்காக ஜெபிக்கப் பரிசுத்தவான்களைத் தகுதிப்படுத்துதலை வலியுறுத்துகிறது."], who: ["John Wimber, Vineyard, many independent churches", "ஜான் விம்பர், வைன்யார்ட், பல சுயாதீனச் சபைகள்"], r: "Eph 4:11–12" },
        { name: ["Word of Faith", "விசுவாச வார்த்தை இயக்கம்"], p: ["Healing is already purchased; believers receive it by faith and confession, resisting symptoms. Strong on authority and expectation; criticised when lack of healing is blamed on weak faith.", "சுகம் ஏற்கனவே கிரயத்துக்கு வாங்கப்பட்டது; விசுவாசிகள் விசுவாசத்தாலும் அறிக்கையாலும் அதைப் பெறுகிறார்கள், அறிகுறிகளை எதிர்க்கிறார்கள். அதிகாரத்திலும் எதிர்பார்ப்பிலும் வலிமையானது; சுகமாகாததை விசுவாசக் குறைவின் மேல் சுமத்தும்போது விமர்சிக்கப்படுகிறது."], who: ["Kenneth Hagin, Kenneth Copeland, many prosperity-leaning ministries", "கென்னத் ஹேகின், கென்னத் கோப்லாண்ட், பல செழிப்புப் போதனை ஊழியங்கள்"], r: "Mark 11:23–24; 1 Pet 2:24" }
      ] },

    { id: "why-not", type: "lens", title: ["Why isn't everyone healed?", "ஏன் எல்லாரும் சுகமடைவதில்லை?"], short: ["Why not healed?", "ஏன் சுகமில்லை?"],
      q: ["Paul left Trophimus sick at Miletus (2 Tim 4:20). Timothy had frequent illness (1 Tim 5:23). Epaphroditus nearly died (Phil 2:27). How do traditions answer?", "பவுல் துரோப்பீமுவை மிலேத்துவிலே வியாதியாய் விட்டுவந்தார் (2 தீமோத்தேயு 4:20). தீமோத்தேயு அடிக்கடி நோயுற்றார் (1 தீமோத்தேயு 5:23). எப்பாப்பிரோதீத்து மரணத்துக்குச் சமீபமாயிருந்தார் (பிலிப்பியர் 2:27). பாரம்பரியங்கள் எப்படிப் பதில் சொல்கின்றன?"],
      views: [
        { name: ["Word of Faith", "விசுவாச வார்த்தை"], p: ["God's will is always to heal (Matt 8:16–17). When healing doesn't manifest, look at faith, confession, doubt, or unforgiveness (Mark 11:23–25). Keep standing on the Word.", "சுகமாக்குவதே எப்போதும் தேவ சித்தம் (மத்தேயு 8:16–17). சுகம் வெளிப்படாதபோது விசுவாசம், அறிக்கை, சந்தேகம், மன்னியாமையைப் பாருங்கள் (மாற்கு 11:23–25). வார்த்தையின்மேல் தொடர்ந்து நில்லுங்கள்."], c: ["It rightly refuses passivity, but it can load guilt on the suffering. Jesus never blamed a sick person for lacking faith; He rebuked His disciples instead (Matt 17:16–20).", "செயலற்ற நிலையைச் சரியாக மறுக்கிறது; ஆனால் வேதனைப்படுபவர்மேல் குற்ற உணர்வைச் சுமத்தலாம். விசுவாசமில்லை என்று இயேசு ஒருபோதும் ஒரு நோயாளியைக் குற்றஞ்சாட்டவில்லை; பதிலாகச் சீஷர்களைக் கடிந்துகொண்டார் (மத்தேயு 17:16–20)."] },
        { name: ["Grace", "கிருபை"], p: ["Healing is part of the finished work and received as a gift by resting in Christ's righteousness, not by trying harder. Look away from your performance and toward His love; healing flows from right believing about God.", "சுகம் முடிக்கப்பட்ட கிரியையின் பகுதி; அதிகமாக முயல்வதால் அல்ல, கிறிஸ்துவின் நீதியில் இளைப்பாறுவதால் ஈவாகப் பெறப்படுகிறது. உங்கள் செயல்திறனை விட்டு அவர் அன்பைப் பாருங்கள்; தேவனைப் பற்றிய சரியான விசுவாசத்திலிருந்து சுகம் பாய்கிறது."], c: ["It removes pressure and guilt beautifully, yet can still struggle to explain delay without implying the person hasn't \"rested\" enough.", "அழுத்தத்தையும் குற்ற உணர்வையும் அழகாக நீக்குகிறது; ஆனாலும் போதுமான \"இளைப்பாறுதல்\" இல்லை என்று மறைமுகமாகச் சொல்லாமல் தாமதத்தை விளக்குவது கடினம்."] },
        { name: ["Relational gospel", "உறவுமுறை சுவிசேஷம்"], p: ["Jesus shows us the Father: He healed all who came to Him, so we pray boldly. We also live between the \"already\" and the \"not yet\" of the Kingdom (George Ladd). Death and sickness are enemies being defeated (1 Cor 15:26), not tools God uses to teach. When healing doesn't come, we don't blame the sick or God; we stay in love, keep praying, grieve honestly, and trust a Father who is good.", "இயேசு பிதாவைக் காட்டுகிறார்: தம்மிடம் வந்த அனைவரையும் சுகமாக்கினார், அதனால் தைரியமாக ஜெபிக்கிறோம். ராஜ்யத்தின் \"ஏற்கனவே\" மற்றும் \"இன்னும் இல்லை\" இடையே வாழ்கிறோம் (ஜார்ஜ் லாட்). மரணமும் நோயும் தோற்கடிக்கப்படும் சத்துருக்கள் (1 கொரிந்தியர் 15:26), தேவன் கற்பிக்கப் பயன்படுத்தும் கருவிகள் அல்ல. சுகம் வராதபோது நோயாளியையோ தேவனையோ குற்றஞ்சாட்டாமல், அன்பில் நிலைத்து, ஜெபித்துக்கொண்டே, நேர்மையாகத் துக்கித்து, நல்ல பிதாவை நம்புகிறோம்."], c: ["It holds mystery without becoming passive, but asks for patience with unanswered questions.", "செயலற்றதாகாமல் மர்மத்தைத் தாங்குகிறது; ஆனால் பதிலில்லாத கேள்விகளோடு பொறுமையைக் கேட்கிறது."] },
        { name: ["Classic evangelical", "பாரம்பரிய சுவிசேஷகர்"], p: ["God is sovereign and may heal or may give grace to endure (2 Cor 12:9). Suffering can refine character (Rom 5:3–5). Pray \"Your will be done.\"", "தேவன் இறையாண்மையுள்ளவர்; சுகமாக்கலாம், அல்லது சகிக்கக் கிருபை கொடுக்கலாம் (2 கொரிந்தியர் 12:9). பாடுகள் குணத்தைச் சுத்திகரிக்கலாம் (ரோமர் 5:3–5). \"உம் சித்தம் ஆகக்கடவது\" என்று ஜெபியுங்கள்."], c: ["It comforts sufferers, but can slide into low expectation, praying \"if it be Your will\" where Jesus never hesitated.", "வேதனைப்படுபவர்களுக்கு ஆறுதல் தருகிறது; ஆனால் இயேசு தயங்காத இடத்தில் \"உமக்குச் சித்தமானால்\" என்று குறைந்த எதிர்பார்ப்புக்குச் சரியலாம்."] }
      ] },

    { id: "model", type: "steps", title: ["A simple healing prayer model", "எளிய சுகமளிக்கும் ஜெப முறை"], short: ["Prayer model", "ஜெப முறை"],
      lead: ["Adapted from John Wimber's five-step model, widely used in churches. It is a guide for love in action, not a ritual.", "சபைகளில் பரவலாகப் பயன்படும் ஜான் விம்பரின் ஐந்து படி முறையிலிருந்து தழுவியது. இது செயலில் அன்புக்கான வழிகாட்டி, சடங்கு அல்ல."],
      items: [
        { h: ["Interview: listen first", "நேர்காணல்: முதலில் கேளுங்கள்"], p: ["Ask: \"What would you like Jesus to do for you?\" (Mark 10:51). Ask how long, what the doctor says, and what was happening when it started. Treat the person as a person, not a project.", "கேளுங்கள்: \"நான் உனக்கு என்ன செய்யவேண்டும் என்றிருக்கிறாய்?\" (மாற்கு 10:51). எவ்வளவு காலம், மருத்துவர் என்ன சொல்கிறார், தொடங்கியபோது என்ன நடந்தது என்று கேளுங்கள். அவரை ஒரு திட்டமாக அல்ல, மனிதராக நடத்துங்கள்."], r: "Mark 10:51" },
        { h: ["Diagnose: ask the Father", "கண்டறிதல்: பிதாவிடம் கேளுங்கள்"], p: ["Quietly ask: is this simply physical? Is there a wound, unforgiveness, or something spiritual? Listen for a word of knowledge, but don't force one.", "அமைதியாகக் கேளுங்கள்: இது வெறும் உடல் சார்ந்ததா? காயம், மன்னியாமை, அல்லது ஆவிக்குரிய ஏதாவது இருக்கிறதா? அறிவின் வசனத்துக்குச் செவிகொடுங்கள், ஆனால் கட்டாயப்படுத்தாதீர்கள்."] },
        { h: ["Choose how to pray", "எப்படி ஜெபிப்பது என்று தேர்ந்தெடுங்கள்"], p: ["Petition (\"Father, heal\"), command (\"Pain, leave in Jesus' name\"), blessing, or leading them to forgive or renounce something first.", "விண்ணப்பம் (\"பிதாவே, சுகமாக்கும்\"), கட்டளை (\"வலியே, இயேசுவின் நாமத்தில் போ\"), ஆசீர்வாதம், அல்லது முதலில் ஏதாவதை மன்னிக்க அல்லது மறுதலிக்க வழிநடத்துதல்."], prayer: ["\"In the name of Jesus, I speak to this back: be healed. Pain, go. Father, thank You for Your love for (name).\"", "\"இயேசுவின் நாமத்தில் இந்த முதுகுக்குச் சொல்கிறேன்: சுகமாகு. வலியே, போ. பிதாவே, (பெயர்) மேல் உமக்குள்ள அன்புக்காக நன்றி.\""] },
        { h: ["Pray with eyes open", "கண்களைத் திறந்து ஜெபியுங்கள்"], p: ["Keep it short and kind. Ask permission before touching; a hand on the shoulder is enough. Ask, \"What's happening?\" and pray again if there is progress (Jesus prayed twice for one blind man, Mark 8:22–25).", "சுருக்கமாகவும் கனிவாகவும் இருங்கள். தொடுவதற்கு முன் அனுமதி கேளுங்கள்; தோளில் கை போதும். \"என்ன நடக்கிறது?\" என்று கேட்டு, முன்னேற்றம் இருந்தால் மீண்டும் ஜெபியுங்கள் (ஒரு குருடனுக்காக இயேசு இருமுறை ஜெபித்தார், மாற்கு 8:22–25)."], r: "Mark 8:22–25" },
        { h: ["After-care", "பின்கவனிப்பு"], p: ["Encourage them to see their doctor before changing any medication. Bless them whatever happened. Point them to Jesus and a loving community, not to you.", "எந்த மருந்தையும் மாற்றும் முன் மருத்துவரைப் பார்க்க ஊக்குவியுங்கள். என்ன நடந்தாலும் அவர்களை ஆசீர்வதியுங்கள். உங்களை அல்ல, இயேசுவையும் அன்பான சமூகத்தையும் சுட்டுங்கள்."] }
      ] },

    { id: "cautions", type: "vs", title: ["Healthy power ministry vs. unhealthy", "ஆரோக்கியமான வல்லமை ஊழியம் vs ஆரோக்கியமற்றது"], short: ["Healthy vs unhealthy", "ஆரோக்கியம்"],
      left: { h: ["Warning signs", "எச்சரிக்கை அடையாளங்கள்"], items: [
        ["Money linked to miracles: \"sow a seed for your healing\" (compare Acts 8:20).", "அற்புதங்களோடு இணைக்கப்பட்ட பணம்: \"உன் சுகத்துக்காக விதை விதை\" (அப்போஸ்தலர் 8:20-ஐ ஒப்பிடுங்கள்)."],
        ["Telling people to stop medicine to \"prove faith\".", "\"விசுவாசத்தை நிரூபிக்க\" மருந்தை நிறுத்தச் சொல்லுதல்."],
        ["Blaming the sick when nothing happens.", "ஒன்றும் நடக்காதபோது நோயாளியைக் குற்றஞ்சாட்டுதல்."],
        ["Celebrity minister at the centre; no accountability.", "மையத்தில் பிரபல ஊழியர்; பொறுப்புக்கூறல் இல்லை."],
        ["Exaggerated or unverified testimonies.", "மிகைப்படுத்தப்பட்ட அல்லது சரிபார்க்கப்படாத சாட்சிகள்."],
        ["Pushing, shouting at or shaming people on stage.", "மேடையில் மக்களைத் தள்ளுதல், கத்துதல், அவமானப்படுத்துதல்."]
      ] },
      right: { h: ["Marks of Jesus-shaped ministry", "இயேசுவின் வடிவிலான ஊழியத்தின் அடையாளங்கள்"], items: [
        ["Freely given, freely received (Matt 10:8).", "இலவசமாய்ப் பெற்றது, இலவசமாய்க் கொடுக்கப்படுகிறது (மத்தேயு 10:8)."],
        ["Prayer and medicine together; healings verified gently.", "ஜெபமும் மருத்துவமும் இணைந்து; சுகங்கள் மென்மையாகச் சரிபார்க்கப்படுகின்றன."],
        ["The sick are honoured whether healed or not.", "சுகமானாலும் இல்லாவிட்டாலும் நோயாளிகள் மதிக்கப்படுகிறார்கள்."],
        ["Every believer equipped; leaders accountable to elders.", "ஒவ்வொரு விசுவாசியும் தகுதிப்படுத்தப்படுகிறார்; தலைவர்கள் மூப்பர்களுக்குப் பொறுப்பானவர்கள்."],
        ["Testimonies told humbly and accurately.", "சாட்சிகள் தாழ்மையாகவும் துல்லியமாகவும் சொல்லப்படுகின்றன."],
        ["Compassion, consent and dignity in every touch.", "ஒவ்வொரு தொடுதலிலும் மனதுருக்கம், சம்மதம், மானம்."]
      ] } },

    { id: "quiz", type: "quiz", title: ["Check your understanding", "உங்கள் புரிதலைச் சோதியுங்கள்"], short: ["Quiz", "வினாடி வினா"],
      items: [
        { q: ["Which word means \"authority\", the right to act?", "\"அதிகாரம்\", செயல்படும் உரிமை என்று பொருள்படும் சொல் எது?"], o: ["Dunamis", "Exousia", "Charisma"], a: 1, w: ["*Exousia* is delegated authority; *dunamis* is power; *charisma* is a grace-gift.", "*எக்ஸூசியா* ஒப்படைக்கப்பட்ட அதிகாரம்; *டுனாமிஸ்* வல்லமை; *கரிஸ்மா* கிருபை வரம்."] },
        { q: ["According to Acts 10:38, how did Jesus heal?", "அப்போஸ்தலர் 10:38-ன்படி இயேசு எப்படிச் சுகமாக்கினார்?"], o: [["Only by His divine nature, so we cannot follow Him", "தமது தெய்வீகத் தன்மையால் மட்டும், ஆகவே நாம் பின்பற்ற முடியாது"], ["Anointed with the Holy Spirit and power, with God with Him", "பரிசுத்த ஆவியாலும் வல்லமையாலும் அபிஷேகம் பெற்று, தேவன் அவரோடிருந்ததால்"], ["By secret techniques", "இரகசிய நுட்பங்களால்"]], a: 1, w: ["Jesus ministered as a Spirit-anointed man in union with the Father, which is why His ministry is a pattern for His followers.", "இயேசு பிதாவோடு ஐக்கியத்தில் ஆவியால் அபிஷேகம் பெற்ற மனிதராக ஊழியம் செய்தார்; அதனால்தான் அவர் ஊழியம் சீஷர்களுக்கு மாதிரி."] },
        { q: ["Which early writer recorded about 70 healings in Hippo within two years?", "ஹிப்போவில் இரண்டு ஆண்டுகளில் ஏறக்குறைய 70 சுகங்களைப் பதிவு செய்த ஆதி எழுத்தாளர் யார்?"], o: ["Augustine", "Calvin", "Warfield"], a: 0, w: ["Augustine, *City of God* 22.8, after earlier doubting that such miracles continued.", "அகஸ்டின், *தேவனுடைய நகரம்* 22.8; முன்பு அத்தகைய அற்புதங்கள் தொடர்கின்றனவா என்று சந்தேகித்த பிறகு."] },
        { q: ["What did Paul advise Timothy for his stomach?", "தீமோத்தேயுவின் வயிற்றுக்குப் பவுல் என்ன ஆலோசனை சொன்னார்?"], o: [["Rebuke the spirit of infirmity", "பலவீனத்தின் ஆவியைக் கடிந்துகொள்"], ["Use a little wine", "கொஞ்சம் திராட்சரசம் சாப்பிடு"], ["Confess more positively", "இன்னும் நேர்மறையாக அறிக்கையிடு"]], a: 1, w: ["1 Tim 5:23. Faith and practical, medical means work together in Scripture.", "1 தீமோத்தேயு 5:23. வேதத்தில் விசுவாசமும் நடைமுறை, மருத்துவ வழிகளும் இணைந்து செயல்படுகின்றன."] }
      ] }
  ]
});

PP.studies.push({
  id: "prophetic", n: 2, accent: "sky",
  title: ["The Prophetic, Declarations & the Authority of Sons", "தீர்க்கதரிசனம், அறிக்கைகள் & புத்திரரின் அதிகாரம்"],
  short: ["Prophetic & Sonship", "தீர்க்கதரிசனமும் புத்திரத்துவமும்"], tab: ["Prophetic", "தீர்க்கதரிசனம்"],
  tagline: ["Hearing the Father's heart, speaking it in love, and standing in the authority He gives His children.", "பிதாவின் இருதயத்தைக் கேட்டு, அன்பில் அதைப் பேசி, தம் பிள்ளைகளுக்கு அவர் தரும் அதிகாரத்தில் நிற்றல்."],
  verse: { t: ["The testimony of Jesus is the spirit of prophecy.", "இயேசுவைப்பற்றின சாட்சி தீர்க்கதரிசனத்தின் ஆவியாயிருக்கிறது."], r: "Rev 19:10" },
  sections: [
    { id: "words", type: "cards", title: ["What is a prophet? The biblical words", "தீர்க்கதரிசி என்றால் என்ன? வேதச் சொற்கள்"], short: ["Words", "சொற்கள்"],
      lead: ["Hebrew and Greek give us a rich picture. A prophet is first a friend who listens, then a messenger who speaks.", "எபிரெயமும் கிரேக்கமும் செழுமையான சித்திரம் தருகின்றன. தீர்க்கதரிசி முதலில் செவிகொடுக்கும் நண்பர், பிறகு பேசும் தூதர்."],
      items: [
        { tag: "נָבִיא nabi", h: ["Spokesperson", "பேச்சாளர்"], p: ["One who is called and speaks on another's behalf, as Aaron was Moses' \"prophet\" (Exod 7:1).", "அழைக்கப்பட்டு மற்றொருவர் சார்பாகப் பேசுபவர்; ஆரோன் மோசேயின் \"தீர்க்கதரிசியாக\" இருந்தது போல (யாத்திராகமம் 7:1)."], r: "Exod 7:1" },
        { tag: "רֹאֶה ro'eh", h: ["Seer", "ஞானதிருஷ்டிக்காரன்"], p: ["One who sees: Samuel was first called a seer (1 Sam 9:9). Revelation often comes as pictures and dreams.", "காண்பவர்: சாமுவேல் முதலில் ஞானதிருஷ்டிக்காரன் என்று அழைக்கப்பட்டார் (1 சாமுவேல் 9:9). வெளிப்பாடு பெரும்பாலும் படங்களாகவும் சொப்பனங்களாகவும் வருகிறது."], r: "1 Sam 9:9" },
        { tag: "חֹזֶה chozeh", h: ["Visionary", "தரிசனக்காரன்"], p: ["One who gazes into vision, like Gad, \"David's seer\" (2 Sam 24:11).", "தரிசனத்தை உற்றுநோக்குபவர், \"தாவீதின் ஞானதிருஷ்டிக்காரனாகிய\" காத் போல (2 சாமுவேல் 24:11)."], r: "2 Sam 24:11" },
        { tag: "προφήτης prophētēs", h: ["One who speaks forth", "முன்னுரைப்பவர்"], p: ["Greek *pro* + *phēmi*: to speak forth. Mostly forth-telling God's heart, sometimes fore-telling the future.", "கிரேக்க *ப்ரோ* + *ஃபேமி*: முன்வந்து பேசுதல். பெரும்பாலும் தேவனுடைய இருதயத்தை அறிவித்தல், சிலநேரம் எதிர்காலத்தை முன்னறிவித்தல்."], r: "1 Cor 14:3" },
        { tag: ["Friend", "நண்பர்"], h: ["Friend of God", "தேவனுடைய சிநேகிதன்"], p: ["God told Abraham His plans because he was His friend (Gen 18:17; 20:7). Jesus: \"I have called you friends, for all things I heard from My Father I have made known to you\" (John 15:15).", "ஆபிரகாம் தம் சிநேகிதனாக இருந்ததால் தேவன் தம் திட்டங்களை அவருக்குச் சொன்னார் (ஆதியாகமம் 18:17; 20:7). இயேசு: \"உங்களைச் சிநேகிதர் என்றேன்; என் பிதாவினிடத்தில் நான் கேள்விப்பட்ட யாவையும் உங்களுக்கு அறிவித்தேன்\" (யோவான் 15:15)."], r: "John 15:15" },
        { tag: ["Watchman", "காவற்காரன்"], h: ["Watchman", "காவற்காரன்"], p: ["Ezekiel was set as a watchman to warn (Ezek 3:17). Warning in Scripture is an act of love meant to save, not to frighten.", "எச்சரிக்க எசேக்கியேல் காவற்காரனாக நியமிக்கப்பட்டார் (எசேக்கியேல் 3:17). வேதத்தில் எச்சரிக்கை பயமுறுத்த அல்ல, காப்பாற்றும் அன்பின் செயல்."], r: "Ezek 3:17" }
      ] },

    { id: "ot-nt", type: "table", title: ["Old Covenant prophets vs. New Covenant prophecy", "பழைய உடன்படிக்கைத் தீர்க்கதரிசிகள் vs புதிய உடன்படிக்கைத் தீர்க்கதரிசனம்"], short: ["OT vs NT", "ப.ஏ. vs பு.ஏ."],
      lead: ["The Spirit was on a few; now the Spirit is poured on all flesh (Joel 2:28; Acts 2:17). That changes how prophecy works.", "ஆவியானவர் ஒரு சிலர்மேல் இருந்தார்; இப்போது மாம்சமான யாவர்மேலும் ஊற்றப்படுகிறார் (யோவேல் 2:28; அப்போஸ்தலர் 2:17). இது தீர்க்கதரிசனம் செயல்படும் முறையை மாற்றுகிறது."],
      cols: [["Aspect", "அம்சம்"], ["Old Covenant", "பழைய உடன்படிக்கை"], ["New Covenant", "புதிய உடன்படிக்கை"]], filter: true,
      rows: [
        [["Who", "யார்"], ["A few called individuals (Moses wished all could, Num 11:29)", "அழைக்கப்பட்ட சிலர் (எல்லாரும் தீர்க்கதரிசிகளானால் நலம் என்று மோசே விரும்பினார், எண்ணாகமம் 11:29)"], ["\"You can all prophesy one by one\" (1 Cor 14:31); the Spirit on sons and daughters", "\"நீங்கள் எல்லாரும் ஒவ்வொருவராகத் தீர்க்கதரிசனஞ் சொல்லலாம்\" (1 கொரிந்தியர் 14:31); குமாரர், குமாரத்திகள்மேல் ஆவி"]],
        [["Main purpose", "முக்கிய நோக்கம்"], ["Call Israel back to covenant; announce judgement and the coming Messiah", "இஸ்ரவேலை உடன்படிக்கைக்குத் திரும்ப அழைத்தல்; நியாயத்தீர்ப்பையும் வரவிருக்கும் மேசியாவையும் அறிவித்தல்"], ["Edification, exhortation, comfort (1 Cor 14:3); revealing Jesus (Rev 19:10)", "பக்திவிருத்தி, புத்தி, ஆறுதல் (1 கொரிந்தியர் 14:3); இயேசுவை வெளிப்படுத்துதல் (வெளிப்படுத்தின விசேஷம் 19:10)"]],
        [["Access to God", "தேவனை அணுகுதல்"], ["People went to the prophet to hear God", "தேவனைக் கேட்க மக்கள் தீர்க்கதரிசியிடம் போனார்கள்"], ["Every believer hears His voice (John 10:27); prophecy confirms more than directs", "ஒவ்வொரு விசுவாசியும் அவர் சத்தத்தைக் கேட்கிறார் (யோவான் 10:27); தீர்க்கதரிசனம் வழிநடத்துவதை விட உறுதிப்படுத்துகிறது"]],
        [["Authority of the word", "வார்த்தையின் அதிகாரம்"], ["\"Thus says the LORD\", became Scripture", "\"கர்த்தர் சொல்லுகிறார்\", வேதவாக்கியமானது"], ["Weighed and tested; we \"prophesy in part\" (1 Cor 13:9; 14:29)", "சீர்தூக்கிச் சோதிக்கப்படுகிறது; \"குறைவாய்த் தீர்க்கதரிசனஞ் சொல்லுகிறோம்\" (1 கொரிந்தியர் 13:9; 14:29)"]],
        [["When wrong", "தவறினால்"], ["Death penalty for false prophets (Deut 18:20–22)", "கள்ளத் தீர்க்கதரிசிகளுக்கு மரண தண்டனை (உபாகமம் 18:20–22)"], ["Correction, humility and accountability; false prophets known by fruit (Matt 7:15–20)", "திருத்தம், தாழ்மை, பொறுப்புக்கூறல்; கள்ளத் தீர்க்கதரிசிகள் கனியால் அறியப்படுவார்கள் (மத்தேயு 7:15–20)"]],
        [["Tone", "தொனி"], ["Often confrontational to a rebellious nation", "கலகமுள்ள தேசத்துக்கு அடிக்கடி எதிர்கொள்ளும் தொனி"], ["Grace-filled; the Father's heart revealed in Christ (Heb 1:1–2)", "கிருபை நிறைந்தது; கிறிஸ்துவில் வெளிப்பட்ட பிதாவின் இருதயம் (எபிரெயர் 1:1–2)"]]
      ] },

    { id: "levels", type: "pyramid", title: ["Three expressions of the prophetic", "தீர்க்கதரிசனத்தின் மூன்று வெளிப்பாடுகள்"], short: ["Three levels", "மூன்று நிலைகள்"],
      lead: ["A widely used teaching framework. Tap each level.", "பரவலாகப் பயன்படும் போதனைச் சட்டகம். ஒவ்வொரு நிலையையும் தொடுங்கள்."], start: 2,
      levels: [
        { h: ["Office of prophet", "தீர்க்கதரிசி ஊழியம்"], r: "Eph 4:11–12; Acts 11:27–28", p: [["A recognised equipping ministry given by Christ to the church, like Agabus or Judas and Silas (Acts 15:32). Its main job is to *equip the saints*, not to be the only voice.", "கிறிஸ்து சபைக்குக் கொடுத்த அங்கீகரிக்கப்பட்ட தகுதிப்படுத்தும் ஊழியம், அகபு அல்லது யூதா, சீலா போல (அப்போஸ்தலர் 15:32). அதன் முக்கியப் பணி *பரிசுத்தவான்களைத் தகுதிப்படுத்துதல்*, ஒரே குரலாக இருப்பது அல்ல."], ["Recognised by a track record, character and the local church, not by a self-given title.", "சொந்தமாகச் சூட்டிக்கொண்ட பட்டத்தால் அல்ல; நடத்தை வரலாறு, குணம், உள்ளூர் சபையால் அங்கீகரிக்கப்படுகிறது."]] },
        { h: ["Gift of prophecy", "தீர்க்கதரிசன வரம்"], r: "1 Cor 12:10; Rom 12:6", p: [["Some believers prophesy regularly and with growing accuracy \"in proportion to faith\" (Rom 12:6). Philip's four daughters prophesied (Acts 21:9).", "சில விசுவாசிகள் \"விசுவாச அளவின்படி\" ஒழுங்காகவும் வளரும் துல்லியத்தோடும் தீர்க்கதரிசனம் சொல்கிறார்கள் (ரோமர் 12:6). பிலிப்புவின் நான்கு குமாரத்திகள் தீர்க்கதரிசனம் சொன்னார்கள் (அப்போஸ்தலர் 21:9)."]] },
        { h: ["Spirit of prophecy: every believer", "தீர்க்கதரிசன ஆவி: ஒவ்வொரு விசுவாசியும்"], r: "Acts 2:17–18; 1 Cor 14:1, 31", p: [["Because the Spirit lives in every child of God, everyone can hear and share an encouraging word that points to Jesus. \"Pursue love, and desire spiritual gifts, but especially that you may prophesy\" (1 Cor 14:1).", "தேவனுடைய ஒவ்வொரு பிள்ளைக்குள்ளும் ஆவியானவர் வாசம்பண்ணுவதால், எல்லாரும் இயேசுவைச் சுட்டும் உற்சாகமான வார்த்தையைக் கேட்டுப் பகிரலாம். \"அன்பை நாடுங்கள்; ஞானவரங்களையும் விரும்புங்கள்; விசேஷமாகத் தீர்க்கதரிசன வரத்தை விரும்புங்கள்\" (1 கொரிந்தியர் 14:1)."]] }
      ] },

    { id: "test", type: "flow", title: ["How to test a prophetic word", "தீர்க்கதரிசன வார்த்தையை எப்படிச் சோதிப்பது"], short: ["Testing", "சோதித்தல்"],
      lead: ["\"Do not despise prophecies. Test all things; hold fast what is good\" (1 Thess 5:20–21). Work down the chart.", "\"தீர்க்கதரிசனங்களை அற்பமாய் எண்ணாதிருங்கள். எல்லாவற்றையும் சோதித்து நலமானதைப் பிடித்துக்கொள்ளுங்கள்\" (1 தெசலோனிக்கேயர் 5:20–21). வரைபடத்தில் கீழே செல்லுங்கள்."],
      steps: [
        { h: ["A word is given", "ஒரு வார்த்தை கொடுக்கப்படுகிறது"], p: ["Write it down. Note who gave it and in what setting.", "எழுதி வையுங்கள். யார் கொடுத்தார், எந்தச் சூழலில் என்று குறியுங்கள்."] },
        { kind: "q", h: ["Does it agree with Scripture?", "இது வேதவாக்கியத்தோடு ஒத்துப்போகிறதா?"], r: "Isa 8:20; Gal 1:8", side: { h: ["No → reject", "இல்லை → நிராகரியுங்கள்"], p: ["God never contradicts His written word.", "தேவன் தம் எழுதப்பட்ட வார்த்தைக்கு ஒருபோதும் முரண்படுவதில்லை."] } },
        { kind: "q", h: ["Does it exalt Jesus and His love?", "இது இயேசுவையும் அவர் அன்பையும் உயர்த்துகிறதா?"], r: "1 John 4:1–3; Rev 19:10", side: { h: ["Pushes fear, control or the speaker? → beware", "பயம், கட்டுப்பாடு அல்லது பேசுபவரை முன்னிறுத்துகிறதா? → எச்சரிக்கை"], p: ["Prophecy draws to Christ, not to a ministry.", "தீர்க்கதரிசனம் ஓர் ஊழியத்துக்கு அல்ல, கிறிஸ்துவுக்கு இழுக்கிறது."] } },
        { kind: "q", h: ["Does it build up, encourage, comfort?", "இது பக்திவிருத்தி, புத்தி, ஆறுதல் தருகிறதா?"], r: "1 Cor 14:3", side: { h: ["Condemnation? → not New Covenant tone", "ஆக்கினைத்தீர்ப்பா? → புதிய உடன்படிக்கைத் தொனி அல்ல"], p: ["Correction can come, but without condemnation (Rom 8:1).", "திருத்தம் வரலாம், ஆனால் ஆக்கினைத்தீர்ப்பு இல்லாமல் (ரோமர் 8:1)."] } },
        { kind: "q", h: ["Does the Spirit in you bear witness?", "உங்களுக்குள்ளிருக்கும் ஆவியானவர் சாட்சி கொடுக்கிறாரா?"], r: "1 John 2:27; Rom 8:16", side: { h: ["Unsure → put it on the shelf", "உறுதியில்லை → அலமாரியில் வையுங்கள்"], p: ["Neither obey nor reject; wait and pray.", "கீழ்ப்படியவோ நிராகரிக்கவோ வேண்டாம்; காத்திருந்து ஜெபியுங்கள்."] } },
        { kind: "q", h: ["Do mature leaders and community agree?", "முதிர்ந்த தலைவர்களும் சமூகமும் ஒப்புக்கொள்கிறார்களா?"], r: "1 Cor 14:29", p: ["\"Let two or three prophets speak, and let the others judge.\"", "\"தீர்க்கதரிசிகள் இரண்டுபேராவது மூன்றுபேராவது பேசலாம், மற்றவர்கள் நிதானிக்கக்கடவர்கள்.\""] },
        { kind: "q", h: ["What is the fruit of the speaker's life?", "பேசுபவரின் வாழ்க்கைக் கனி என்ன?"], r: "Matt 7:15–20" },
        { kind: "end", h: ["Receive, pray it through, act wisely", "ஏற்றுக்கொள்ளுங்கள், ஜெபியுங்கள், ஞானமாகச் செயல்படுங்கள்"], p: ["Don't make major decisions on a prophecy alone. Let it confirm what God is already saying.", "ஒரு தீர்க்கதரிசனத்தை மட்டும் வைத்து பெரிய முடிவுகள் எடுக்காதீர்கள். தேவன் ஏற்கனவே சொல்வதை அது உறுதிப்படுத்தட்டும்."], r: "1 Tim 1:18" }
      ] },

    { id: "history", type: "timeline", title: ["The prophetic in church history", "திருச்சபை வரலாற்றில் தீர்க்கதரிசனம்"], short: ["History", "வரலாறு"],
      eras: [
        { era: ["Early church", "ஆதித் திருச்சபை"], items: [
          { y: "c. 100", h: ["The Didache", "டிடாக்கே"], p: ["Welcomes travelling prophets but tests them: a prophet who asks for money or stays more than two days is false (ch. 11).", "பயணத் தீர்க்கதரிசிகளை வரவேற்கிறது, ஆனால் சோதிக்கிறது: பணம் கேட்கும் அல்லது இரண்டு நாளுக்கு மேல் தங்கும் தீர்க்கதரிசி கள்ளன் (அதி. 11)."] },
          { y: "c. 170", h: ["Montanism", "மொன்டானிசம்"], p: ["Ecstatic prophets claimed new revelation beyond the apostles. The church's reaction made it wary of prophecy for centuries.", "பரவசத் தீர்க்கதரிசிகள் அப்போஸ்தலரைத் தாண்டிய புதிய வெளிப்பாட்டைக் கோரினர். சபையின் எதிர்வினை நூற்றாண்டுகளுக்குத் தீர்க்கதரிசனத்தில் எச்சரிக்கையை உண்டாக்கியது."] }
        ] },
        { era: ["Medieval to modern", "இடைக்காலம் முதல் நவீனம் வரை"], items: [
          { y: "1100s–1300s", h: ["Mystic voices", "ஆன்மீக மறைஞானிகள்"], p: ["Hildegard of Bingen and Catherine of Siena speak visions and rebuke to popes and kings.", "பிங்கனின் ஹில்டகார்டும் சியெனாவின் கேத்தரினும் போப்புகளுக்கும் அரசர்களுக்கும் தரிசனங்களையும் கடிந்துகொள்ளுதலையும் பேசுகிறார்கள்."] },
          { y: "1600s–1700s", h: ["Covenanters & Quakers", "உடன்படிக்கையாளர்கள் & குவேக்கர்கள்"], p: ["Scottish preachers like Alexander Peden were known for predictive words; Quakers waited for the inner voice in silence.", "அலெக்சாண்டர் பீடன் போன்ற ஸ்காட்லாந்து பிரசங்கிகள் முன்னறிவிக்கும் வார்த்தைகளுக்குப் பெயர் பெற்றவர்கள்; குவேக்கர்கள் அமைதியில் உள் குரலுக்குக் காத்திருந்தனர்."] }
        ] },
        { era: ["20th–21st century", "20–21ஆம் நூற்றாண்டு"], items: [
          { y: "1948", h: ["Latter Rain", "பின்மாரி இயக்கம்"], p: ["Emphasis on restored apostles and prophets and laying on of hands to impart gifts; later criticised for elitism.", "மீட்டெடுக்கப்பட்ட அப்போஸ்தலர், தீர்க்கதரிசிகள், வரங்களைக் கொடுக்கக் கைவைத்தல் மீது வலியுறுத்தல்; பின்னர் உயர்குழு மனப்பான்மைக்காக விமர்சிக்கப்பட்டது."] },
          { y: "1980s–2000s", h: ["Prophetic movement", "தீர்க்கதரிசன இயக்கம்"], p: ["Training schools teach that all can learn to hear God; also the rise of the New Apostolic Reformation and debates about authority.", "எல்லாரும் தேவனைக் கேட்கக் கற்றுக்கொள்ளலாம் என்று பயிற்சிப் பள்ளிகள் போதிக்கின்றன; புதிய அப்போஸ்தலிக்கச் சீர்திருத்தமும் அதிகாரம் பற்றிய விவாதங்களும் எழுகின்றன."] },
          { y: "2021", h: ["Prophetic Standards statement", "தீர்க்கதரிசனத் தரநிலைகள் அறிக்கை"], p: ["After failed 2020 US election prophecies, Michael Brown, Joseph Mattera and about 85 leaders call for public apology for false words and clear accountability.", "2020 அமெரிக்கத் தேர்தல் தீர்க்கதரிசனங்கள் தோல்வியடைந்த பின், மைக்கேல் பிரவுன், ஜோசப் மட்டேரா மற்றும் சுமார் 85 தலைவர்கள் தவறான வார்த்தைகளுக்குப் பொது மன்னிப்பும் தெளிவான பொறுப்புக்கூறலும் கோருகிறார்கள்."] }
        ] }
      ] },

    { id: "sonship", type: "vs", title: ["Servant or son? The ground of all authority", "வேலைக்காரனா புத்திரனா? எல்லா அதிகாரத்தின் அடித்தளம்"], short: ["Sonship", "புத்திரத்துவம்"],
      lead: ["Declarations only make sense from identity. \"Because you are sons, God has sent forth the Spirit of His Son into your hearts, crying out, 'Abba, Father!'\" (Gal 4:6).", "அடையாளத்திலிருந்துதான் அறிக்கைகளுக்கு அர்த்தம். \"நீங்கள் புத்திரராயிருக்கிறபடியினால், அப்பா, பிதாவே! என்று கூப்பிடுகிற தம்முடைய குமாரனுடைய ஆவியைத் தேவன் உங்கள் இருதயங்களில் அனுப்பினார்\" (கலாத்தியர் 4:6)."],
      left: { h: ["Servant / orphan mindset", "வேலைக்காரன் / அனாதை மனநிலை"], items: [
        ["Prays to get God's attention.", "தேவனுடைய கவனத்தைப் பெற ஜெபிக்கிறது."],
        ["Shouts at the devil to feel strong.", "பலமாக உணரப் பிசாசைப் பார்த்துக் கத்துகிறது."],
        ["Authority depends on performance and fasting record.", "அதிகாரம் செயல்திறனையும் உபவாசப் பதிவையும் சார்ந்தது."],
        ["Declarations are formulas to make things happen.", "அறிக்கைகள் காரியங்களை நடக்க வைக்கும் சூத்திரங்கள்."],
        ["Fear of losing blessing or position (Luke 15:29).", "ஆசீர்வாதத்தையோ நிலையையோ இழக்கும் பயம் (லூக்கா 15:29)."]
      ] },
      right: { h: ["Son / daughter mindset", "மகன் / மகள் மனநிலை"], items: [
        ["Prays from the Father's lap: \"Abba\" (Rom 8:15).", "பிதாவின் மடியிலிருந்து ஜெபிக்கிறது: \"அப்பா\" (ரோமர் 8:15)."],
        ["Speaks calmly from Christ's finished victory (Col 2:15).", "கிறிஸ்துவின் முடிக்கப்பட்ட வெற்றியிலிருந்து அமைதியாகப் பேசுகிறது (கொலோசெயர் 2:15)."],
        ["Authority is inheritance: \"heirs of God, joint heirs with Christ\" (Rom 8:17).", "அதிகாரம் சுதந்தரம்: \"தேவனுடைய சுதந்தரர், கிறிஸ்துவுக்கு உடன் சுதந்தரர்\" (ரோமர் 8:17)."],
        ["Declarations echo what the Father has already said.", "அறிக்கைகள் பிதா ஏற்கனவே சொன்னதை எதிரொலிக்கின்றன."],
        ["\"Son, you are always with me, and all that I have is yours\" (Luke 15:31).", "\"மகனே, நீ எப்பொழுதும் என்னுடனேகூட இருக்கிறாய், எனக்குள்ளதெல்லாம் உன்னுடையதாயிருக்கிறது\" (லூக்கா 15:31)."]
      ] },
      foot: ["Creation itself waits \"for the revealing of the sons of God\" (Rom 8:19). Sonship in Paul includes daughters (2 Cor 6:18); it is a legal and relational status of heirs, not a gender.", "சிருஷ்டியே \"தேவனுடைய புத்திரரின் வெளிப்படுதலுக்குக்\" காத்திருக்கிறது (ரோமர் 8:19). பவுலின் புத்திரத்துவம் குமாரத்திகளையும் உள்ளடக்குகிறது (2 கொரிந்தியர் 6:18); இது சுதந்தரரின் சட்டப்பூர்வ, உறவுமுறை நிலை, பாலினம் அல்ல."] },

    { id: "declare-bible", type: "map", title: ["Biblical evidence for declarations", "அறிக்கைகளுக்கான வேத ஆதாரம்"], short: ["Declarations: evidence", "அறிக்கை: ஆதாரம்"],
      center: ["Words with authority", "அதிகாரமுள்ள வார்த்தைகள்"],
      hint: ["Each branch is a strand of Scripture people use to support speaking God's word with authority. Read the notes for context too.", "ஒவ்வொரு கிளையும் அதிகாரத்தோடு தேவ வார்த்தையைப் பேசுவதை ஆதரிக்க மக்கள் பயன்படுத்தும் வேதப் பகுதி. சூழலுக்காகக் குறிப்புகளையும் வாசியுங்கள்."],
      nodes: [
        { h: ["God creates by speaking", "தேவன் பேசிச் சிருஷ்டிக்கிறார்"], r: "Gen 1:3; Heb 11:3; Rom 4:17", p: ["God \"calls those things which do not exist as though they did.\" We bear His image, so our words carry weight too, but we are not God: we echo His word rather than create by our own.", "தேவன் \"இல்லாதவைகளை இருக்கிறவைகளைப்போல அழைக்கிறார்.\" நாம் அவர் சாயலைத் தாங்குகிறோம், எனவே நம் வார்த்தைகளுக்கும் எடை உண்டு; ஆனால் நாம் தேவன் அல்ல: நம் சொந்தத்தால் சிருஷ்டிப்பதில்லை, அவர் வார்த்தையை எதிரொலிக்கிறோம்."] },
        { h: ["Life and death in the tongue", "நாவில் ஜீவனும் மரணமும்"], r: "Prov 18:21; Jas 3:2–10", p: ["Words shape lives, relationships and atmospheres. This applies to blessing and cursing others, and to how we speak over ourselves.", "வார்த்தைகள் வாழ்க்கைகளையும் உறவுகளையும் சூழல்களையும் வடிவமைக்கின்றன. மற்றவர்களை ஆசீர்வதிப்பதற்கும் சபிப்பதற்கும், நம்மைப் பற்றி நாம் பேசுவதற்கும் இது பொருந்தும்."] },
        { h: ["Speak to the mountain", "மலையைப் பார்த்துப் பேசு"], r: "Mark 11:22–24", p: ["Jesus: \"Have faith in God... whoever says to this mountain\". The faith is *in God*, not in words. Jesus Himself spoke to fevers, winds and fig trees.", "இயேசு: \"தேவனிடத்தில் விசுவாசமுள்ளவர்களாயிருங்கள்... எவனாவது இந்த மலையைப் பார்த்து\". விசுவாசம் *தேவனிடத்தில்*, வார்த்தைகளில் அல்ல. இயேசுவே காய்ச்சல், காற்று, அத்திமரத்தோடு பேசினார்."] },
        { h: ["Binding and loosing", "கட்டுதலும் கட்டவிழ்த்தலும்"], r: "Matt 16:19; 18:18", p: ["In rabbinic usage \"bind\" and \"loose\" meant forbid and permit, decisions with heaven's backing. Deliverance ministry also applies it to binding the strong man (Matt 12:29).", "ரபீகளின் பயன்பாட்டில் \"கட்டுதல்\", \"கட்டவிழ்த்தல்\" என்பது தடுத்தல், அனுமதித்தல், பரலோக ஆதரவுள்ள தீர்மானங்கள். விடுதலை ஊழியம் இதைப் பலவானைக் கட்டுவதற்கும் பயன்படுத்துகிறது (மத்தேயு 12:29)."] },
        { h: ["\"Decree a thing\"", "\"ஒரு காரியத்தை நிர்ணயம் செய்\""], r: "Job 22:28", p: ["Popular, but notice the speaker is Eliphaz, whose theology God later rebuked (Job 42:7). Use it carefully; the principle stands more firmly on other texts.", "பிரபலமானது, ஆனால் பேசுபவர் எலிப்பாஸ் என்பதைக் கவனியுங்கள்; அவர் இறையியலைத் தேவன் பின்னர் கடிந்துகொண்டார் (யோபு 42:7). கவனமாகப் பயன்படுத்துங்கள்; இந்தக் கொள்கை மற்ற வசனங்களில் உறுதியாக நிற்கிறது."] },
        { h: ["I believed, therefore I spoke", "விசுவாசித்தேன், ஆகையால் பேசினேன்"], r: "2 Cor 4:13; Rom 10:9–10", p: ["Confession (*homologia*, \"saying the same thing\") means agreeing aloud with what God says. Salvation itself is believed in the heart and confessed with the mouth.", "அறிக்கை (*ஹோமொலொஜியா*, \"அதையே சொல்லுதல்\") தேவன் சொல்வதை உரக்க ஒப்புக்கொள்ளுதல். இரட்சிப்பே இருதயத்தில் விசுவாசிக்கப்பட்டு வாயால் அறிக்கையிடப்படுகிறது."] },
        { h: ["Prophesy to dry bones", "உலர்ந்த எலும்புகளுக்குத் தீர்க்கதரிசனம் சொல்"], r: "Ezek 37:4–10", p: ["Ezekiel spoke what God told him to speak, over a hopeless situation, and life came. Prophetic declaration starts with listening.", "நம்பிக்கையற்ற சூழல்மேல், தேவன் சொல்லச் சொன்னதை எசேக்கியேல் பேசினார், ஜீவன் வந்தது. தீர்க்கதரிசன அறிக்கை கேட்பதிலிருந்து தொடங்குகிறது."] },
        { h: ["Blessing as authority", "அதிகாரமாக ஆசீர்வாதம்"], r: "Num 6:23–27; Luke 10:5–6", p: ["Priests put God's name on people by blessing. Jesus told disciples to speak peace over homes. Parents' blessing over children is a powerful, neglected practice.", "ஆசீர்வதிப்பதன் மூலம் ஆசாரியர்கள் மக்கள்மேல் தேவனுடைய நாமத்தை வைத்தார்கள். வீடுகள்மேல் சமாதானம் சொல்ல இயேசு சீஷரிடம் சொன்னார். பிள்ளைகள்மேல் பெற்றோரின் ஆசீர்வாதம் வல்லமையுள்ள, புறக்கணிக்கப்பட்ட பழக்கம்."] }
      ] },

    { id: "declare-lens", type: "lens", title: ["Declarations: how traditions see them", "அறிக்கைகள்: பாரம்பரியங்கள் எப்படிப் பார்க்கின்றன"], short: ["Declarations: views", "அறிக்கை: கருத்துகள்"],
      q: ["Do our words create reality, or agree with God's reality?", "நம் வார்த்தைகள் யதார்த்தத்தை உருவாக்குகின்றனவா, அல்லது தேவனுடைய யதார்த்தத்தோடு ஒத்துப்போகின்றனவா?"],
      views: [
        { name: ["Word of Faith", "விசுவாச வார்த்தை"], p: ["Faith-filled words release spiritual law; \"what you say is what you get.\" Believers should confess healing, provision and victory and refuse negative words.", "விசுவாசம் நிறைந்த வார்த்தைகள் ஆவிக்குரிய பிரமாணத்தை விடுவிக்கின்றன; \"நீ சொல்வதையே பெறுவாய்.\" விசுவாசிகள் சுகம், தேவைகள், வெற்றியை அறிக்கையிட்டு எதிர்மறை வார்த்தைகளை மறுக்க வேண்டும்."], c: ["Rightly takes words seriously, but can drift into treating faith as a force we control and God as bound to our formula.", "வார்த்தைகளைச் சரியாகத் தீவிரமாக எடுக்கிறது; ஆனால் விசுவாசத்தை நாம் கட்டுப்படுத்தும் சக்தியாகவும் தேவனை நம் சூத்திரத்துக்குக் கட்டுப்பட்டவராகவும் நடத்தும் நிலைக்குச் சரியலாம்."] },
        { name: ["Grace", "கிருபை"], p: ["Declarations are thanksgiving for what is already ours in Christ: \"I am the righteousness of God in Christ.\" Speak who you are, not to earn but to enjoy.", "அறிக்கைகள் கிறிஸ்துவில் ஏற்கனவே நம்முடையவைக்கான நன்றி: \"நான் கிறிஸ்துவில் தேவனுடைய நீதியாயிருக்கிறேன்.\" சம்பாதிக்க அல்ல, அனுபவிக்க, நீங்கள் யார் என்று பேசுங்கள்."], c: ["Keeps declarations Christ-centred; may underplay the active, confrontational speaking Jesus also modelled.", "அறிக்கைகளைக் கிறிஸ்து மையமாக வைக்கிறது; இயேசு மாதிரியாகக் காட்டிய செயலூக்கமான, எதிர்கொள்ளும் பேச்சைக் குறைத்து மதிப்பிடலாம்."] },
        { name: ["Relational gospel", "உறவுமுறை சுவிசேஷம்"], p: ["Like Jesus, we say what we hear the Father saying (John 12:49–50). Declarations are relational agreement: a son repeating his Father's promises with confidence, and a co-worker speaking into situations by the Spirit's leading. The power is in the Father's word and presence, not in the volume or repetition of ours.", "இயேசுவைப் போல, பிதா சொல்வதைக் கேட்டதையே சொல்கிறோம் (யோவான் 12:49–50). அறிக்கைகள் உறவுமுறை ஒப்புதல்: ஒரு மகன் தன் பிதாவின் வாக்குத்தத்தங்களை நம்பிக்கையோடு மீண்டும் சொல்லுதல், ஆவியானவரின் வழிநடத்துதலால் சூழல்களுக்குள் பேசும் உடன் ஊழியன். வல்லமை நம் வார்த்தையின் சத்தத்திலோ திரும்பத் திரும்பச் சொல்வதிலோ அல்ல, பிதாவின் வார்த்தையிலும் பிரசன்னத்திலும்."], c: ["Requires cultivating listening prayer, which is slower than a formula.", "கேட்கும் ஜெபத்தை வளர்க்க வேண்டும்; இது சூத்திரத்தை விட மெதுவானது."] },
        { name: ["Reformed / critics", "சீர்திருத்தம் / விமர்சகர்கள்"], p: ["Positive confession can resemble New Thought metaphysics. God's sovereign will, not our speech, determines outcomes; pray \"Your will be done\".", "நேர்மறை அறிக்கை 'நியூ தாட்' தத்துவத்தை ஒத்திருக்கலாம். நம் பேச்சு அல்ல, தேவனுடைய இறையாண்மைச் சித்தமே விளைவுகளைத் தீர்மானிக்கிறது; \"உம் சித்தம் ஆகக்கடவது\" என்று ஜெபியுங்கள்."], c: ["A needed warning against magic, but can mute the many texts where God's people speak with delegated authority.", "மாயவித்தைக்கு எதிரான தேவையான எச்சரிக்கை; ஆனால் தேவ ஜனங்கள் ஒப்படைக்கப்பட்ட அதிகாரத்தோடு பேசும் பல வசனங்களை அமைதிப்படுத்தலாம்."] }
      ] },

    { id: "builder", type: "builder", title: ["Declaration builder", "அறிக்கை உருவாக்கி"], short: ["Builder", "உருவாக்கி"],
      ask: ["What do you need to stand on today?", "இன்று எதன்மேல் நிற்க வேண்டும்?"],
      note: ["Read the promise, then speak the declaration aloud, slowly, as a conversation with your Father, not a spell. Adjust the words to your situation.", "வாக்குத்தத்தத்தை வாசியுங்கள், பிறகு அறிக்கையை மந்திரமாக அல்ல, உங்கள் பிதாவோடு உரையாடலாக, மெதுவாக உரக்கச் சொல்லுங்கள். உங்கள் சூழலுக்கேற்ப வார்த்தைகளை மாற்றுங்கள்."],
      items: [
        { need: ["Identity", "அடையாளம்"], r: "1 John 3:1; Eph 1:4–6", promise: ["See what manner of love the Father has bestowed on us, that we should be called children of God.", "நாம் தேவனுடைய பிள்ளைகளென்றழைக்கப்படுவதினால் பிதாவானவர் நம்மேல் எவ்வளவு அன்பு பாராட்டியிருக்கிறார் என்று பாருங்கள்."], decl: ["Father, I am Your child, chosen and wanted. I am accepted in the Beloved. I don't work for Your love; I live from it.", "பிதாவே, நான் உம் பிள்ளை, தெரிந்துகொள்ளப்பட்டவன், விரும்பப்பட்டவன். பிரியமானவருக்குள் ஏற்றுக்கொள்ளப்பட்டிருக்கிறேன். உம் அன்புக்காக நான் உழைக்கவில்லை; அதிலிருந்து வாழ்கிறேன்."] },
        { need: ["Healing", "சுகம்"], r: "Isa 53:4–5; Ps 103:2–3", promise: ["Surely He has borne our griefs and carried our sorrows... by His stripes we are healed.", "மெய்யாகவே அவர் நம்முடைய பாடுகளை ஏற்றுக்கொண்டு, நம்முடைய துக்கங்களைச் சுமந்தார்... அவருடைய தழும்புகளால் குணமாகிறோம்."], decl: ["Jesus, You carried my sickness and my pain. Body, I speak peace and healing to you in Jesus' name. Father, thank You that You are my Healer, and thank You for every doctor and medicine You use.", "இயேசுவே, என் நோயையும் வேதனையையும் சுமந்தீர். சரீரமே, இயேசுவின் நாமத்தில் உனக்குச் சமாதானமும் சுகமும் சொல்கிறேன். பிதாவே, நீர் என் சுகமாக்குபவர் என்பதற்காகவும் நீர் பயன்படுத்தும் ஒவ்வொரு மருத்துவருக்காகவும் மருந்துக்காகவும் நன்றி."] },
        { need: ["Fear and anxiety", "பயமும் கவலையும்"], r: "2 Tim 1:7; 1 John 4:18", promise: ["God has not given us a spirit of fear, but of power and of love and of a sound mind.", "தேவன் நமக்குப் பயமுள்ள ஆவியைக் கொடாமல், பலமும் அன்பும் தெளிந்த புத்தியுமுள்ள ஆவியையே கொடுத்திருக்கிறார்."], decl: ["Perfect love casts out fear. Father, Your love surrounds me. I receive power, love and a sound mind. Fear, you have no place in me.", "பூரண அன்பு பயத்தைப் புறம்பே தள்ளும். பிதாவே, உம் அன்பு என்னைச் சூழ்ந்திருக்கிறது. பலம், அன்பு, தெளிந்த புத்தியைப் பெறுகிறேன். பயமே, எனக்குள் உனக்கு இடமில்லை."] },
        { need: ["Family", "குடும்பம்"], r: "Acts 16:31; Isa 54:13", promise: ["All your children shall be taught by the LORD, and great shall be the peace of your children.", "உன் பிள்ளைகளெல்லாரும் கர்த்தரால் போதிக்கப்பட்டிருப்பார்கள்; உன் பிள்ளைகளுடைய சமாதானம் பெரிதாயிருக்கும்."], decl: ["Over my household I speak the blessing of the Lord. My children will know Your love and Your voice. Every generational pattern of pain stops here and turns to blessing.", "என் வீட்டாரின் மேல் கர்த்தருடைய ஆசீர்வாதத்தைச் சொல்கிறேன். என் பிள்ளைகள் உம் அன்பையும் உம் சத்தத்தையும் அறிவார்கள். தலைமுறை வேதனையின் ஒவ்வொரு போக்கும் இங்கே நின்று ஆசீர்வாதமாக மாறுகிறது."] },
        { need: ["Provision", "தேவைகள்"], r: "Phil 4:19; Matt 6:31–33", promise: ["My God shall supply all your need according to His riches in glory by Christ Jesus.", "என் தேவன் தம்முடைய ஐசுவரியத்தின்படி உங்கள் குறைவையெல்லாம் கிறிஸ்து இயேசுவுக்குள் மகிமையிலே நிறைவாக்குவார்."], decl: ["My Father knows what I need. I seek His Kingdom first. I trust Him to supply, and I will work and give with an open hand.", "எனக்கு என்ன தேவை என்று என் பிதா அறிவார். முதலாவது அவர் ராஜ்யத்தைத் தேடுகிறேன். அவர் தருவார் என்று நம்புகிறேன்; திறந்த கையோடு உழைத்துக் கொடுப்பேன்."] },
        { need: ["Spiritual attack", "ஆவிக்குரிய தாக்குதல்"], r: "Col 2:15; Isa 54:17; Jas 4:7", promise: ["No weapon formed against you shall prosper, and every tongue which rises against you in judgement you shall condemn.", "உனக்கு விரோதமாய் உருவாக்கப்படும் எந்த ஆயுதமும் வாய்க்காதேபோம்; உனக்கு விரோதமாய் நியாயத்தில் எழும்பும் எந்த நாவையும் நீ குற்றப்படுத்துவாய்."], decl: ["I submit to God. In Jesus' name I resist every work of darkness against me and my family. Jesus disarmed every power at the cross. I am hidden with Christ in God.", "தேவனுக்குக் கீழ்ப்படிகிறேன். இயேசுவின் நாமத்தில் எனக்கும் என் குடும்பத்துக்கும் எதிரான இருளின் ஒவ்வொரு கிரியையையும் எதிர்க்கிறேன். சிலுவையில் இயேசு எல்லா அதிகாரங்களையும் உரிந்துகொண்டார். நான் கிறிஸ்துவோடு தேவனுக்குள் மறைந்திருக்கிறேன்."], why: ["See Study 4 for the full picture on spiritual attack.", "ஆவிக்குரிய தாக்குதல் பற்றிய முழுப் படத்துக்குப் படிப்பு 4-ஐப் பாருங்கள்."] }
      ] },

    { id: "objections", type: "flip", title: ["Objections and answers", "ஆட்சேபனைகளும் பதில்களும்"], short: ["Objections", "ஆட்சேபனைகள்"],
      items: [
        { q: ["\"The canon is closed, so prophecy has ceased.\"", "\"வேதாகமம் முழுமையானது, ஆகவே தீர்க்கதரிசனம் நின்றுவிட்டது.\""], a: ["NT prophecy never added to Scripture even in Paul's day; it was weighed under apostolic teaching. Many cessationists also read \"when the perfect comes\" (1 Cor 13:10) as Christ's return, when we see \"face to face\".", "பவுலின் காலத்திலும் புதிய ஏற்பாட்டுத் தீர்க்கதரிசனம் வேதத்தோடு சேர்க்கப்படவில்லை; அப்போஸ்தல போதனையின் கீழ் சீர்தூக்கப்பட்டது. \"நிறைவானது வரும்போது\" (1 கொரிந்தியர் 13:10) என்பது \"முகமுகமாய்\" காணும் கிறிஸ்துவின் வருகை என்று பலர் வாசிக்கிறார்கள்."], r: "1 Cor 13:9–12" },
        { q: ["\"So many prophecies fail.\"", "\"பல தீர்க்கதரிசனங்கள் தோல்வியடைகின்றன.\""], a: ["True, and it must be named. Scripture's answer is not to despise prophecy but to test it (1 Thess 5:20–21), require humility and correction, and, as the 2021 Prophetic Standards urged, publicly own mistakes.", "உண்மை, அதைப் பெயரிட்டுச் சொல்ல வேண்டும். வேதத்தின் பதில் தீர்க்கதரிசனத்தை அற்பமாக்குவது அல்ல, சோதிப்பது (1 தெசலோனிக்கேயர் 5:20–21), தாழ்மையையும் திருத்தத்தையும் கோருவது, 2021 தரநிலைகள் வலியுறுத்தியதுபோல் தவறுகளைப் பகிரங்கமாக ஒப்புக்கொள்வது."], r: "1 Thess 5:20–21" },
        { q: ["\"Declarations are just positive thinking.\"", "\"அறிக்கைகள் வெறும் நேர்மறைச் சிந்தனை.\""], a: ["Positive thinking trusts the mind; biblical declaration trusts God's word and character. The test: is the declaration rooted in a promise and spoken in relationship with Him?", "நேர்மறைச் சிந்தனை மனதை நம்புகிறது; வேத அறிக்கை தேவனுடைய வார்த்தையையும் குணத்தையும் நம்புகிறது. சோதனை: அறிக்கை வாக்குத்தத்தத்தில் வேரூன்றி, அவரோடுள்ள உறவில் பேசப்படுகிறதா?"], r: "Rom 4:17–21" },
        { q: ["\"Only special prophets hear God.\"", "\"சிறப்புத் தீர்க்கதரிசிகள் மட்டுமே தேவனைக் கேட்கிறார்கள்.\""], a: ["\"My sheep hear My voice\" (John 10:27). The New Covenant promise is that all will know Him, from the least to the greatest (Heb 8:11). Prophets equip; they don't replace your own walk with God.", "\"என் ஆடுகள் என் சத்தத்திற்குச் செவிகொடுக்கிறது\" (யோவான் 10:27). சிறியோர் முதல் பெரியோர் வரை எல்லாரும் அவரை அறிவார்கள் என்பதே புதிய உடன்படிக்கை வாக்குத்தத்தம் (எபிரெயர் 8:11). தீர்க்கதரிசிகள் தகுதிப்படுத்துகிறார்கள்; தேவனோடு உங்கள் சொந்த நடையை மாற்றீடு செய்வதில்லை."], r: "John 10:27" }
      ] },

    { id: "quiz", type: "quiz", title: ["Check your understanding", "உங்கள் புரிதலைச் சோதியுங்கள்"], short: ["Quiz", "வினாடி வினா"],
      items: [
        { q: ["What are the three purposes of prophecy in 1 Cor 14:3?", "1 கொரிந்தியர் 14:3-ன்படி தீர்க்கதரிசனத்தின் மூன்று நோக்கங்கள் என்ன?"], o: [["Warning, judgement, exposure", "எச்சரிக்கை, நியாயத்தீர்ப்பு, அம்பலப்படுத்தல்"], ["Edification, exhortation, comfort", "பக்திவிருத்தி, புத்தி, ஆறுதல்"], ["Prediction, wealth, direction", "முன்னறிவிப்பு, செல்வம், வழிகாட்டுதல்"]], a: 1, w: ["Strengthening, encouraging and comforting people is the New Covenant core of prophecy.", "மக்களைப் பலப்படுத்துதல், உற்சாகப்படுத்துதல், ஆறுதல்படுத்துதல் புதிய உடன்படிக்கைத் தீர்க்கதரிசனத்தின் மையம்."] },

        { q: ["According to Gal 4:6, why does God send the Spirit into our hearts?", "கலாத்தியர் 4:6-ன்படி தேவன் ஏன் ஆவியை நம் இருதயங்களுக்குள் அனுப்புகிறார்?"], o: [["Because we earned it", "நாம் சம்பாதித்ததால்"], ["Because we are sons", "நாம் புத்திரராயிருப்பதால்"], ["Because we fasted", "நாம் உபவாசித்ததால்"]], a: 1, w: ["Sonship comes first; the Spirit crying \"Abba\" follows. Authority flows from identity.", "புத்திரத்துவம் முதலில்; \"அப்பா\" என்று கூப்பிடும் ஆவி பின்தொடர்கிறது. அதிகாரம் அடையாளத்திலிருந்து பாய்கிறது."] }

        { h: ["Hidden Western occult", "மறைந்த மேற்கத்திய மாந்திரீகம்"], p: ["New Age, tarot, horoscopes, addictions; same issues, different names", "நியூ ஏஜ், டாரட், ஜாதகங்கள், அடிமைத்தனங்கள்; அதே பிரச்சனைகள், வேறு பெயர்கள்"], v: [1, 1, 2] }
      ],
      note: ["Hiebert's \"flaw of the excluded middle\" explains much of this: Western missionaries taught about God (heaven) and science (earth) but had no theology for the middle realm of spirits, curses and healing. People in Africa and India never stopped asking those questions, so the church there answers them. Evil is not stronger in those regions; it is more openly named and more openly practised. The West faces the same powers under different labels.", "ஹீபர்ட்டின் \"விலக்கப்பட்ட நடுப்பகுதியின் குறைபாடு\" இதில் பெரும்பகுதியை விளக்குகிறது: மேற்கத்திய மிஷனரிகள் தேவனைப் (பரலோகம்) பற்றியும் அறிவியலைப் (பூமி) பற்றியும் போதித்தார்கள், ஆனால் ஆவிகள், சாபங்கள், சுகம் என்ற நடு உலகத்துக்கு இறையியல் இல்லை. ஆப்பிரிக்க, இந்திய மக்கள் அந்தக் கேள்விகளைக் கேட்பதை நிறுத்தவில்லை; அதனால் அங்குள்ள சபை பதில் சொல்கிறது. அந்தப் பகுதிகளில் தீமை வலிமையானது அல்ல; அது வெளிப்படையாகப் பெயரிடப்பட்டு வெளிப்படையாகச் செய்யப்படுகிறது. மேற்கு அதே அதிகாரங்களை வேறு பெயர்களில் எதிர்கொள்கிறது."] },

    { id: "balance", type: "scale", title: ["Is it over-exaggerated? Weigh it yourself", "இது மிகைப்படுத்தப்பட்டதா? நீங்களே சீர்தூக்குங்கள்"], short: ["Exaggerated?", "மிகைப்படுத்தலா?"],
      lead: ["C.S. Lewis: \"There are two equal and opposite errors into which our race can fall about the devils. One is to disbelieve in their existence. The other is to believe, and to feel an excessive and unhealthy interest in them.\" Tap what you have seen in churches you know and watch the scale.", "சி.எஸ். லூயிஸ்: \"பிசாசுகளைப் பற்றி நம் இனம் விழக்கூடிய இரண்டு சமமான, எதிரெதிரான தவறுகள் உண்டு. ஒன்று அவற்றின் இருப்பை நம்பாதிருப்பது. மற்றொன்று நம்பி, அவற்றில் அளவுக்கு மீறிய ஆரோக்கியமற்ற ஆர்வம் காட்டுவது.\" உங்களுக்குத் தெரிந்த சபைகளில் கண்டதைத் தொட்டு தராசைப் பாருங்கள்."],
      left: { h: ["Over-emphasis", "அதிக வலியுறுத்தல்"], items: [
        ["A demon behind every problem", "ஒவ்வொரு பிரச்சனைக்குப் பின்னும் பிசாசு"],
        ["Fear of curses more than trust in Christ", "கிறிஸ்துவில் நம்பிக்கையை விடச் சாபங்களுக்குப் பயம்"],
        ["Blaming relatives or children as witches", "உறவினரையோ பிள்ளைகளையோ சூனியக்காரர் என்று குற்றஞ்சாட்டுதல்"],
        ["Paying for deliverance or \"anointed\" items", "விடுதலைக்காக அல்லது \"அபிஷேகிக்கப்பட்ட\" பொருட்களுக்காகப் பணம் செலுத்துதல்"],
        ["Ignoring medicine and counselling", "மருத்துவத்தையும் ஆலோசனையையும் புறக்கணித்தல்"],
        ["No personal responsibility: \"the devil made me\"", "தனிப்பட்ட பொறுப்பு இல்லை: \"பிசாசு செய்ய வைத்தது\""]
      ] },
      right: { h: ["Under-emphasis", "குறைந்த வலியுறுத்தல்"], items: [
        ["Spiritual causes never considered", "ஆவிக்குரிய காரணங்கள் ஒருபோதும் கருதப்படுவதில்லை"],
        ["Occult past never renounced", "மாந்திரீகக் கடந்தகாலம் ஒருபோதும் மறுதலிக்கப்படுவதில்லை"],
        ["Jesus' deliverance ministry treated as ancient myth", "இயேசுவின் விடுதலை ஊழியம் பழங்கதையாக நடத்தப்படுதல்"],
        ["Tormented people told only to \"try harder\"", "வேதனைப்படுபவர்களிடம் \"இன்னும் முயற்சி செய்\" என்று மட்டும் சொல்லுதல்"],
        ["Believers left helpless against fear and attack", "பயத்துக்கும் தாக்குதலுக்கும் எதிராக விசுவாசிகள் உதவியற்றவர்களாக விடப்படுதல்"],
        ["Church loses credibility in spirit-aware cultures", "ஆவியுலக விழிப்புள்ள கலாச்சாரங்களில் சபை நம்பகத்தன்மையை இழத்தல்"]
      ] },
      center: {
        p0: ["Select items on either side. Most churches lean one way.", "இருபுறமும் உள்ளவற்றைத் தேர்ந்தெடுங்கள். பெரும்பாலான சபைகள் ஒரு பக்கம் சாய்கின்றன."],
        even: ["Balanced, or both errors at once. Jesus held both: He took the devil seriously, and He was never afraid of him.", "சமநிலை, அல்லது இரண்டு தவறுகளும் ஒரே நேரத்தில். இயேசு இரண்டையும் தாங்கினார்: பிசாசைத் தீவிரமாக எடுத்தார், ஆனால் அவனுக்கு ஒருபோதும் பயப்படவில்லை."],
        left: ["Tilted toward over-emphasis. The cure: magnify Christ's finished work and the Father's love, add medical and counselling care, and protect the vulnerable.", "அதிக வலியுறுத்தலுக்குச் சாய்கிறது. மருந்து: கிறிஸ்துவின் முடிக்கப்பட்ட கிரியையையும் பிதாவின் அன்பையும் பெரிதாக்குங்கள், மருத்துவ, ஆலோசனைக் கவனிப்பைச் சேருங்கள், பாதிக்கப்படக்கூடியவர்களைக் காத்திடுங்கள்."],
        right: ["Tilted toward under-emphasis. The cure: recover Jesus' full ministry, teach believers their authority, and help people renounce and be set free.", "குறைந்த வலியுறுத்தலுக்குச் சாய்கிறது. மருந்து: இயேசுவின் முழு ஊழியத்தை மீட்டெடுங்கள், விசுவாசிகளுக்கு அவர்கள் அதிகாரத்தைப் போதியுங்கள், மறுதலித்து விடுதலையாக மக்களுக்கு உதவுங்கள்."]
      } },

    { id: "identify", type: "check", title: ["Identify: what kind of help is needed?", "அடையாளம் காணுதல்: எந்த வகை உதவி தேவை?"], short: ["Identify", "அடையாளம்"],
      lead: ["Derek Prince listed seven common indicators of a curse: mental or emotional breakdown, repeated or hereditary sickness, barrenness and miscarriage, family breakdown, continuing financial lack, being accident-prone, and a family history of suicide or early death. Each of these also has natural causes. Tick what applies to see a balanced picture.", "சாபத்தின் ஏழு பொதுவான அடையாளங்களை டெரெக் பிரின்ஸ் பட்டியலிட்டார்: மன அல்லது உணர்ச்சிச் சீர்குலைவு, மீண்டும் மீண்டும் வரும் அல்லது பரம்பரை நோய், மலட்டுத்தன்மையும் கருச்சிதைவும், குடும்ப உடைவு, தொடரும் பணப் பற்றாக்குறை, அடிக்கடி விபத்துகள், குடும்பத்தில் தற்கொலை அல்லது அகால மரண வரலாறு. இவை ஒவ்வொன்றுக்கும் இயற்கையான காரணங்களும் உண்டு. சமநிலையான படத்தைக் காணப் பொருந்துவதைக் குறியுங்கள்."],
      groups: {
        spirit: { h: ["Spiritual", "ஆவிக்குரியது"], c: "var(--rose)", p: ["Seek prayer ministry: renounce, forgive, break curses, and if needed receive deliverance from mature, accountable believers.", "ஜெப ஊழியத்தை நாடுங்கள்: மறுதலித்து, மன்னித்து, சாபங்களை முறித்து, தேவையானால் முதிர்ந்த, பொறுப்புள்ள விசுவாசிகளிடமிருந்து விடுதலை பெறுங்கள்."] },
        body: { h: ["Medical", "மருத்துவம்"], c: "var(--tide)", p: ["See a doctor. Many \"curse\" symptoms are thyroid, anaemia, epilepsy, sleep or hormonal problems. Pray and get tests.", "மருத்துவரைப் பாருங்கள். பல \"சாப\" அறிகுறிகள் தைராய்டு, இரத்தசோகை, வலிப்பு, தூக்கம் அல்லது ஹார்மோன் பிரச்சனைகள். ஜெபியுங்கள், பரிசோதனை செய்யுங்கள்."] },
        soul: { h: ["Emotional / trauma", "உணர்ச்சி / அதிர்ச்சி"], c: "var(--sky)", p: ["Seek inner healing and a trauma-informed Christian counsellor. Healing memories often removes the ground demons used.", "உள்சுகத்தையும் அதிர்ச்சி அறிந்த கிறிஸ்தவ ஆலோசகரையும் நாடுங்கள். நினைவுகள் சுகமாவது பிசாசுகள் பயன்படுத்திய இடத்தை அடிக்கடி நீக்குகிறது."] },
        family: { h: ["Family system / practical", "குடும்ப அமைப்பு / நடைமுறை"], c: "var(--flame)", p: ["Look at learned patterns: money habits, conflict styles, alcohol, abuse. Get practical mentoring, safety if needed, and community support.", "கற்றுக்கொண்ட போக்குகளைப் பாருங்கள்: பணப் பழக்கங்கள், சண்டை முறைகள், மது, துஷ்பிரயோகம். நடைமுறை வழிகாட்டுதல், தேவையானால் பாதுகாப்பு, சமூக ஆதரவு பெறுங்கள்."] }
      },
      items: [
        { k: "spirit", t: ["Past involvement in occult, astrology, charms, mantravadis or seances", "மாந்திரீகம், ஜோதிடம், தாயத்துகள், மந்திரவாதிகள், ஆவிகளோடு பேசுதல் ஆகியவற்றில் கடந்தகாலத் தொடர்பு"] },
        { k: "spirit", t: ["Family dedications to deities, temple vows or secret-society oaths", "தெய்வங்களுக்குக் குடும்ப நேர்த்திக்கடன்கள், கோவில் சபதங்கள், இரகசியச் சங்க ஆணைகள்"] },
        { k: "spirit", t: ["Strong reaction to Jesus' name, Scripture or worship", "இயேசுவின் நாமம், வேதம், ஆராதனைக்குக் கடுமையான எதிர்வினை"] },
        { k: "spirit", t: ["Same tragedy repeating across generations at similar ages", "ஒரே வயதில் தலைமுறைகள் தோறும் ஒரே துயரம் திரும்ப நிகழ்தல்"] },
        { k: "body", t: ["Physical symptoms never medically checked", "மருத்துவ ரீதியாக ஒருபோதும் பரிசோதிக்கப்படாத உடல் அறிகுறிகள்"] },
        { k: "body", t: ["Hearing voices, extreme mood swings, seizures, or not sleeping for days", "குரல்கள் கேட்டல், கடுமையான மனநிலை மாற்றங்கள், வலிப்பு, அல்லது நாட்கணக்கில் தூங்காமை"] },
        { k: "body", t: ["Hereditary illness in the family (diabetes, heart disease, depression)", "குடும்பத்தில் பரம்பரை நோய் (நீரிழிவு, இதய நோய், மனச்சோர்வு)"] },
        { k: "soul", t: ["Childhood abuse, loss or trauma never talked about", "ஒருபோதும் பேசப்படாத குழந்தைப்பருவத் துஷ்பிரயோகம், இழப்பு அல்லது அதிர்ச்சி"] },
        { k: "soul", t: ["Deep shame, self-hatred or inner vows (\"I'll never...\")", "ஆழ்ந்த வெட்கம், சுய வெறுப்பு அல்லது உள் சபதங்கள் (\"நான் ஒருபோதும்...\")"] },
        { k: "soul", t: ["Unforgiveness or bitterness toward a parent or spouse", "பெற்றோர் அல்லது வாழ்க்கைத்துணை மேல் மன்னியாமை அல்லது கசப்பு"] },
        { k: "family", t: ["Patterns of debt, alcohol, anger or violence in the home", "வீட்டில் கடன், மது, கோபம் அல்லது வன்முறையின் போக்குகள்"] },
        { k: "family", t: ["No safe friends or church community to walk with", "உடன் நடக்கப் பாதுகாப்பான நண்பர்களோ சபைச் சமூகமோ இல்லை"] }
      ],
      note: ["Not a diagnosis. If you or someone near you is in danger or thinking of suicide, contact local emergency services or a crisis line now. In India, Tele-MANAS is 14416.", "இது நோயறிதல் அல்ல. நீங்களோ அருகிலுள்ளவரோ ஆபத்தில் இருந்தால் அல்லது தற்கொலை எண்ணத்தில் இருந்தால், உடனே உள்ளூர் அவசர சேவையையோ நெருக்கடி உதவி எண்ணையோ தொடர்புகொள்ளுங்கள். இந்தியாவில் டெலி-மனஸ் 14416."] },

    { id: "models", type: "table", title: ["Deliverance models compared", "விடுதலை மாதிரிகளின் ஒப்பீடு"], short: ["Models", "மாதிரிகள்"],
      lead: ["Christians practise deliverance in quite different ways. Tap a model to focus.", "கிறிஸ்தவர்கள் விடுதலையை மிகவும் வேறுபட்ட வழிகளில் செய்கிறார்கள். கவனம் செலுத்த ஒரு மாதிரியைத் தொடுங்கள்."], filter: true,
      cols: [["Model", "மாதிரி"], ["Focus", "கவனம்"], ["Typical practice", "வழக்கமான நடைமுறை"], ["Strength / risk", "பலம் / அபாயம்"]],
      rows: [
        [["Power encounter", "வல்லமைச் சந்திப்பு"], ["Casting out spirits by command", "கட்டளையால் ஆவிகளைத் துரத்துதல்"], ["Prince, Hammond, many Pentecostal & African churches: naming and expelling spirits", "பிரின்ஸ், ஹேமண்ட், பல பெந்தெகொஸ்தே & ஆப்பிரிக்கச் சபைகள்: ஆவிகளைப் பெயரிட்டுத் துரத்துதல்"], ["Takes the enemy seriously / can become loud, long, dramatic and humiliating", "சத்துருவைத் தீவிரமாக எடுக்கிறது / சத்தமாக, நீண்டதாக, நாடகத்தனமாக, அவமானப்படுத்துவதாக மாறலாம்"]],
        [["Truth encounter", "சத்தியச் சந்திப்பு"], ["Replacing lies with truth; the person takes responsibility", "பொய்களைச் சத்தியத்தால் மாற்றுதல்; அந்த மனிதரே பொறுப்பேற்கிறார்"], ["Neil Anderson's *Steps to Freedom in Christ*: confessing, renouncing, forgiving, declaring", "நீல் ஆண்டர்சனின் *கிறிஸ்துவில் விடுதலைக்கான படிகள்*: அறிக்கையிடுதல், மறுதலித்தல், மன்னித்தல், அறிவித்தல்"], ["Calm, dignifying, repeatable / may under-serve severe manifestations", "அமைதியானது, மானம் தருவது, திரும்பச் செய்யக்கூடியது / கடுமையான வெளிப்பாடுகளுக்குப் போதாமல் போகலாம்"]],
        [["Allegiance encounter", "விசுவாசப் பற்றுச் சந்திப்பு"], ["Transferring loyalty fully to Jesus", "விசுவாசப் பற்றை முழுமையாக இயேசுவுக்கு மாற்றுதல்"], ["Charles Kraft: allegiance, truth and power together", "சார்லஸ் கிராஃப்ட்: விசுவாசப் பற்று, சத்தியம், வல்லமை இணைந்து"], ["Holistic / requires discipleship over time", "முழுமையானது / காலப்போக்கில் சீஷத்துவம் தேவை"]],
        [["Inner healing", "உள்சுகம்"], ["Healing wounds and memories that gave ground", "இடம் கொடுத்த காயங்களையும் நினைவுகளையும் சுகமாக்குதல்"], ["Elijah House (Sandford), Sozo, Immanuel approach: inviting Jesus into memories", "எலியா ஹவுஸ் (சேண்ட்ஃபோர்ட்), சோசோ, இம்மானுவேல் முறை: நினைவுகளுக்குள் இயேசுவை அழைத்தல்"], ["Deep and gentle / needs trained, accountable facilitators", "ஆழமானது, மென்மையானது / பயிற்சி பெற்ற, பொறுப்புள்ள வழிநடத்துநர்கள் தேவை"]],
        [["Liturgical", "வழிபாட்டு முறை"], ["Church authority, sacraments and rites", "சபை அதிகாரம், திருவருட்சாதனங்கள், சடங்குகள்"], ["Catholic, Orthodox and Anglican exorcism with medical screening; baptismal renunciation", "மருத்துவப் பரிசோதனையோடு கத்தோலிக்க, ஆர்த்தடாக்ஸ், ஆங்கிலிகன் பேயோட்டுதல்; ஞானஸ்நான மறுதலித்தல்"], ["Careful and accountable / can be slow and inaccessible", "கவனமானது, பொறுப்புள்ளது / மெதுவானதாக, அணுக முடியாததாக இருக்கலாம்"]],
        [["Relational / integrated", "உறவுமுறை / ஒருங்கிணைந்த"], ["Identity in union with Christ + healing + authority + community", "கிறிஸ்துவோடு ஐக்கியத்தில் அடையாளம் + சுகம் + அதிகாரம் + சமூகம்"], ["Start with the Father's love; renounce and forgive; command calmly; follow with discipleship and care", "பிதாவின் அன்போடு தொடங்குதல்; மறுதலித்து மன்னித்தல்; அமைதியாகக் கட்டளையிடுதல்; சீஷத்துவமும் கவனிப்பும் தொடருதல்"], ["Lasting fruit / needs a healthy church culture", "நிலையான கனி / ஆரோக்கியமான சபைக் கலாச்சாரம் தேவை"]]
      ] },

    { id: "process", type: "steps", title: ["Breaking curses and walking free: step by step", "சாபங்களை முறித்து விடுதலையில் நடத்தல்: படிப்படியாக"], short: ["Step by step", "படிப்படியாக"],
      lead: ["A pastoral process drawn from Derek Prince, Neil Anderson and relational inner-healing practice. Do it with a mature believer present. Prayers are examples; speak from your heart.", "டெரெக் பிரின்ஸ், நீல் ஆண்டர்சன், உறவுமுறை உள்சுக நடைமுறையிலிருந்து எடுக்கப்பட்ட மேய்ப்புச் செயல்முறை. முதிர்ந்த விசுவாசி உடனிருக்கச் செய்யுங்கள். ஜெபங்கள் உதாரணங்கள்; உங்கள் இருதயத்திலிருந்து பேசுங்கள்."],
      items: [
        { h: ["Rest in the Father's love", "பிதாவின் அன்பில் இளைப்பாறுங்கள்"], r: "Rom 8:15; Col 1:13", p: ["Start from position, not panic. You have been transferred into the Kingdom of the Son He loves. Freedom is your inheritance, not a prize.", "பதற்றத்திலிருந்து அல்ல, நிலையிலிருந்து தொடங்குங்கள். அவர் நேசிக்கும் குமாரனின் ராஜ்யத்துக்குள் மாற்றப்பட்டிருக்கிறீர்கள். விடுதலை உங்கள் சுதந்தரம், பரிசு அல்ல."], prayer: ["\"Father, thank You that I am Your child. Jesus, You are my Lord. Holy Spirit, show me anything that needs to be brought into the light.\"", "\"பிதாவே, நான் உம் பிள்ளை என்பதற்காக நன்றி. இயேசுவே, நீரே என் ஆண்டவர். பரிசுத்த ஆவியே, வெளிச்சத்துக்குக் கொண்டுவர வேண்டியதை எனக்குக் காட்டும்.\""] },
        { h: ["Identify the patterns", "போக்குகளை அடையாளம் காணுங்கள்"], r: "Ps 139:23–24", p: ["Write a family history: illnesses, deaths, addictions, divorces, occult practice, dedications. Note your own involvement and repeated cycles.", "குடும்ப வரலாற்றை எழுதுங்கள்: நோய்கள், மரணங்கள், அடிமைத்தனங்கள், விவாகரத்துகள், மாந்திரீகப் பழக்கம், நேர்த்திக்கடன்கள். உங்கள் சொந்தத் தொடர்பையும் திரும்பத் திரும்ப வரும் சுழற்சிகளையும் குறியுங்கள்."] },
        { h: ["Confess and repent", "அறிக்கையிட்டு மனந்திரும்புங்கள்"], r: "1 John 1:9; Lev 26:40", p: ["Confess your own sins specifically. Then, like Nehemiah and Daniel, acknowledge your ancestors' sins without carrying guilt for them.", "உங்கள் சொந்தப் பாவங்களைக் குறிப்பாக அறிக்கையிடுங்கள். பிறகு நெகேமியா, தானியேலைப் போல, உங்கள் முன்னோரின் பாவங்களுக்குக் குற்ற உணர்வைச் சுமக்காமல் அவற்றை ஒப்புக்கொள்ளுங்கள்."], prayer: ["\"Lord, I confess my sin of ___ and I turn from it. I also acknowledge the sins of my forefathers, especially ___. I thank You that the blood of Jesus cleanses me.\"", "\"ஆண்டவரே, ___ என்ற என் பாவத்தை அறிக்கையிட்டு அதிலிருந்து திரும்புகிறேன். என் முன்னோரின் பாவங்களையும், குறிப்பாக ___, ஒப்புக்கொள்கிறேன். இயேசுவின் இரத்தம் என்னைச் சுத்திகரிப்பதற்காக நன்றி.\""] },
        { h: ["Forgive everyone", "எல்லாரையும் மன்னியுங்கள்"], r: "Mark 11:25; Matt 18:35", p: ["Forgive parents, relatives, anyone who cursed or harmed you, and yourself. Forgiveness is a decision to release the debt to God; it does not mean trusting an unsafe person.", "பெற்றோர், உறவினர், உங்களைச் சபித்த அல்லது தீங்கு செய்த யாரையும், உங்களையும் மன்னியுங்கள். மன்னிப்பு கடனைத் தேவனிடம் விடுவிக்கும் தீர்மானம்; பாதுகாப்பற்ற ஒருவரை நம்புவது என்று அர்த்தமல்ல."], prayer: ["\"Father, I choose to forgive ___ for ___, which made me feel ___. I release them to You and I bless them.\"", "\"பிதாவே, ___ செய்ததற்காக ___-ஐ மன்னிக்கத் தீர்மானிக்கிறேன்; அது என்னை ___ என்று உணர வைத்தது. அவர்களை உம்மிடம் விடுவித்து ஆசீர்வதிக்கிறேன்.\""] },
        { h: ["Renounce and remove", "மறுதலித்து நீக்குங்கள்"], r: "2 Cor 4:2; Acts 19:19", p: ["Renounce by name every occult practice, vow, dedication and covenant. Remove charms, idols, occult books and objects from your home.", "ஒவ்வொரு மாந்திரீகப் பழக்கம், சபதம், நேர்த்திக்கடன், உடன்படிக்கையைப் பெயர் சொல்லி மறுதலியுங்கள். தாயத்துகள், விக்கிரகங்கள், மாந்திரீகப் புத்தகங்கள், பொருட்களை வீட்டிலிருந்து அகற்றுங்கள்."], prayer: ["\"In the name of Jesus I renounce ___ and every dedication made over me to any god or spirit. I belong to Jesus Christ alone.\"", "\"இயேசுவின் நாமத்தில் ___-ஐயும் எந்தத் தெய்வத்துக்கோ ஆவிக்கோ என்மேல் செய்யப்பட்ட ஒவ்வொரு நேர்த்திக்கடனையும் மறுதலிக்கிறேன். நான் இயேசு கிறிஸ்துவுக்கு மட்டுமே சொந்தம்.\""] },
        { h: ["Break the curse", "சாபத்தை முறியுங்கள்"], r: "Gal 3:13–14; Col 2:14–15", p: ["Speak from the authority of the cross, calmly. You are not fighting for victory but from it.", "சிலுவையின் அதிகாரத்திலிருந்து அமைதியாகப் பேசுங்கள். வெற்றிக்காக அல்ல, வெற்றியிலிருந்து போராடுகிறீர்கள்."], prayer: ["\"Christ became a curse for me. By His blood I break every curse over my life and family line from both my father's and mother's side, every word curse and every work of witchcraft. I receive the blessing of Abraham.\"", "\"கிறிஸ்து எனக்காகச் சாபமானார். அவர் இரத்தத்தால் என் வாழ்க்கையின் மேலும், என் தகப்பன், தாய் இருபக்கக் குடும்ப வரிசையின் மேலும் உள்ள ஒவ்வொரு சாபத்தையும், ஒவ்வொரு வார்த்தைச் சாபத்தையும், சூனியத்தின் ஒவ்வொரு கிரியையையும் முறிக்கிறேன். ஆபிரகாமின் ஆசீர்வாதத்தைப் பெறுகிறேன்.\""] },
        { h: ["Command spirits to leave", "ஆவிகளை வெளியேறக் கட்டளையிடுங்கள்"], r: "Mark 16:17; Luke 10:19", p: ["If there are signs of demonic presence, a leader commands any spirit that had ground to leave in Jesus' name. Keep it short and calm; no shouting, no conversations with spirits, no physical force.", "பிசாசின் பிரசன்ன அடையாளங்கள் இருந்தால், இடம் பெற்றிருந்த எந்த ஆவியையும் இயேசுவின் நாமத்தில் வெளியேறத் தலைவர் கட்டளையிடுகிறார். சுருக்கமாக, அமைதியாக; கத்துதல் இல்லை, ஆவிகளோடு உரையாடல் இல்லை, உடல் பலம் இல்லை."], prayer: ["\"Every spirit that had ground through these doors, your rights are cancelled. In the name of Jesus, leave now and go where Jesus sends you.\"", "\"இந்தக் கதவுகள் வழியாக இடம் பெற்றிருந்த ஒவ்வொரு ஆவியே, உன் உரிமைகள் ரத்து செய்யப்பட்டன. இயேசுவின் நாமத்தில் இப்போதே வெளியேறி, இயேசு அனுப்பும் இடத்துக்குப் போ.\""] },
        { h: ["Be filled and blessed", "நிரப்பப்பட்டு ஆசீர்வதிக்கப்படுங்கள்"], r: "Luke 11:24–26; Eph 5:18", p: ["An empty house invites return. Ask the Holy Spirit to fill every space. Have a father or mother in the faith speak blessing and identity over the person.", "காலியான வீடு திரும்ப வருவதை அழைக்கிறது. ஒவ்வொரு இடத்தையும் நிரப்பப் பரிசுத்த ஆவியிடம் கேளுங்கள். விசுவாசத்தில் ஒரு தகப்பனோ தாயோ அந்த மனிதர்மேல் ஆசீர்வாதத்தையும் அடையாளத்தையும் பேசட்டும்."], prayer: ["\"Holy Spirit, fill me. Father, speak Your blessing over me.\" (A leader: \"You are a beloved child of God. The Lord bless you and keep you...\")", "\"பரிசுத்த ஆவியே, என்னை நிரப்பும். பிதாவே, உம் ஆசீர்வாதத்தை என்மேல் பேசும்.\" (தலைவர்: \"நீங்கள் தேவனுடைய பிரியமான பிள்ளை. கர்த்தர் உங்களை ஆசீர்வதித்துக் காப்பாராக...\")"] },
        { h: ["Walk it out", "நடந்து காட்டுங்கள்"], r: "Rom 12:2; Gal 5:1; Jas 5:16", p: ["Renew your mind daily with Scripture, stay in a caring community, keep short accounts, continue counselling or medical care as needed, and bless your family line forward.", "தினமும் வேதத்தால் மனதைப் புதுப்பியுங்கள், அக்கறையுள்ள சமூகத்தில் நிலைத்திருங்கள், கணக்குகளைச் சீக்கிரம் தீருங்கள், தேவைக்கேற்ப ஆலோசனையையோ மருத்துவக் கவனிப்பையோ தொடருங்கள், உங்கள் குடும்ப வரிசையை முன்னோக்கி ஆசீர்வதியுங்கள்."] }
      ] },

    { id: "stubborn", type: "decide", title: ["Stubborn curses: a troubleshooting tree", "பிடிவாதமான சாபங்கள்: சிக்கல் தீர்க்கும் மரம்"], short: ["Stubborn curses", "பிடிவாதச் சாபம்"],
      lead: ["You have prayed, yet the pattern continues. Answer honestly and follow the branches.", "ஜெபித்திருக்கிறீர்கள், ஆனாலும் போக்கு தொடர்கிறது. நேர்மையாகப் பதில் சொல்லி கிளைகளைப் பின்தொடருங்கள்."],
      start: "a",
      nodes: {
        a: { q: ["Have you checked for medical, psychological or practical causes?", "மருத்துவ, உளவியல், நடைமுறைக் காரணங்களைச் சோதித்திருக்கிறீர்களா?"], opts: [{ l: ["Yes", "ஆம்"], to: "b" }, { l: ["No / not fully", "இல்லை / முழுமையாக இல்லை"], to: "r1" }] },
        b: { q: ["Is there anyone you still haven't forgiven, including yourself or God?", "நீங்கள் இன்னும் மன்னிக்காத யாராவது இருக்கிறார்களா, உங்களையோ தேவனையோ உட்பட?"], opts: [{ l: ["Yes, honestly", "ஆம், நேர்மையாக"], to: "r2" }, { l: ["No", "இல்லை"], to: "c" }] },
        c: { q: ["Are occult objects, charms, idols or ongoing family rituals still in your home or life?", "மாந்திரீகப் பொருட்கள், தாயத்துகள், விக்கிரகங்கள் அல்லது தொடரும் குடும்பச் சடங்குகள் இன்னும் உங்கள் வீட்டில் அல்லது வாழ்வில் இருக்கின்றனவா?"], opts: [{ l: ["Yes / not sure", "ஆம் / உறுதியில்லை"], to: "r3" }, { l: ["No", "இல்லை"], to: "d" }] },
        d: { q: ["Is there a sin you keep returning to, or a vow or covenant not yet renounced?", "நீங்கள் திரும்பத் திரும்பச் செல்லும் பாவமோ, இன்னும் மறுதலிக்கப்படாத சபதமோ உடன்படிக்கையோ இருக்கிறதா?"], opts: [{ l: ["Yes", "ஆம்"], to: "r4" }, { l: ["No", "இல்லை"], to: "e" }] },
        e: { q: ["Do you live with fear of the curse, or expect it to strike?", "சாபம் தாக்கும் என்ற பயத்தோடு அல்லது எதிர்பார்ப்போடு வாழ்கிறீர்களா?"], opts: [{ l: ["Yes", "ஆம்"], to: "r5" }, { l: ["No", "இல்லை"], to: "f" }] },
        f: { q: ["Are you walking this alone?", "இதைத் தனியாக நடக்கிறீர்களா?"], opts: [{ l: ["Yes", "ஆம்"], to: "r6" }, { l: ["No, I have support", "இல்லை, ஆதரவு உண்டு"], to: "r7" }] },
        r1: { end: true, h: ["Start with a full check-up", "முழு பரிசோதனையோடு தொடங்குங்கள்"], r: "Col 4:14", p: ["Pray and see a doctor, and if needed a counsellor. Many \"stubborn curses\" turn out to have a treatable cause; healing through medicine is still God's healing.", "ஜெபித்து மருத்துவரைப் பாருங்கள், தேவையானால் ஆலோசகரையும். பல \"பிடிவாதமான சாபங்களுக்கு\" சிகிச்சையளிக்கக்கூடிய காரணம் இருக்கிறது; மருத்துவம் மூலம் வரும் சுகமும் தேவனுடைய சுகமே."] },
        r2: { end: true, h: ["Forgiveness is the key that's missing", "விடுபட்ட திறவுகோல் மன்னிப்பே"], r: "Matt 18:34–35", p: ["Unforgiveness is the most common reason deliverance doesn't hold. Forgive specifically, by name, aloud, perhaps with someone present. Let feelings catch up later.", "விடுதலை நிலைக்காததற்கு மிகப் பொதுவான காரணம் மன்னியாமை. குறிப்பாக, பெயர் சொல்லி, உரக்க, முடிந்தால் யாராவது உடனிருக்க மன்னியுங்கள். உணர்வுகள் பின்னர் வரட்டும்."] },
        r3: { end: true, h: ["Clear the house", "வீட்டைச் சுத்தம் செய்யுங்கள்"], r: "Deut 7:26; Acts 19:19", p: ["Remove and destroy objects tied to other gods or the occult. If family members still practise rituals, don't fight them; renounce your own participation, bless them, and pray for them. Your home can be dedicated to the Lord.", "அந்நிய தேவர்களோடு அல்லது மாந்திரீகத்தோடு தொடர்புள்ள பொருட்களை அகற்றி அழியுங்கள். குடும்ப உறுப்பினர்கள் இன்னும் சடங்குகளைச் செய்தால் அவர்களோடு சண்டையிடாதீர்கள்; உங்கள் சொந்தப் பங்கேற்பை மறுதலித்து, அவர்களை ஆசீர்வதித்து, அவர்களுக்காக ஜெபியுங்கள். உங்கள் வீட்டைக் கர்த்தருக்கு அர்ப்பணிக்கலாம்."] },
        r4: { end: true, h: ["Close the open door", "திறந்த கதவை மூடுங்கள்"], r: "Prov 28:13; Jas 5:16", p: ["A door you keep reopening gives renewed ground. Confess to a trusted person, renounce the vow or covenant aloud, and build accountability around the weak point.", "நீங்கள் திரும்பத் திரும்பத் திறக்கும் கதவு புதிய இடத்தைக் கொடுக்கிறது. நம்பகமான ஒருவரிடம் அறிக்கையிடுங்கள், சபதத்தையோ உடன்படிக்கையையோ உரக்க மறுதலியுங்கள், பலவீனமான இடத்தைச் சுற்றிப் பொறுப்புக்கூறலைக் கட்டுங்கள்."] },
        r5: { end: true, h: ["Fear is feeding it", "பயம் அதற்கு உணவளிக்கிறது"], r: "Job 3:25; 1 John 4:18; Num 23:23", p: ["Fear is agreement with the enemy's report. Replace it: \"There is no enchantment against Jacob\" (Num 23:23). Meditate on the Father's love, worship daily, and declare who you are in Christ until faith becomes bigger than fear.", "பயம் சத்துருவின் அறிக்கையோடு ஒப்பந்தம். அதை மாற்றுங்கள்: \"யாக்கோபுக்கு விரோதமான மந்திரவாதம் இல்லை\" (எண்ணாகமம் 23:23). பிதாவின் அன்பைத் தியானியுங்கள், தினமும் ஆராதியுங்கள், விசுவாசம் பயத்தை விடப் பெரிதாகும்வரை கிறிஸ்துவில் நீங்கள் யார் என்று அறிவியுங்கள்."] },
        r6: { end: true, h: ["Invite others in", "மற்றவர்களை உள்ளே அழையுங்கள்"], r: "Matt 18:19–20; Eccl 4:12", p: ["\"If two of you agree...\" Ask mature believers to pray with you, perhaps with fasting (Isa 58:6). Freedom grows and holds in community.", "\"உங்களில் இரண்டுபேர் ஒருமனப்பட்டு...\" முதிர்ந்த விசுவாசிகளை உங்களோடு ஜெபிக்கக் கேளுங்கள், முடிந்தால் உபவாசத்தோடு (ஏசாயா 58:6). விடுதலை சமூகத்தில் வளர்ந்து நிலைக்கிறது."] },
        r7: { end: true, h: ["Persevere and look at the long game", "விடாமுயற்சி செய்து நீண்ட பார்வையைக் கொள்ளுங்கள்"], r: "Luke 18:1; Gal 6:9; Dan 10:12–13", p: ["Some breakthroughs come through persistence (Daniel waited 21 days). Keep praying, keep blessing, keep walking in love. Some patterns break over a generation as a new family culture is built. Your faithfulness is not wasted.", "சில முன்னேற்றங்கள் விடாமுயற்சியால் வருகின்றன (தானியேல் 21 நாட்கள் காத்திருந்தார்). தொடர்ந்து ஜெபியுங்கள், ஆசீர்வதியுங்கள், அன்பில் நடங்கள். புதிய குடும்பக் கலாச்சாரம் கட்டப்படும்போது சில போக்குகள் ஒரு தலைமுறையில் முறிகின்றன. உங்கள் உண்மைத்தன்மை வீணாவதில்லை."] }
      } },

    { id: "witchcraft", type: "cards", title: ["Witchcraft: understanding and overcoming it", "சூனியம்: புரிந்துகொண்டு மேற்கொள்ளுதல்"], short: ["Witchcraft", "சூனியம்"],
      items: [
        { tag: ["Scripture", "வேதம்"], h: ["What witchcraft is", "சூனியம் என்றால் என்ன"], p: ["Seeking spiritual power apart from God to control, harm or manipulate.", "கட்டுப்படுத்த, தீங்கு செய்ய அல்லது சூழ்ச்சி செய்யத் தேவனைத் தவிர ஆவிக்குரிய வல்லமையைத் தேடுதல்."], r: "Deut 18:10–12; Gal 5:20", more: [["Scripture forbids divination, sorcery, interpreting omens, charms, mediums and consulting the dead (Deut 18:10–12). Paul lists *pharmakeia* (sorcery) among works of the flesh (Gal 5:20), showing it also lives in human manipulation and control, not only rituals.", "குறிசொல்லுதல், மாயவித்தை, சகுனம் பார்த்தல், மந்திரம், ஆவிகளோடு பேசுதல், மரித்தோரிடம் விசாரித்தல் ஆகியவற்றை வேதம் தடைசெய்கிறது (உபாகமம் 18:10–12). மாம்சத்தின் கிரியைகளில் *ஃபார்மாக்கியா* (பில்லிசூனியம்) என்பதைப் பவுல் பட்டியலிடுகிறார் (கலாத்தியர் 5:20); அது சடங்குகளில் மட்டுமல்ல, மனிதச் சூழ்ச்சியிலும் கட்டுப்பாட்டிலும் வாழ்கிறது என்று காட்டுகிறது."]] },
        { tag: ["Tamil context", "தமிழ்ச் சூழல்"], h: ["Seivinai, drishti & mantravadam", "செய்வினை, திருஷ்டி & மாந்திரீகம்"], p: ["Common fears, and a common business.", "பொதுவான பயங்கள், பொதுவான வியாபாரமும்."], r: "Isa 8:19–20", more: [["Many Tamil families fear *seivinai* (black magic done against them), *kan drishti* (evil eye) and curses buried as objects. Responses include lemons, chillies, black threads, *thayathu* and visits to *mantravadis*, sometimes even by churchgoers.", "பல தமிழ்க் குடும்பங்கள் *செய்வினை*, *கண் திருஷ்டி*, பொருட்களாகப் புதைக்கப்பட்ட சாபங்களுக்குப் பயப்படுகின்றன. எலுமிச்சை, மிளகாய், கருப்புக் கயிறு, *தாயத்து*, *மந்திரவாதிகளிடம்* செல்லுதல் ஆகியவை பதில்களாகின்றன, சிலநேரம் சபைக்குச் செல்பவர்களாலும்."], ["The biblical answer is not a Christian charm (oil, salt or water used like a talisman) but the person of Jesus: \"Should not a people seek their God?\" (Isa 8:19).", "வேதப் பதில் ஒரு கிறிஸ்தவத் தாயத்து அல்ல (தாயத்து போலப் பயன்படுத்தப்படும் எண்ணெய், உப்பு, தண்ணீர்), இயேசு என்ற நபரே: \"ஜனங்கள் தங்கள் தேவனிடத்தில் விசாரிக்கவேண்டியதல்லவோ?\" (ஏசாயா 8:19)."]] },
        { tag: ["Discernment", "பகுத்தறிவு"], h: ["Possible signs of attack", "தாக்குதலின் சாத்தியமான அடையாளங்கள்"], p: ["Handle with care; most have ordinary explanations.", "கவனமாகக் கையாளுங்கள்; பெரும்பாலானவற்றுக்குச் சாதாரண விளக்கங்கள் உண்டு."], r: "1 John 4:1", more: [["Ministers commonly report: sudden, unexplained oppression or heaviness; recurring nightmares with the same figures; sudden confusion or conflict at key moments; objects found at the doorstep; symptoms that lift during worship.", "ஊழியர்கள் பொதுவாகக் குறிப்பிடுவது: திடீர், விளக்கமில்லாத ஒடுக்குதல் அல்லது பாரம்; அதே உருவங்களோடு திரும்பத் திரும்ப வரும் கெட்ட சொப்பனங்கள்; முக்கியத் தருணங்களில் திடீர்க் குழப்பம் அல்லது சண்டை; வாசலில் கண்டெடுக்கப்படும் பொருட்கள்; ஆராதனையின்போது நீங்கும் அறிகுறிகள்."], ["None of these proves witchcraft. Discern with mature believers, and never assume a person is responsible without clear evidence.", "இவற்றில் எதுவும் சூனியத்தை நிரூபிக்காது. முதிர்ந்த விசுவாசிகளோடு பகுத்தறியுங்கள்; தெளிவான ஆதாரமின்றி ஒருவர்தான் காரணம் என்று ஒருபோதும் ஊகிக்காதீர்கள்."]] },
        { tag: ["Protection", "பாதுகாப்பு"], h: ["Your protection in Christ", "கிறிஸ்துவில் உங்கள் பாதுகாப்பு"], p: ["Hidden with Christ in God.", "கிறிஸ்துவோடு தேவனுக்குள் மறைந்திருத்தல்."], r: "Ps 91; Col 3:3; Num 23:23", more: [["\"Surely there is no enchantment against Jacob, nor divination against Israel\" (Num 23:23). Psalm 91, the armour of God (Eph 6:10–18), the blood of the Lamb and the word of testimony (Rev 12:11) are a believer's covering.", "\"யாக்கோபுக்கு விரோதமான மந்திரவாதம் இல்லை, இஸ்ரவேலுக்கு விரோதமான குறிசொல்லுதலும் இல்லை\" (எண்ணாகமம் 23:23). சங்கீதம் 91, தேவனுடைய சர்வாயுதவர்க்கம் (எபேசியர் 6:10–18), ஆட்டுக்குட்டியின் இரத்தம், சாட்சியின் வசனம் (வெளிப்படுத்தின விசேஷம் 12:11) விசுவாசியின் மறைவிடம்."], ["Practically: close open doors, live in the light, worship in your home, take Communion, pray Psalm 91 over your family, and refuse fear.", "நடைமுறையில்: திறந்த கதவுகளை மூடுங்கள், வெளிச்சத்தில் வாழுங்கள், வீட்டில் ஆராதியுங்கள், திருவிருந்தில் பங்குபெறுங்கள், குடும்பத்தின்மேல் சங்கீதம் 91-ஐ ஜெபியுங்கள், பயத்தை மறுங்கள்."]] },
        { tag: ["Response", "எதிர்வினை"], h: ["Bless, don't counter-curse", "எதிர்ச்சாபம் வேண்டாம், ஆசீர்வதியுங்கள்"], p: ["\"Bless those who curse you.\"", "\"உங்களைச் சபிக்கிறவர்களை ஆசீர்வதியுங்கள்.\""], r: "Luke 6:28; Rom 12:14, 21", more: [["Praying \"fire\" or death on suspected witches is not the way of Jesus. We break the power of the curse and bless the person, praying for their salvation. Overcome evil with good.", "சந்தேகிக்கப்படும் சூனியக்காரர்கள்மேல் \"அக்கினியையோ\" மரணத்தையோ ஜெபிப்பது இயேசுவின் வழி அல்ல. சாபத்தின் வல்லமையை முறித்து, அந்த மனிதரை ஆசீர்வதித்து, அவர் இரட்சிப்புக்காக ஜெபிக்கிறோம். நன்மையினாலே தீமையை வெல்லுங்கள்."]] },
        { tag: ["Protect the vulnerable", "பாதிக்கப்படக்கூடியவர்களைக் காத்திடுங்கள்"], h: ["Never accuse children or elders", "பிள்ளைகளையோ முதியோரையோ ஒருபோதும் குற்றஞ்சாட்டாதீர்கள்"], p: ["Accusations have led to real abuse.", "குற்றச்சாட்டுகள் உண்மையான துஷ்பிரயோகத்துக்கு வழிவகுத்திருக்கின்றன."], r: "Matt 18:6; Jas 1:27", more: [["UNICEF and church bodies have documented children and elderly women in parts of Africa and India being beaten, abandoned or killed after being labelled witches, sometimes after a church \"revelation\". This is a grave sin against the vulnerable whom Jesus protects.", "ஆப்பிரிக்கா, இந்தியாவின் சில பகுதிகளில் சூனியக்காரர்கள் என்று முத்திரை குத்தப்பட்ட பின், சிலநேரம் ஒரு சபை \"வெளிப்பாட்டுக்குப்\" பின், பிள்ளைகளும் வயதான பெண்களும் அடிக்கப்பட்டதையும் கைவிடப்பட்டதையும் கொல்லப்பட்டதையும் UNICEF-ம் சபை அமைப்புகளும் ஆவணப்படுத்தியுள்ளன. இயேசு காக்கும் பாதிக்கப்படக்கூடியவர்களுக்கு எதிரான கொடிய பாவம் இது."], ["Healthy ministry never names a person as a witch publicly, never uses physical force, and always protects children.", "ஆரோக்கியமான ஊழியம் ஒருபோதும் ஒருவரைப் பகிரங்கமாகச் சூனியக்காரர் என்று பெயரிடாது, உடல் பலத்தைப் பயன்படுத்தாது, எப்போதும் பிள்ளைகளைக் காக்கும்."]] }
      ] },

    { id: "cases", type: "cards", title: ["Experiences: composite case patterns", "அனுபவங்கள்: தொகுக்கப்பட்ட மாதிரிகள்"], short: ["Experiences", "அனுபவங்கள்"],
      lead: ["These are illustrative composites of patterns commonly reported in deliverance and pastoral ministry, not records of real individuals.", "இவை விடுதலை, மேய்ப்பு ஊழியத்தில் பொதுவாகக் குறிப்பிடப்படும் போக்குகளின் விளக்கத் தொகுப்புகள், உண்மையான நபர்களின் பதிவுகள் அல்ல."],
      items: [
        { tag: ["Generational pattern", "தலைமுறைப் போக்கு"], h: ["\"Every man in our family dies before 50\"", "\"எங்கள் குடும்பத்தில் ஒவ்வொரு ஆணும் 50-க்கு முன் இறக்கிறார்\""], p: ["Fear, family dedication, and heart disease together.", "பயம், குடும்ப நேர்த்திக்கடன், இதய நோய் இணைந்து."], more: [["A believer in his 40s is gripped by fear as his birthday approaches. Prayer reveals a grandfather's vow to a village deity, which he renounces with his pastor. He also gets a cardiac check-up, which finds high cholesterol, a family trait. He changes diet, takes medication, and lives free of the fear.", "40களில் உள்ள ஒரு விசுவாசி தன் பிறந்தநாள் நெருங்கும்போது பயத்தால் பிடிக்கப்படுகிறார். ஜெபம் ஒரு கிராமத் தெய்வத்துக்குத் தாத்தாவின் சபதத்தை வெளிப்படுத்துகிறது; அதைத் தன் போதகரோடு மறுதலிக்கிறார். இதயப் பரிசோதனையும் செய்கிறார்; குடும்பப் பண்பான அதிகக் கொழுப்பு கண்டறியப்படுகிறது. உணவை மாற்றி, மருந்து எடுத்து, பயமில்லாமல் வாழ்கிறார்."], ["**Lesson:** the spiritual and the medical were both real. Neither alone was the whole answer.", "**பாடம்:** ஆவிக்குரியதும் மருத்துவமும் இரண்டும் உண்மையானவை. எதுவும் தனியாக முழுப் பதில் அல்ல."]] },
        { tag: ["Occult door", "மாந்திரீகக் கதவு"], h: ["Nightmares after a \"harmless\" ritual", "\"தீங்கற்ற\" சடங்குக்குப் பின் கெட்ட சொப்பனங்கள்"], p: ["Renunciation brought peace.", "மறுதலித்தல் சமாதானத்தைக் கொண்டுவந்தது."], more: [["A young woman wore a thread from a soothsayer \"for exams\" before coming to faith. Years later she still has recurring night terrors. She renounces it, the thread is burned, and she is prayed for. The nightmares stop within weeks, and she starts counselling for the anxiety that remained.", "விசுவாசத்துக்கு வருவதற்கு முன் ஓர் இளம்பெண் \"தேர்வுகளுக்காக\" ஒரு குறிசொல்பவரின் கயிற்றை அணிந்திருந்தாள். ஆண்டுகள் கழித்தும் திரும்பத் திரும்ப இரவு பயங்கரங்கள். அதை மறுதலிக்கிறாள், கயிறு எரிக்கப்படுகிறது, அவளுக்காக ஜெபிக்கப்படுகிறது. சில வாரங்களில் கெட்ட சொப்பனங்கள் நிற்கின்றன; மீதமிருந்த கவலைக்கு ஆலோசனையைத் தொடங்குகிறாள்."]] },
        { tag: ["Misdiagnosis", "தவறான கண்டறிதல்"], h: ["\"Demon\" that was epilepsy", "வலிப்பாக இருந்த \"பிசாசு\""], p: ["Repeated deliverance sessions only added shame.", "திரும்பத் திரும்ப விடுதலை அமர்வுகள் வெட்கத்தை மட்டுமே கூட்டின."], more: [["A teenager's seizures were treated as demonic for two years. A visiting doctor at church encouraged an EEG; epilepsy was diagnosed and controlled with medication. The family needed healing from the shame of being told they were cursed.", "ஒரு பதின்வயதினரின் வலிப்பு இரண்டு ஆண்டுகள் பிசாசின் செயலாக நடத்தப்பட்டது. சபைக்கு வந்த ஒரு மருத்துவர் EEG செய்ய ஊக்குவித்தார்; வலிப்பு நோய் கண்டறியப்பட்டு மருந்தால் கட்டுப்படுத்தப்பட்டது. சபிக்கப்பட்டவர்கள் என்று சொல்லப்பட்ட வெட்கத்திலிருந்து குடும்பத்துக்குச் சுகம் தேவைப்பட்டது."], ["**Lesson:** Jesus distinguished between sickness and demons (Mark 1:34). So must we.", "**பாடம்:** நோயையும் பிசாசுகளையும் இயேசு வேறுபடுத்தினார் (மாற்கு 1:34). நாமும் அப்படியே செய்ய வேண்டும்."]] },
        { tag: ["Unforgiveness", "மன்னியாமை"], h: ["Freedom that wouldn't hold", "நிலைக்காத விடுதலை"], p: ["Until she forgave her father.", "அவள் தன் தகப்பனை மன்னிக்கும்வரை."], more: [["A woman received prayer many times for depression and oppression, with short relief each time. In a quieter inner-healing session she faces her anger toward an abusive father and chooses to forgive him (without excusing him). The oppression lifts, and the relief lasts this time.", "ஒரு பெண் மனச்சோர்வுக்கும் ஒடுக்குதலுக்கும் பலமுறை ஜெபம் பெற்றாள், ஒவ்வொரு முறையும் குறுகிய நிவாரணம். அமைதியான உள்சுக அமர்வில் துஷ்பிரயோகம் செய்த தகப்பன்மேல் உள்ள கோபத்தை எதிர்கொண்டு, அவரை நியாயப்படுத்தாமல் மன்னிக்கத் தீர்மானிக்கிறாள். ஒடுக்குதல் நீங்குகிறது, இந்த முறை நிவாரணம் நிலைக்கிறது."]] }
      ] },

    { id: "objections", type: "flip", title: ["Criticism, objections and answers", "விமர்சனம், ஆட்சேபனைகள், பதில்கள்"], short: ["Objections", "ஆட்சேபனைகள்"],
      items: [
        { q: ["\"Christ already broke every curse. Curse-breaking denies the cross.\"", "\"கிறிஸ்து ஏற்கனவே ஒவ்வொரு சாபத்தையும் முறித்தார். சாபம் முறித்தல் சிலுவையை மறுக்கிறது.\""], a: ["The cross is the basis, not the rival. Salvation was finished too, yet each person must receive it. Curse-breaking prayer is applying Gal 3:13, not adding to it.", "சிலுவையே அடித்தளம், போட்டியாளர் அல்ல. இரட்சிப்பும் முடிக்கப்பட்டது, ஆனாலும் ஒவ்வொருவரும் அதைப் பெற வேண்டும். சாபம் முறிக்கும் ஜெபம் கலாத்தியர் 3:13-ஐப் பயன்படுத்துதல், அதோடு சேர்ப்பது அல்ல."], r: "Gal 3:13" },
        { q: ["\"The epistles never tell us to cast demons out of Christians.\"", "\"கிறிஸ்தவர்களிடமிருந்து பிசாசுகளைத் துரத்த நிருபங்கள் ஒருபோதும் சொல்லவில்லை.\""], a: ["True: the epistles emphasise resisting, truth, repentance and the armour of God. But they also warn believers not to \"give place\" to the devil and call some to \"escape the snare of the devil\" (2 Tim 2:26). Deliverance is best seen as helping believers do what the epistles teach.", "உண்மை: நிருபங்கள் எதிர்த்தல், சத்தியம், மனந்திரும்புதல், தேவனுடைய சர்வாயுதவர்க்கத்தை வலியுறுத்துகின்றன. ஆனால் பிசாசுக்கு \"இடங்கொடாதிருங்கள்\" என்று எச்சரித்து, சிலரைப் \"பிசாசின் கண்ணியிலிருந்து விடுபட\" அழைக்கின்றன (2 தீமோத்தேயு 2:26). நிருபங்கள் போதிப்பதைச் செய்ய விசுவாசிகளுக்கு உதவுவதாக விடுதலையைப் பார்ப்பதே சிறந்தது."], r: "2 Tim 2:25–26" },
        { q: ["\"It's just superstition and psychology.\"", "\"இது வெறும் மூடநம்பிக்கையும் உளவியலும்.\""], a: ["Psychology explains a lot and should be used. But Jesus, the apostles and the early church treated evil spirits as real, and many believers worldwide experience freedom that therapy alone did not bring. Both lenses together see more.", "உளவியல் நிறைய விளக்குகிறது, பயன்படுத்தப்பட வேண்டும். ஆனால் இயேசுவும் அப்போஸ்தலரும் ஆதித் திருச்சபையும் தீய ஆவிகளை உண்மையானவையாக நடத்தினார்கள்; சிகிச்சை மட்டும் கொண்டுவராத விடுதலையை உலகெங்கும் பல விசுவாசிகள் அனுபவிக்கிறார்கள். இரண்டு கண்ணோட்டங்களும் சேர்ந்தால் அதிகம் தெரியும்."], r: "Mark 1:34" },
        { q: ["\"Generational curses contradict Ezekiel 18.\"", "\"தலைமுறைச் சாபங்கள் எசேக்கியேல் 18-க்கு முரணானவை.\""], a: ["Ezekiel removes inherited *guilt*: no one is punished for a parent's sin. Exodus 20 describes inherited *consequences and patterns* among those who keep hating God. Both are true; repentance breaks the chain, which is Ezekiel's whole point (18:14–17).", "எசேக்கியேல் பரம்பரைக் *குற்றத்தை* நீக்குகிறார்: பெற்றோரின் பாவத்துக்காக யாரும் தண்டிக்கப்படுவதில்லை. யாத்திராகமம் 20 தேவனைப் பகைத்துக்கொண்டே இருப்பவர்களிடையே பரம்பரை *விளைவுகளையும் போக்குகளையும்* விவரிக்கிறது. இரண்டும் உண்மை; மனந்திரும்புதல் சங்கிலியை முறிக்கிறது, அதுவே எசேக்கியேலின் முழுக் கருத்து (18:14–17)."], r: "Ezek 18:14–17" },
        { q: ["\"It produces fear and blame.\"", "\"இது பயத்தையும் குற்றச்சாட்டையும் உண்டாக்குகிறது.\""], a: ["Bad deliverance does. Good deliverance starts and ends in the Father's love, refuses to blame victims, protects children, and leaves people less afraid of the devil than before.", "மோசமான விடுதலை அப்படிச் செய்கிறது. நல்ல விடுதலை பிதாவின் அன்பில் தொடங்கி முடிகிறது, பாதிக்கப்பட்டவர்களைக் குற்றஞ்சாட்ட மறுக்கிறது, பிள்ளைகளைக் காக்கிறது, முன்பை விடப் பிசாசுக்குக் குறைவாகப் பயப்படும்படி மக்களை விடுகிறது."], r: "1 John 4:18" },
        { q: ["\"Deliverance ministers exploit people for money.\"", "\"விடுதலை ஊழியர்கள் பணத்துக்காக மக்களைச் சுரண்டுகிறார்கள்.\""], a: ["Some do, and Scripture condemns it (Acts 8:20; 2 Pet 2:3). Freedom in Christ is never for sale. Test ministries by fruit, transparency and accountability.", "சிலர் அப்படிச் செய்கிறார்கள், வேதம் அதைக் கண்டிக்கிறது (அப்போஸ்தலர் 8:20; 2 பேதுரு 2:3). கிறிஸ்துவில் விடுதலை ஒருபோதும் விற்பனைக்கு அல்ல. ஊழியங்களைக் கனி, வெளிப்படைத்தன்மை, பொறுப்புக்கூறலால் சோதியுங்கள்."], r: "Matt 10:8" },
        { q: ["\"A Christian can't have a demon, so why minister deliverance to believers?\"", "\"கிறிஸ்தவனுக்குப் பிசாசு இருக்க முடியாது, பிறகு ஏன் விசுவாசிகளுக்கு விடுதலை ஊழியம்?\""], a: ["Whether you say \"in\" or \"on\", believers clearly can be oppressed, tormented and ensnared (Luke 13:16 calls a \"daughter of Abraham\" bound by Satan). The practical help is the same: truth, repentance, authority, healing.", "\"உள்ளே\" என்றாலும் \"மேலே\" என்றாலும், விசுவாசிகள் ஒடுக்கப்படலாம், வேதனைப்படலாம், கண்ணியில் சிக்கலாம் என்பது தெளிவு (லூக்கா 13:16 சாத்தானால் கட்டப்பட்ட \"ஆபிரகாமின் குமாரத்தியைப்\" பற்றிச் சொல்கிறது). நடைமுறை உதவி ஒன்றே: சத்தியம், மனந்திரும்புதல், அதிகாரம், சுகம்."], r: "Luke 13:16" },
        { q: ["\"If God is good, why does He let the devil touch His children?\"", "\"தேவன் நல்லவர் என்றால், ஏன் தம் பிள்ளைகளைப் பிசாசு தொட அனுமதிக்கிறார்?\""], a: ["We live in a world at war, where love has given real freedom and real authority to people. God's answer was not to stay distant but to enter the war, take the curse, and give His children authority to enforce His victory. He is with us in it, not against us.", "அன்பு மனிதர்களுக்கு உண்மையான சுதந்தரத்தையும் அதிகாரத்தையும் கொடுத்திருக்கும் யுத்தத்திலுள்ள உலகில் வாழ்கிறோம். தேவனுடைய பதில் தூரத்தில் நிற்பது அல்ல, யுத்தத்துக்குள் நுழைந்து, சாபத்தை ஏற்று, தம் வெற்றியை அமல்படுத்தத் தம் பிள்ளைகளுக்கு அதிகாரம் கொடுப்பது. அவர் நமக்கு எதிராக அல்ல, அதில் நம்மோடிருக்கிறார்."], r: "Heb 2:14–15" }
      ] },

    { id: "quiz", type: "quiz", title: ["Check your understanding", "உங்கள் புரிதலைச் சோதியுங்கள்"], short: ["Quiz", "வினாடி வினா"],
      items: [
        { q: ["What does Proverbs 26:2 say about a curse without cause?", "காரணமில்லாத சாபம் பற்றி நீதிமொழிகள் 26:2 என்ன சொல்கிறது?"], o: [["It always lands eventually", "இறுதியில் எப்போதும் தங்கும்"], ["It shall not alight", "அது தங்காது"], ["Only prophets can stop it", "தீர்க்கதரிசிகள் மட்டுமே தடுக்க முடியும்"]], a: 1, w: ["Deliverance therefore focuses on finding and removing the cause.", "எனவே விடுதலை காரணத்தைக் கண்டுபிடித்து நீக்குவதில் கவனம் செலுத்துகிறது."] },
        { q: ["Paul's word *topos* in Eph 4:27 means:", "எபேசியர் 4:27-ல் பவுலின் *டோபோஸ்* என்ற சொல்லின் பொருள்:"], o: [["A place or foothold", "இடம் அல்லது கால் ஊன்றும் இடம்"], ["A demon's name", "ஒரு பிசாசின் பெயர்"], ["A curse word", "ஒரு சாபச் சொல்"]], a: 0, w: ["We are told not to give the devil a place: ground can be given, and ground can be taken back.", "பிசாசுக்கு இடம் கொடுக்க வேண்டாம் என்று சொல்லப்படுகிறோம்: இடம் கொடுக்கப்படலாம், இடம் திரும்பப் பெறப்படலாம்."] },
        { q: ["Who described the \"flaw of the excluded middle\"?", "\"விலக்கப்பட்ட நடுப்பகுதியின் குறைபாட்டை\" விவரித்தவர் யார்?"], o: [["Derek Prince", "டெரெக் பிரின்ஸ்"], ["Paul Hiebert", "பால் ஹீபர்ட்"], ["C.S. Lewis", "சி.எஸ். லூயிஸ்"]], a: 1, w: ["Hiebert (1982), drawing on his years in India, explained why Western Christianity often had no answers for spirits, curses and healing.", "இந்தியாவில் தன் ஆண்டுகளை அடிப்படையாகக் கொண்டு ஹீபர்ட் (1982), ஆவிகள், சாபங்கள், சுகம் பற்றி மேற்கத்திய கிறிஸ்தவத்திடம் ஏன் அடிக்கடி பதில்கள் இல்லை என்று விளக்கினார்."] },
        { q: ["Why can Jesus say \"the ruler of this world... has nothing in Me\"?", "\"இந்த உலகத்தின் அதிபதிக்கு என்னிடத்தில் ஒன்றுமில்லை\" என்று இயேசு ஏன் சொல்ல முடிகிறது?"], o: [["He avoided the devil", "அவர் பிசாசைத் தவிர்த்தார்"], ["There was no sin, agreement or ground in Him for Satan to use", "சாத்தான் பயன்படுத்த அவரில் பாவமோ ஒப்பந்தமோ இடமோ இல்லை"], ["He was always fasting", "அவர் எப்போதும் உபவாசித்தார்"]], a: 1, w: ["John 14:30. Freedom grows as we close doors and live from union with Him.", "யோவான் 14:30. கதவுகளை மூடி அவரோடுள்ள ஐக்கியத்திலிருந்து வாழும்போது விடுதலை வளர்கிறது."] },
        { q: ["What is the Jesus-shaped response to someone who curses you?", "உங்களைச் சபிக்கும் ஒருவருக்கு இயேசுவின் வடிவிலான எதிர்வினை என்ன?"], o: [["Pray fire on them", "அவர்கள்மேல் அக்கினியை ஜெபியுங்கள்"], ["Buy protection charms", "பாதுகாப்புத் தாயத்துகளை வாங்குங்கள்"], ["Break the curse's power and bless them", "சாபத்தின் வல்லமையை முறித்து அவர்களை ஆசீர்வதியுங்கள்"]], a: 2, w: ["Luke 6:28; Rom 12:14. Overcome evil with good.", "லூக்கா 6:28; ரோமர் 12:14. நன்மையினாலே தீமையை வெல்லுங்கள்."] }
      ] }

    el.addEventListener("click", function (e) { var b = e.target.closest("[data-side]"); if (!b) return; b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); upd(); });
    upd();
  };

  RENDER.pyramid = function (s) {
    var n = s.levels.length;
    return '<div class="pyr"><div class="pyr-fig">' + s.levels.map(function (l, i) { return '<button type="button" data-l="' + i + '" style="width:' + (40 + i * (60 / Math.max(1, n - 1))) + '%">' + H(l.h) + "</button>"; }).join("") + '</div><div data-out></div></div>';
  };
  WIRE.pyramid = function (el, s) {
    function pick(i) { $$("[data-l]", el).forEach(function (b) { b.classList.toggle("on", +b.getAttribute("data-l") === i); }); var l = s.levels[i]; $("[data-out]", el).innerHTML = '<div class="panel hi detail"><h3>' + H(l.h) + "</h3>" + refEl(l.r) + paras(L(l.p)) + "</div>"; }
    el.addEventListener("click", function (e) { var b = e.target.closest("[data-l]"); if (b) pick(+b.getAttribute("data-l")); });
    pick(s.start || 0);
  };

  RENDER.wheel = function (s) {
    var n = s.words.length, cx = 190, cy = 190, ro = 180, ri = 70, svg = "";
    s.words.forEach(function (w, i) {
      var a1 = -Math.PI / 2 + i * 2 * Math.PI / n, a2 = a1 + 2 * Math.PI / n, am = (a1 + a2) / 2;
      var p = function (r, a) { return (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1); };
      var d = "M" + p(ri, a1) + " L" + p(ro, a1) + " A" + ro + " " + ro + " 0 0 1 " + p(ro, a2) + " L" + p(ri, a2) + " A" + ri + " " + ri + " 0 0 0 " + p(ri, a1) + "z";
      var tx = cx + (ri + ro) / 2 * Math.cos(am), ty = cy + (ri + ro) / 2 * Math.sin(am);
      svg += '<g class="wseg" tabindex="0" role="button" data-w="' + i + '"><path d="' + d + '"/><text x="' + tx + '" y="' + (ty + 4) + '" text-anchor="middle">' + esc(w.w) + "</text></g>";
    });
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (ri - 6) + '" fill="var(--acc-soft)" stroke="var(--acc)"/>' + wrapSvg(T(s.center), cx, cy, 12, 14).replace("<text ", '<text style="fill:var(--ink);font-family:var(--display);font-weight:700" ');
    return '<div class="wheel"><div class="wheel-fig"><svg viewBox="0 0 380 380">' + svg + '</svg></div><div data-out></div></div>';
  };
  WIRE.wheel = function (el, s) {
    function pick(i) { $$(".wseg", el).forEach(function (g) { g.classList.toggle("on", +g.getAttribute("data-w") === i); }); var w = s.words[i]; $("[data-out]", el).innerHTML = '<div class="panel hi detail"><span class="orig" lang="he">' + esc(w.o) + '</span><h3>' + esc(w.w) + " · " + H(w.m) + "</h3>" + refEl(w.r) + paras(L(w.p)) + "</div>"; }
    el.addEventListener("click", function (e) { var g = e.target.closest(".wseg"); if (g) pick(+g.getAttribute("data-w")); });
    el.addEventListener("keydown", function (e) { var g = e.target.closest(".wseg"); if (g && e.key === "Enter") pick(+g.getAttribute("data-w")); });
    pick(0);
  };

  RENDER.builder = function (s) {
    return '<div class="builder"><span class="label">' + H(s.ask) + '</span><div class="chips">' + s.items.map(function (it, i) { return '<button class="chip" type="button" data-b="' + i + '">' + H(it.need) + "</button>"; }).join("") + '</div><div data-out></div>' + (s.note ? '<p class="note">' + H(s.note) + "</p>" : "") + "</div>";
  };
  WIRE.builder = function (el, s) {
    function pick(i) {
      $$("[data-b]", el).forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-b") === i)); });
      var it = s.items[i];
      $("[data-out]", el).innerHTML = '<div class="verse">' + refEl(it.r) + H(it.promise) + '</div><div class="decl">' + H(it.decl) + "</div>" + (it.why ? '<p class="muted">' + H(it.why) + "</p>" : "");
    }
    el.addEventListener("click", function (e) { var b = e.target.closest("[data-b]"); if (b) pick(+b.getAttribute("data-b")); });
    pick(0);
  };

  RENDER.vs = function (s) {
    function col(d, hi) { return '<div class="panel' + (hi ? " hi" : "") + '"><span class="label">' + H(d.h) + "</span><ul>" + d.items.map(function (x) { return "<li>" + H(x) + "</li>"; }).join("") + "</ul></div>"; }
    return '<div class="vs">' + col(s.left) + col(s.right, true) + "</div>" + (s.foot ? '<p class="muted">' + H(s.foot) + "</p>" : "");
  };

  RENDER.quiz = function (s) {
    return '<div class="quiz">' + s.items.map(function (q, i) {
      return '<div class="qcard" data-q="' + i + '"><b>' + (i + 1) + ". " + H(q.q) + '</b><div class="opts">' + q.o.map(function (o, j) { return '<button class="opt" type="button" data-o="' + j + '">' + H(o) + "</button>"; }).join("") + '</div><p class="why" hidden></p></div>';
    }).join("") + '<p class="label" data-score></p></div>';
  };
  WIRE.quiz = function (el, s) {
    var right = 0, answered = 0;
    el.addEventListener("click", function (e) {
      var b = e.target.closest(".opt"); if (!b) return;
      var card = b.closest(".qcard"); if (card._done) return; card._done = true;
      var q = s.items[+card.getAttribute("data-q")], j = +b.getAttribute("data-o");
      answered++; if (j === q.a) right++;
      $$(".opt", card).forEach(function (o, k) { if (k === q.a) o.classList.add("ok"); else if (k === j) o.classList.add("no"); });
      var w = $(".why", card); w.innerHTML = H(q.w); w.hidden = false;
      $("[data-score]", el).textContent = U("score") + ": " + right + " / " + answered;
    });
  };

  /* ---------- views ---------- */
  var main = $("#main"), layer = $("#layer");

  function sectionHTML(st, s, i) {
    var key = st.id + "." + s.id;
    var body = (RENDER[s.type] || RENDER.prose)(s);
    return '<section class="sec" id="' + st.id + "-" + s.id + '" data-sec="' + i + '"><div class="sec-h"><div style="display:grid;gap:6px"><span class="kind">' + esc(T(PP.ui["k_" + s.type] || KIND[s.type] || "")) + "</span><h2>" + H(s.title) + '</h2></div><button class="done-btn" type="button" data-done="' + key + '" aria-pressed="' + !!done[key] + '">' + (done[key] ? "✓ " + U("studied") : U("markStudied")) + "</button></div>" + (s.lead ? '<p class="lead">' + H(s.lead) + "</p>" : "") + body + "</section>";
  }

  function progress(st) { var n = st.sections.length, d = 0; st.sections.forEach(function (s) { if (done[st.id + "." + s.id]) d++; }); return n ? d / n : 0; }

  function renderStudy(st, anchor) {
    document.body.className = "acc-" + st.accent;
    main.innerHTML = '<div class="plate"><header class="shead"><div><span class="label">' + U("study") + " " + st.n + " · " + st.sections.length + " " + U("sections") + "</span><h1>" + H(st.title) + '</h1><p class="tag">' + H(st.tagline) + '</p></div><div class="sglyph" aria-hidden="true">' + glyph(st.accent) + '</div></header><div class="verse-band">' + H(st.verse.t) + refEl(st.verse.r) + '</div><nav class="toc" aria-label="' + esc(U("inStudy")) + '">' + st.sections.map(function (s) { return '<a href="#' + st.id + "-" + s.id + '">' + H(s.short || s.title) + "</a>"; }).join("") + "</nav>" +
      st.sections.map(function (s, i) { return sectionHTML(st, s, i); }).join("") + nextLink(st) + "</div>" + footer();
    st.sections.forEach(function (s, i) { var el = $('[data-sec="' + i + '"]', main); if (WIRE[s.type]) WIRE[s.type](el, s); });
    if (anchor) { var a = document.getElementById(anchor); if (a) setTimeout(function () { a.scrollIntoView(); }, 30); } else window.scrollTo(0, 0);
    spy(st);
  }
  function nextLink(st) {
    var i = PP.studies.indexOf(st), nx = PP.studies[(i + 1) % PP.studies.length];
    return '<a class="scard acc-' + nx.accent + '" href="#' + nx.id + '"><span class="n">' + U("nextStudy") + "</span><h3>" + H(nx.title) + "</h3><p>" + H(nx.tagline) + "</p></a>";
  }
  function footer() { return '<footer class="footer"><p>' + H(PP.ui.foot1) + "</p><p>" + H(PP.ui.foot2) + "</p></footer>"; }

  function spy(st) {
    if (window._pp_obs) window._pp_obs.disconnect();
    if (!("IntersectionObserver" in window)) return;
    window._pp_obs = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) {
        if (!en.isIntersecting) return;
        var id = en.target.id;
        $$(".toc a").forEach(function (a) { var on = a.getAttribute("href") === "#" + id; a.classList.toggle("on", on); if (on && a.scrollIntoView && a.parentNode.scrollWidth > a.parentNode.clientWidth) a.parentNode.scrollLeft = a.offsetLeft - 40; });
        $$(".rail .sub").forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + id); });
      });
    }, { rootMargin: "-30% 0px -60% 0px" });
    $$(".sec", main).forEach(function (s) { window._pp_obs.observe(s); });
  }

  function glyph(acc) {
    var g = {
      flame: '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)"/><circle cx="100" cy="100" r="64" fill="none" stroke="var(--acc)" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite"/></circle><path d="M100 40c14 22 30 34 30 60a30 30 0 0 1-60 0c0-14 9-24 15-34 4 9 6 14 14 19 0-18-4-30 1-45z" fill="var(--acc)"/><path d="M100 150v30M70 160l-12 18M130 160l12 18" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/></svg>',
      sky: '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)"/><path d="M30 120c20-40 120-40 140 0" fill="none" stroke="var(--acc)" stroke-width="2"/><circle cx="100" cy="98" r="22" fill="none" stroke="var(--acc)" stroke-width="3"/><circle cx="100" cy="98" r="9" fill="var(--acc)"><animate attributeName="r" values="7;11;7" dur="4s" repeatCount="indefinite"/></circle><path d="M100 40v18M60 52l9 14M140 52l-9 14M100 140v40" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/><path d="M78 160h44" stroke="var(--acc)" stroke-width="3"/></svg>',
      tide: '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)"/><g fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"><path d="M30 120q17-30 35 0t35 0 35 0 35 0"><animate attributeName="d" dur="5s" repeatCount="indefinite" values="M30 120q17-30 35 0t35 0 35 0 35 0;M30 120q17 30 35 0t35 0 35 0 35 0;M30 120q17-30 35 0t35 0 35 0 35 0"/></path><path d="M120 50v60M120 50l26 -8v18" /></g><circle cx="110" cy="112" r="11" fill="var(--acc)"/><path d="M70 150c10 14 50 14 60 0" stroke="var(--acc)" stroke-width="2" fill="none" opacity=".5"/></svg>',
      rose: '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)"/><g stroke="var(--muted)" stroke-width="5" fill="none"><ellipse cx="62" cy="100" rx="20" ry="13"/><ellipse cx="138" cy="100" rx="20" ry="13"/></g><g stroke="var(--acc)" stroke-width="5" fill="none" stroke-linecap="round"><path d="M80 96l10-6"><animate attributeName="d" dur="3s" repeatCount="indefinite" values="M80 96l10-6;M80 92l12-16;M80 96l10-6"/></path><path d="M120 104l-10 6"><animate attributeName="d" dur="3s" repeatCount="indefinite" values="M120 104l-10 6;M120 108l-12 16;M120 104l-10 6"/></path></g><path d="M100 30v30M88 42h24" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"/><path d="M60 150q40 22 80 0" stroke="var(--acc)" stroke-width="2" fill="none"/></svg>'
    };
    return g[acc] || g.flame;
  }

  function renderHome() {
    document.body.className = "acc-gold";
    var n = PP.studies.length, orbs = "";
    PP.studies.forEach(function (st, i) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n + Math.PI / 4, x = 250 + 158 * Math.cos(a), y = 250 + 158 * Math.sin(a);
      orbs += '<a href="#' + st.id + '" class="acc-' + st.accent + '"><g class="orb"><circle cx="' + x + '" cy="' + y + '" r="66" fill="var(--surface)" stroke="var(--acc)" stroke-width="2"/><circle cx="' + x + '" cy="' + y + '" r="66" fill="var(--acc)" opacity=".12"/>' + wrapSvg(T(st.short), x, y - 4, 12, 15) + '<text class="sm" x="' + x + '" y="' + (y + 34) + '" text-anchor="middle">' + esc(U("study").toUpperCase()) + " " + st.n + "</text></g></a>";
    });
    var svg = '<svg viewBox="0 0 500 500" role="img" aria-label="' + esc(U("mapLabel")) + '"><g class="spin"><circle cx="250" cy="250" r="158" fill="none" stroke="var(--line)" stroke-dasharray="2 8"/><circle cx="250" cy="250" r="232" fill="none" stroke="var(--line)" stroke-dasharray="1 12"/></g><circle cx="250" cy="250" r="70" fill="var(--gold)" opacity=".12"/><circle cx="250" cy="250" r="54" fill="none" stroke="var(--gold)"/>' + wrapSvg(T(PP.ui.hubCenter), 250, 250, 12, 15).replace("<text ", '<text style="fill:var(--gold)" ') + orbs + "</svg>";
    main.innerHTML = '<div class="plate"><section class="hero"><div><span class="label">' + U("eyebrow") + "</span><h1>" + T(PP.ui.heroTitle) + '</h1><p class="lede">' + H(PP.ui.heroLede) + '</p></div><div class="atlas">' + svg + '</div></section><div class="verse-band" style="--acc:var(--gold)">' + H(PP.ui.heroVerse.t) + refEl(PP.ui.heroVerse.r) + '</div><section class="sec"><div class="sec-h"><h2>' + U("fourStudies") + '</h2></div><div class="study-cards">' + PP.studies.map(function (st) {
      var p = progress(st);
      return '<a class="scard acc-' + st.accent + '" href="#' + st.id + '"><span class="n">' + U("study") + " " + st.n + " · " + st.sections.length + " " + U("sections") + "</span><h3>" + H(st.title) + "</h3><p>" + H(st.tagline) + '</p><div class="bar" title="' + Math.round(p * 100) + '%"><i style="width:' + (p * 100) + '%"></i></div></a>';
    }).join("") + "</div></section>" + PP.home.map(function (s, i) { return '<section class="sec acc-gold" data-sec="h' + i + '"><div class="sec-h"><div style="display:grid;gap:6px"><span class="kind">' + esc(T(PP.ui["k_" + s.type] || KIND[s.type] || "")) + "</span><h2>" + H(s.title) + "</h2></div></div>" + (s.lead ? '<p class="lead">' + H(s.lead) + "</p>" : "") + RENDER[s.type](s) + "</section>"; }).join("") + "</div>" + footer();
    PP.home.forEach(function (s, i) { if (WIRE[s.type]) WIRE[s.type]($('[data-sec="h' + i + '"]', main), s); });
    window.scrollTo(0, 0);
  }

  function renderNav(cur) {
    var rail = '<a href="#home" class="acc-gold"' + (cur === "home" ? ' aria-current="page"' : "") + '><span class="dot"></span>' + U("home") + '</a><span class="label">' + U("fourStudies") + "</span>";
    PP.studies.forEach(function (st) {
      rail += '<a href="#' + st.id + '" class="acc-' + st.accent + '"' + (cur === st.id ? ' aria-current="page"' : "") + '><span class="dot"></span>' + H(st.short) + "</a>";
      if (cur === st.id) st.sections.forEach(function (s) { rail += '<a class="sub acc-' + st.accent + '" href="#' + st.id + "-" + s.id + '">' + H(s.short || s.title) + "</a>"; });
    });
    $("#rail").innerHTML = rail;
    $("#tabbar").innerHTML = '<a href="#home" class="acc-gold"' + (cur === "home" ? ' aria-current="page"' : "") + "><i></i>" + U("home") + "</a>" + PP.studies.map(function (st) { return '<a href="#' + st.id + '" class="acc-' + st.accent + '"' + (cur === st.id ? ' aria-current="page"' : "") + "><i></i>" + H(st.tab || st.short) + "</a>"; }).join("");
  }

  var current = null;
  function route(force) {
    var h = (location.hash || "#home").slice(1), parts = h.split("-"), st = study(parts[0]);
    var view = st ? st.id : "home";
    renderNav(view);
    if (view !== current || force) { current = view; if (st) renderStudy(st, parts.length > 1 ? h : null); else renderHome(); }
    else if (st && parts.length > 1) { var a = document.getElementById(h); if (a) a.scrollIntoView(); }
    document.title = T(PP.ui.brand);
  }

  /* ---------- sheet & search ---------- */
  function openSheet(html) {
    layer.innerHTML = '<div class="scrim" data-close></div><aside class="sheet ' + document.body.className + '" role="dialog" aria-modal="true"><button class="icon-btn x" type="button" data-close>' + U("close") + " ✕</button>" + html + "</aside>";
    var b = $(".sheet .x"); if (b) b.focus();
  }
  function closeLayer() { layer.innerHTML = ""; }
  layer.addEventListener("click", function (e) { if (e.target.closest("[data-close]")) closeLayer(); if (e.target.closest(".results a")) closeLayer(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLayer();
    if ((e.key === "/" || (e.key === "k" && (e.metaKey || e.ctrlKey))) && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
  });

  function strings(o, out) {
    if (Array.isArray(o) && o.length === 2 && typeof o[0] === "string" && typeof o[1] === "string") { out.push(T(o)); return out; }
    if (typeof o === "string") { out.push(o); return out; }
    if (o && typeof o === "object") for (var k in o) if (k !== "id" && k !== "type" && k !== "accent") strings(o[k], out);
    return out;
  }
  var index = null, indexLang = null;
  function buildIndex() {
    index = [];
    PP.studies.forEach(function (st) { st.sections.forEach(function (s) { index.push({ st: st, s: s, text: strings(s, []).join(" • ").replace(/\*/g, "") }); }); });
    indexLang = lang;
  }
  function openSearch() {
    if (!index || indexLang !== lang) buildIndex();
    layer.innerHTML = '<div class="scrim" data-close></div><div class="search-box" role="dialog" aria-modal="true"><input id="pp-q" type="search" placeholder="' + esc(U("searchPh")) + '" aria-label="' + esc(U("search")) + '"><div class="results" id="pp-res"></div></div>';
    var q = $("#pp-q"); q.focus();
    q.addEventListener("input", function () {
      var v = q.value.trim().toLowerCase(), res = $("#pp-res");
      if (v.length < 2) { res.innerHTML = ""; return; }
      var hits = index.filter(function (x) { return x.text.toLowerCase().indexOf(v) > -1; }).slice(0, 30);
      res.innerHTML = hits.length ? hits.map(function (x) {
        var t = x.text, i = t.toLowerCase().indexOf(v), snip = t.slice(Math.max(0, i - 60), i + 90);
        return '<a href="#' + x.st.id + "-" + x.s.id + '"><b>' + H(x.s.title) + "</b><small>" + H(x.st.short) + " · …" + esc(snip) + "…</small></a>";
      }).join("") : '<p class="empty">' + U("noResults") + "</p>";
    });
  }
  $("#search-btn").addEventListener("click", openSearch);

  function openTheme() {
    layer.innerHTML = '<div class="scrim" data-close style="background:transparent"></div><div class="theme-pop" role="dialog" aria-label="' + esc(U("colourScheme")) + '"><h3>' + U("colourScheme") + '</h3><div class="swatches">' + SCHEMES.map(function (sc) {
      return '<button class="sw" type="button" data-scheme="' + sc[0] + '" aria-pressed="' + (theme.scheme === sc[0]) + '"><span class="chipset">' + sc[1].map(function (c) { return '<i style="background:' + c + '"></i>'; }).join("") + "</span>" + U("sc_" + sc[0]) + "</button>";
    }).join("") + '</div><span class="label">' + U("mode") + '</span><div class="modes">' + ["auto", "light", "dark"].map(function (m) { return '<button type="button" data-mode="' + m + '" aria-pressed="' + (theme.mode === m) + '">' + U("m_" + m) + "</button>"; }).join("") + '</div><p class="note">' + U("schemeNote") + "</p></div>";
    var first = $(".theme-pop .sw[aria-pressed=\"true\"]") || $(".theme-pop .sw"); if (first) first.focus();
  }
  layer.addEventListener("click", function (e) {
    var sw = e.target.closest("[data-scheme]"), md = e.target.closest("[data-mode]");
    if (!sw && !md) return;
    if (sw) theme.scheme = sw.getAttribute("data-scheme");
    if (md) theme.mode = md.getAttribute("data-mode");
    store("pp.theme", theme); applyTheme();
    $$(".theme-pop [data-scheme]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-scheme") === theme.scheme)); });
    $$(".theme-pop [data-mode]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === theme.mode)); });
  });
  $("#theme-btn").addEventListener("click", function () { if ($(".theme-pop")) closeLayer(); else openTheme(); });

  /* ---------- language ---------- */
  function setLangUI() {
    document.documentElement.setAttribute("lang", lang);
    $$(".lang-switch button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
    $$("[data-ui]").forEach(function (el) { el.textContent = U(el.getAttribute("data-ui")); });
    $("#search-btn").setAttribute("aria-label", U("search"));
    $("#theme-btn").setAttribute("aria-label", U("colourScheme"));
  }
  $(".lang-switch").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]"); if (!b || b.getAttribute("data-lang") === lang) return;
    var y = window.scrollY, sec = null;
    $$(".sec[id]", main).some(function (s) { if (s.getBoundingClientRect().bottom > 140) { sec = s.id; return true; } return false; });
    lang = b.getAttribute("data-lang"); store("pp.lang", lang); setLangUI();
    route(true);
    if (sec && document.getElementById(sec)) document.getElementById(sec).scrollIntoView(); else window.scrollTo(0, y);
  });

  main.addEventListener("click", function (e) {
    var b = e.target.closest("[data-done]"); if (!b) return;
    var k = b.getAttribute("data-done"); done[k] = !done[k]; if (!done[k]) delete done[k]; store("pp.done", done);
    b.setAttribute("aria-pressed", String(!!done[k])); b.textContent = done[k] ? "✓ " + U("studied") : U("markStudied");
  });

  window.addEventListener("hashchange", function () { route(false); });
  setLangUI();
  route(true);
})();

</script>

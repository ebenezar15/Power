PP.studies.push({
  id: "worship", n: 3, accent: "tide",
  title: ["Music & Worship in Scripture and Practice", "வேதத்திலும் நடைமுறையிலும் இசையும் ஆராதனையும்"],
  short: ["Music & Worship", "இசையும் ஆராதனையும்"], tab: ["Worship", "ஆராதனை"],
  tagline: ["Worship is the response of children to a Father who loved them first. Music is one of its oldest and strongest languages.", "ஆராதனை, முதலில் அன்புகூர்ந்த பிதாவுக்குப் பிள்ளைகள் தரும் மறுமொழி. இசை அதன் மிகப் பழமையான, வலிமையான மொழிகளில் ஒன்று."],
  verse: { t: ["The true worshipers will worship the Father in spirit and truth; for the Father is seeking such to worship Him.", "உண்மையாய்த் தொழுதுகொள்ளுகிறவர்கள் பிதாவை ஆவியோடும் உண்மையோடும் தொழுதுகொள்ளுங்காலம் வரும்; தம்மைத் தொழுதுகொள்ளுகிறவர்கள் இப்படிப்பட்டவர்களாயிருக்கும்படி பிதாவானவர் விரும்புகிறார்."], r: "John 4:23" },
  sections: [
    { id: "words", type: "wheel", title: ["Seven Hebrew words for praise, and the Greek for worship", "துதிக்கான ஏழு எபிரெயச் சொற்கள், ஆராதனைக்கான கிரேக்கச் சொல்"], short: ["Word wheel", "சொல் சக்கரம்"],
      lead: ["Hebrew does not have one word for praise. Each word is a different posture of the body and heart. Tap the wheel.", "எபிரெயத்தில் துதிக்கு ஒரே சொல் இல்லை. ஒவ்வொரு சொல்லும் உடலின், இருதயத்தின் வேறுபட்ட நிலை. சக்கரத்தைத் தொடுங்கள்."],
      center: ["Words of praise", "துதியின் சொற்கள்"],
      words: [
        { w: "Yadah", o: "יָדָה", m: ["to extend the hands", "கைகளை உயர்த்துதல்"], r: "Ps 63:4; 2 Chr 20:21", p: ["Thanksgiving with lifted hands, like a child reaching for a parent. Jehoshaphat's singers went out saying \"Yadah the LORD\" before the battle.", "குழந்தை பெற்றோரை நோக்கிக் கை நீட்டுவது போல, உயர்த்திய கைகளோடு நன்றி. யோசபாத்தின் பாடகர்கள் யுத்தத்துக்கு முன் \"கர்த்தரைத் துதியுங்கள்\" என்று சொல்லிப் புறப்பட்டார்கள்."] },
        { w: "Halal", o: "הָלַל", m: ["to boast, rave, celebrate", "மேன்மைபாராட்டுதல், கொண்டாடுதல்"], r: "Ps 150:1", p: ["The root of \"Hallelujah\". Loud, unashamed celebration, even to the point of looking foolish (2 Sam 6:22).", "\"அல்லேலூயா\" என்பதன் வேர். சத்தமான, வெட்கமற்ற கொண்டாட்டம், மூடத்தனமாகத் தோன்றும் அளவுக்கும் (2 சாமுவேல் 6:22)."] },
        { w: "Towdah", o: "תּוֹדָה", m: ["sacrifice of thanks", "நன்றிப் பலி"], r: "Ps 50:23; Heb 13:15", p: ["Thanks offered before the answer arrives: faith that praises in advance. Hebrews calls it \"the fruit of our lips\".", "பதில் வருவதற்கு முன் செலுத்தப்படும் நன்றி: முன்கூட்டியே துதிக்கும் விசுவாசம். எபிரெயர் இதை \"உதடுகளின் கனி\" என்கிறது."] },
        { w: "Shabach", o: "שָׁבַח", m: ["to shout, address loudly", "ஆர்ப்பரித்தல்"], r: "Ps 63:3; Ps 117:1", p: ["A loud testimony of praise about what God has done.", "தேவன் செய்ததைப் பற்றிய சத்தமான துதிச் சாட்சி."] },
        { w: "Barak", o: "בָּרַךְ", m: ["to kneel, bless", "முழங்காற்படியிட்டு ஸ்தோத்தரித்தல்"], r: "Ps 95:6; Ps 103:1", p: ["Quiet adoration on bended knee. \"Bless the LORD, O my soul.\"", "முழங்காலில் அமைதியான ஆராதனை. \"என் ஆத்துமாவே, கர்த்தரை ஸ்தோத்திரி.\""] },
        { w: "Zamar", o: "זָמַר", m: ["to make music with instruments", "இசைக்கருவிகளோடு கீர்த்தனம் பண்ணுதல்"], r: "Ps 33:2; Ps 144:9", p: ["Praise with strings and instruments, the root of the word \"psalm\" (*mizmor*).", "நரம்புக் கருவிகளோடும் இசைக்கருவிகளோடும் துதி; \"சங்கீதம்\" (*மிஸ்மோர்*) என்ற சொல்லின் வேர்."] },
        { w: "Tehillah", o: "תְּהִלָּה", m: ["a spontaneous song", "தன்னிச்சையான பாடல்"], r: "Ps 22:3", p: ["\"You are holy, enthroned in the praises (*tehillot*) of Israel.\" Often understood as a new, Spirit-inspired song.", "\"இஸ்ரவேலின் துதிகளின் (*தெஹில்லோத்*) மத்தியில் வாசம்பண்ணுகிற நீர் பரிசுத்தர்.\" புதிய, ஆவியால் ஏவப்பட்ட பாடலாக அடிக்கடி புரிந்துகொள்ளப்படுகிறது."] },
        { w: "Proskuneō", o: "προσκυνέω", m: ["to bow, kiss toward", "பணிந்து வணங்குதல்"], r: "John 4:23–24; Rev 4:10", p: ["The main New Testament word for worship: to come near and bow, an intimate act of honour. In Hebrew the equivalent is *shachah*, to bow down.", "புதிய ஏற்பாட்டில் ஆராதனைக்கான முக்கியச் சொல்: அருகில் வந்து பணிதல், கனத்தின் நெருக்கமான செயல். எபிரெயத்தில் இதற்கு இணையானது *ஷாகா*, பணிந்து வணங்குதல்."] }
      ] },

    { id: "story", type: "timeline", title: ["Music and worship through the Bible", "வேதாகமம் முழுவதும் இசையும் ஆராதனையும்"], short: ["Bible story", "வேதக் கதை"],
      lead: ["From the first musician to the final song. Tap any card for detail.", "முதல் இசைக்கலைஞர் முதல் கடைசிப் பாடல் வரை. விவரத்துக்கு எந்த அட்டையையும் தொடுங்கள்."],
      eras: [
        { era: ["Beginnings", "தொடக்கம்"], items: [
          { y: "Gen 4:21", h: ["Jubal", "யூபால்"], p: ["\"Father of all who play the harp and flute.\" Music is part of human creativity from the start.", "\"சுரமண்டலக்காரர், நாதசுரக்காரர் எல்லாருக்கும் தகப்பன்.\" இசை தொடக்கத்திலிருந்தே மனித படைப்பாற்றலின் பகுதி."] },
          { y: "Exod 15", h: ["Song of Moses & Miriam", "மோசே & மிரியாமின் பாடல்"], p: ["The first great worship song celebrates deliverance; Miriam leads women with tambourines and dance.", "முதல் பெரிய ஆராதனைப் பாடல் விடுதலையைக் கொண்டாடுகிறது; மிரியாம் தம்புரோடும் நடனத்தோடும் பெண்களை நடத்துகிறாள்."] },
          { y: "1 Sam 16:23", h: ["David plays for Saul", "தாவீது சவுலுக்காக வாசிக்கிறான்"], p: ["When David played, \"the distressing spirit would depart.\" Worship and deliverance meet.", "தாவீது வாசித்தபோது \"பொல்லாத ஆவி அவனை விட்டு நீங்கும்.\" ஆராதனையும் விடுதலையும் சந்திக்கின்றன."] }
        ] },
        { era: ["David's tabernacle & the Temple", "தாவீதின் கூடாரம் & ஆலயம்"], items: [
          { y: "1 Chr 15–16", h: ["The Ark comes home", "பெட்டி வீட்டுக்கு வருகிறது"], p: ["David appoints Levites to minister \"before the ark continually\" with singing and instruments, a tent with no veil.", "பாட்டோடும் இசைக்கருவிகளோடும் \"பெட்டிக்கு முன்பாக நித்தமும்\" ஊழியம் செய்ய லேவியரைத் தாவீது நியமிக்கிறான், திரையில்லாத கூடாரம்."] },
          { y: "1 Chr 23:5; 25:7", h: ["4,000 musicians, 288 skilled", "4,000 இசைக்கலைஞர்கள், 288 தேர்ந்தவர்கள்"], p: ["Worship is organised, trained and resourced. Some \"prophesied with harps\" (25:1).", "ஆராதனை ஒழுங்கமைக்கப்பட்டது, பயிற்றுவிக்கப்பட்டது, வளம் அளிக்கப்பட்டது. சிலர் \"சுரமண்டலங்களோடு தீர்க்கதரிசனஞ் சொன்னார்கள்\" (25:1)."] },
          { y: "2 Chr 5:13–14", h: ["Glory fills the Temple", "மகிமை ஆலயத்தை நிரப்புகிறது"], p: ["When the trumpeters and singers were \"as one\" praising \"He is good, His mercy endures forever\", the cloud filled the house.", "எக்காளம் ஊதுகிறவர்களும் பாடகர்களும் \"ஏகோபித்து\" \"அவர் நல்லவர், அவர் கிருபை என்றுமுள்ளது\" என்று துதித்தபோது மேகம் ஆலயத்தை நிரப்பியது."] },
          { y: "2 Chr 20", h: ["Jehoshaphat's battle", "யோசபாத்தின் யுத்தம்"], p: ["Singers go before the army; as they began to praise, the LORD set ambushes. Praise as spiritual warfare.", "பாடகர்கள் சேனைக்கு முன் செல்கிறார்கள்; அவர்கள் துதிக்கத் தொடங்கியபோது கர்த்தர் பதிவிருப்போரை வைத்தார். ஆவிக்குரிய யுத்தமாகத் துதி."] },
          { y: "2 Kgs 3:15", h: ["Elisha's musician", "எலிசாவின் சுரமண்டலக்காரன்"], p: ["\"Bring me a musician.\" As he played, the hand of the LORD came on Elisha to prophesy.", "\"ஒரு சுரமண்டலக்காரனைக் கொண்டுவாருங்கள்.\" அவன் வாசித்தபோது கர்த்தருடைய கரம் எலிசாவின்மேல் வந்து தீர்க்கதரிசனம் சொன்னான்."] }
        ] },
        { era: ["Jesus & the early church", "இயேசுவும் ஆதித் திருச்சபையும்"], items: [
          { y: "Matt 26:30", h: ["Jesus sings a hymn", "இயேசு பாட்டுப் பாடுகிறார்"], p: ["On the night He was betrayed, Jesus sang the Hallel psalms (113–118) with His disciples.", "காட்டிக்கொடுக்கப்பட்ட இரவில் இயேசு சீஷர்களோடு ஹல்லேல் சங்கீதங்களைப் (113–118) பாடினார்."] },
          { y: "Acts 16:25", h: ["Paul & Silas at midnight", "நள்ளிரவில் பவுலும் சீலாவும்"], p: ["Singing in chains; an earthquake opens every door. Worship that is not dependent on circumstances.", "சங்கிலிகளில் பாடுகிறார்கள்; பூமியதிர்ச்சி எல்லாக் கதவுகளையும் திறக்கிறது. சூழ்நிலையைச் சாராத ஆராதனை."] },
          { y: "Eph 5:19; Col 3:16", h: ["Psalms, hymns, spiritual songs", "சங்கீதங்கள், கீர்த்தனைகள், ஞானப்பாட்டுகள்"], p: ["Singing teaches and admonishes one another; the word of Christ dwells richly through song.", "பாடுதல் ஒருவருக்கொருவர் போதித்துப் புத்திசொல்லுகிறது; பாடல் மூலம் கிறிஸ்துவின் வசனம் பரிபூரணமாக வாசமாகிறது."] },
          { y: "Rev 4–5", h: ["The final throne room", "இறுதிச் சிங்காசன அறை"], p: ["Every creature sings to the Lamb. History ends in worship.", "ஒவ்வொரு சிருஷ்டியும் ஆட்டுக்குட்டியானவருக்குப் பாடுகிறது. வரலாறு ஆராதனையில் முடிகிறது."] }
        ] }
      ] },

    { id: "church", type: "timeline", title: ["Worship through church history, including Tamil worship", "திருச்சபை வரலாற்றில் ஆராதனை, தமிழ் ஆராதனை உட்பட"], short: ["Church history", "சபை வரலாறு"],
      eras: [
        { era: ["Early & medieval", "ஆதி & இடைக்காலம்"], items: [
          { y: "c. 112", h: ["Pliny's letter", "பிளினியின் கடிதம்"], p: ["A Roman governor reports Christians meet before dawn and \"sing a hymn to Christ as to a god.\"", "கிறிஸ்தவர்கள் விடியற்காலைக்கு முன் கூடி \"கிறிஸ்துவுக்கு ஒரு கடவுளுக்குப் போல் பாடுகிறார்கள்\" என்று ஒரு ரோம ஆளுநர் தெரிவிக்கிறார்."] },
          { y: "c. 386", h: ["Ambrose's hymns", "ஆம்புரோஸின் கீர்த்தனைகள்"], p: ["Congregational hymn-singing spreads in Milan; Augustine weeps hearing it.", "மிலானில் சபை கீர்த்தனைப் பாடல் பரவுகிறது; அதைக் கேட்டு அகஸ்டின் அழுகிறார்."] },
          { y: "600–1200", h: ["Chant", "சந்தப் பாடல்"], p: ["Gregorian chant sings the Psalms daily in monasteries, keeping Scripture in the mouth.", "மடங்களில் கிரிகோரியன் சந்தம் தினமும் சங்கீதங்களைப் பாடுகிறது, வேதத்தை வாயில் வைத்திருக்கிறது."] }
        ] },
        { era: ["Reformation & revival", "சீர்திருத்தம் & எழுப்புதல்"], items: [
          { y: "1520s", h: ["Luther", "லூத்தர்"], p: ["\"Next to the Word of God, music deserves the highest praise.\" Hymns in the people's language.", "\"தேவ வார்த்தைக்கு அடுத்து இசையே உயர்ந்த புகழுக்குத் தகுதியானது.\" மக்களின் மொழியில் கீர்த்தனைகள்."] },
          { y: "1700s", h: ["Watts & Wesley", "வாட்ஸ் & வெஸ்லி"], p: ["Isaac Watts frees English hymn-writing; Charles Wesley writes over 6,000 hymns that teach theology by heart.", "ஐசக் வாட்ஸ் ஆங்கிலக் கீர்த்தனை எழுதுதலை விடுவிக்கிறார்; சார்லஸ் வெஸ்லி 6,000-க்கும் மேற்பட்ட கீர்த்தனைகளை எழுதுகிறார், இறையியலை மனப்பாடமாகக் கற்பிக்கின்றன."] },
          { y: "1800s", h: ["Spirituals & gospel", "ஆவிக்குரிய பாடல்கள் & சுவிசேஷப் பாடல்கள்"], p: ["Enslaved African Americans sing of exodus and freedom; Fanny Crosby writes thousands of gospel songs.", "அடிமைப்படுத்தப்பட்ட ஆப்பிரிக்க அமெரிக்கர்கள் யாத்திரையையும் விடுதலையையும் பாடுகிறார்கள்; ஃபேனி கிராஸ்பி ஆயிரக்கணக்கான சுவிசேஷப் பாடல்களை எழுதுகிறார்."] }
        ] },
        { era: ["Tamil worship", "தமிழ் ஆராதனை"], items: [
          { y: "1774–1864", h: ["Vedanayagam Sastriar", "வேதநாயகம் சாஸ்திரியார்"], p: ["The Tanjore poet writes hundreds of *keerthanaigal* in Carnatic ragas, giving Tamil Christians worship in their own musical language.", "தஞ்சாவூர்க் கவிஞர் கர்நாடக ராகங்களில் நூற்றுக்கணக்கான கீர்த்தனைகளை எழுதுகிறார்; தமிழ்க் கிறிஸ்தவர்களுக்குத் தங்கள் சொந்த இசை மொழியில் ஆராதனையைத் தருகிறார்."] },
          { y: "1894", h: ["H.A. Krishna Pillai", "எச்.ஏ. கிருஷ்ணபிள்ளை"], p: ["*Rakshanya Yathrigam*, a Tamil epic of the Christian journey, and lyrics still sung today.", "*இரட்சணிய யாத்திரிகம்*, கிறிஸ்தவப் பயணத்தின் தமிழ்க் காப்பியம்; இன்றும் பாடப்படும் பாடல்கள்."] },
          { y: "1900s–today", h: ["Bhajans to praise teams", "பஜனைகள் முதல் துதிக் குழுக்கள் வரை"], p: ["Village bhajans, gospel lyrics, Pentecostal choruses and modern Tamil worship bands carry the faith across generations.", "கிராமப் பஜனைகள், சுவிசேஷப் பாடல்கள், பெந்தெகொஸ்தே கோரஸ்கள், நவீன தமிழ் ஆராதனைக் குழுக்கள் தலைமுறைகளுக்கு விசுவாசத்தைக் கடத்துகின்றன."] }
        ] },
        { era: ["Modern era", "நவீன காலம்"], items: [
          { y: "1906", h: ["Azusa", "அசூசா"], p: ["Spontaneous singing in tongues and the \"heavenly choir\" become marks of Pentecostal worship.", "அந்நிய பாஷைகளில் தன்னிச்சையான பாடலும் \"பரலோகப் பாடகர் குழுவும்\" பெந்தெகொஸ்தே ஆராதனையின் அடையாளங்களாகின்றன."] },
          { y: "1970s–", h: ["Jesus Movement to modern worship", "இயேசு இயக்கம் முதல் நவீன ஆராதனை வரை"], p: ["Simple songs to God (not just about Him), Vineyard intimacy, then global worship movements and 24/7 prayer houses modelled on David's tabernacle.", "தேவனைப் பற்றி மட்டுமல்ல, தேவனுக்குப் பாடும் எளிய பாடல்கள், வைன்யார்ட் நெருக்கம், பிறகு உலகளாவிய ஆராதனை இயக்கங்களும் தாவீதின் கூடாரத்தை மாதிரியாகக் கொண்ட 24/7 ஜெப வீடுகளும்."] }
        ] }
      ] },

    { id: "purposes", type: "map", title: ["Seven purposes of worship and music", "ஆராதனை, இசையின் ஏழு நோக்கங்கள்"], short: ["Purposes", "நோக்கங்கள்"],
      center: ["Why we worship", "ஏன் ஆராதிக்கிறோம்"],
      hint: ["Worship is first for God, and then it shapes us and the world around us.", "ஆராதனை முதலில் தேவனுக்கு, பிறகு அது நம்மையும் சுற்றியுள்ள உலகையும் வடிவமைக்கிறது."],
      nodes: [
        { h: ["Ministering to God", "தேவனுக்கு ஊழியம் செய்தல்"], r: "Acts 13:2; Ps 29:2", p: ["\"As they ministered to the Lord and fasted\". God enjoys His children's love the way a father enjoys his child's song.", "\"அவர்கள் கர்த்தருக்கு ஆராதனை செய்து உபவாசித்துக்கொண்டிருக்கையில்\". தகப்பன் பிள்ளையின் பாடலை ரசிப்பது போல, தேவன் தம் பிள்ளைகளின் அன்பை ரசிக்கிறார்."] },
        { h: ["Encountering His presence", "அவர் பிரசன்னத்தைச் சந்தித்தல்"], r: "Ps 22:3; Ps 100:4", p: ["\"Enter His gates with thanksgiving.\" Not to summon an absent God, but to become aware of the God already with us.", "\"அவர் வாசல்களில் துதியோடு பிரவேசியுங்கள்.\" இல்லாத தேவனை அழைக்க அல்ல, ஏற்கனவே நம்மோடிருக்கும் தேவனை உணர."] },
        { h: ["Teaching & remembering", "போதித்தலும் நினைவுகூருதலும்"], r: "Col 3:16; Deut 31:19", p: ["God gave Moses a song so Israel would remember. Songs are how most believers learn theology, so lyrics matter.", "இஸ்ரவேல் நினைவுகூர தேவன் மோசேக்கு ஒரு பாடலைக் கொடுத்தார். பெரும்பாலான விசுவாசிகள் பாடல்கள் மூலமே இறையியலைக் கற்கிறார்கள்; எனவே பாடல் வரிகள் முக்கியம்."] },
        { h: ["Spiritual warfare", "ஆவிக்குரிய யுத்தம்"], r: "2 Chr 20:21–22; Ps 149:6", p: ["\"High praises of God in their mouth, and a two-edged sword in their hand.\" Praise declares who is King over the situation.", "\"அவர்கள் வாயில் தேவனுடைய உன்னதமான துதிகளும், அவர்கள் கையில் இருபுறமும் கருக்குள்ள பட்டயமும்.\" சூழ்நிலைக்கு யார் ராஜா என்று துதி அறிவிக்கிறது."] },
        { h: ["Healing & deliverance", "சுகமும் விடுதலையும்"], r: "1 Sam 16:23", p: ["Music calmed Saul and drove away the tormenting spirit. Modern music therapy confirms music affects the nervous system and emotions.", "இசை சவுலை அமைதிப்படுத்தி வேதனைப்படுத்தும் ஆவியை விரட்டியது. இசை நரம்பு மண்டலத்தையும் உணர்வுகளையும் பாதிக்கிறது என்று நவீன இசை சிகிச்சையும் உறுதிப்படுத்துகிறது."] },
        { h: ["Prophecy", "தீர்க்கதரிசனம்"], r: "1 Chr 25:1; 2 Kgs 3:15", p: ["Musicians \"prophesied with harps\". Worship creates space to hear God; spontaneous songs can carry His word.", "இசைக்கலைஞர்கள் \"சுரமண்டலங்களோடு தீர்க்கதரிசனஞ் சொன்னார்கள்\". ஆராதனை தேவனைக் கேட்க இடம் உருவாக்குகிறது; தன்னிச்சையான பாடல்கள் அவர் வார்த்தையைச் சுமக்கலாம்."] },
        { h: ["Unity & witness", "ஒற்றுமையும் சாட்சியும்"], r: "2 Chr 5:13; Acts 16:25", p: ["When they were \"as one\", glory came. Prisoners were listening to Paul and Silas. Worship unites the body and testifies to outsiders.", "அவர்கள் \"ஏகோபித்து\" இருந்தபோது மகிமை வந்தது. பவுலையும் சீலாவையும் கைதிகள் கேட்டுக்கொண்டிருந்தார்கள். ஆராதனை சரீரத்தை ஒன்றிணைக்கிறது, புறம்பானவர்களுக்குச் சாட்சியாகிறது."] }
      ] },

    { id: "journey", type: "flow", title: ["The tabernacle pattern: a journey into His presence", "ஆசரிப்புக் கூடார மாதிரி: அவர் பிரசன்னத்துக்குள் ஒரு பயணம்"], short: ["Tabernacle journey", "கூடாரப் பயணம்"],
      lead: ["Many worship leaders use the layout of Moses' tabernacle as a devotional flow. It is a teaching picture, not a law: in Christ the veil is torn and we come boldly (Heb 10:19–22).", "பல ஆராதனைத் தலைவர்கள் மோசேயின் ஆசரிப்புக் கூடார அமைப்பை ஒரு பக்தி ஓட்டமாகப் பயன்படுத்துகிறார்கள். இது போதனைச் சித்திரம், சட்டம் அல்ல: கிறிஸ்துவில் திரை கிழிந்தது, நாம் தைரியமாக வருகிறோம் (எபிரெயர் 10:19–22)."],
      steps: [
        { h: ["Gates: thanksgiving", "வாசல்கள்: நன்றி"], left: ["Outer court", "வெளிப்பிராகாரம்"], p: ["Remember what He has done. Upbeat songs of gratitude.", "அவர் செய்ததை நினைவுகூருங்கள். நன்றியின் உற்சாகமான பாடல்கள்."], r: "Ps 100:4" },
        { h: ["Bronze altar: the cross", "வெண்கலப் பலிபீடம்: சிலுவை"], left: ["Outer court", "வெளிப்பிராகாரம்"], p: ["Songs about the blood and the finished work; receiving forgiveness.", "இரத்தம், முடிக்கப்பட்ட கிரியை பற்றிய பாடல்கள்; மன்னிப்பைப் பெறுதல்."], r: "Heb 9:14" },
        { h: ["Laver: cleansing by the word", "தொட்டி: வசனத்தால் சுத்திகரிப்பு"], left: ["Outer court", "வெளிப்பிராகாரம்"], p: ["Scripture read or sung; letting the word wash and renew.", "வேதம் வாசிக்கப்படுகிறது அல்லது பாடப்படுகிறது; வசனம் கழுவிப் புதுப்பிக்கட்டும்."], r: "Eph 5:26" },
        { h: ["Holy Place: lampstand, bread, incense", "பரிசுத்த ஸ்தலம்: குத்துவிளக்கு, அப்பம், தூபம்"], left: ["Courts of praise", "துதியின் பிராகாரம்"], p: ["The Spirit's light, communion with Jesus, rising prayer. Songs move from about God to to God.", "ஆவியின் ஒளி, இயேசுவோடு ஐக்கியம், எழும்பும் ஜெபம். பாடல்கள் தேவனைப் பற்றியதிலிருந்து தேவனுக்கானவையாக மாறுகின்றன."], r: "Rev 5:8" },
        { h: ["Holy of Holies: intimacy", "மகா பரிசுத்த ஸ்தலம்: நெருக்கம்"], kind: "end", left: ["Worship", "ஆராதனை"], p: ["Quiet adoration, spontaneous song, listening. Here we hear the Father's voice, and prophetic songs often arise.", "அமைதியான ஆராதனை, தன்னிச்சையான பாடல், செவிகொடுத்தல். இங்கே பிதாவின் சத்தத்தைக் கேட்கிறோம்; தீர்க்கதரிசனப் பாடல்கள் அடிக்கடி எழுகின்றன."], r: "Heb 10:19–22" }
      ] },

    { id: "tabernacles", type: "table", title: ["Three houses of worship compared", "மூன்று ஆராதனை இல்லங்களின் ஒப்பீடு"], short: ["Three houses", "மூன்று இல்லங்கள்"],
      cols: [["", ""], ["Moses' tabernacle", "மோசேயின் கூடாரம்"], ["David's tabernacle", "தாவீதின் கூடாரம்"], ["New Covenant", "புதிய உடன்படிக்கை"]],
      rows: [
        [["Access", "அணுகல்"], ["High priest, once a year, behind a veil", "பிரதான ஆசாரியர், வருடம் ஒருமுறை, திரைக்குப் பின்"], ["Ark in an open tent, worship before it", "திறந்த கூடாரத்தில் பெட்டி, அதற்கு முன் ஆராதனை"], ["Every believer, any time, boldly (Heb 4:16)", "ஒவ்வொரு விசுவாசியும், எந்நேரமும், தைரியமாக (எபிரெயர் 4:16)"]],
        [["Main offering", "முக்கியப் பலி"], ["Animal sacrifices", "மிருகப் பலிகள்"], ["Sacrifices of praise and joy (1 Chr 16:1–4)", "துதி, சந்தோஷத்தின் பலிகள் (1 நாளாகமம் 16:1–4)"], ["Our bodies and the fruit of our lips (Rom 12:1; Heb 13:15)", "நம் சரீரங்களும் உதடுகளின் கனியும் (ரோமர் 12:1; எபிரெயர் 13:15)"]],
        [["Music", "இசை"], ["Little mentioned", "குறைவாகக் குறிப்பிடப்படுகிறது"], ["Continual singers, instruments, prophesying musicians", "நித்தியப் பாடகர்கள், இசைக்கருவிகள், தீர்க்கதரிசனம் சொல்லும் இசைக்கலைஞர்கள்"], ["Psalms, hymns, spiritual songs, singing with the spirit and mind (1 Cor 14:15)", "சங்கீதங்கள், கீர்த்தனைகள், ஞானப்பாட்டுகள், ஆவியோடும் கருத்தோடும் பாடுதல் (1 கொரிந்தியர் 14:15)"]],
        [["Prophetic hope", "தீர்க்கதரிசன நம்பிக்கை"], ["Points to Christ, the true sacrifice", "உண்மையான பலியாகிய கிறிஸ்துவைச் சுட்டுகிறது"], ["\"I will rebuild the tabernacle of David\" (Amos 9:11), fulfilled as Gentiles come in (Acts 15:16–17)", "\"தாவீதின் கூடாரத்தைத் திரும்ப எடுப்பிப்பேன்\" (ஆமோஸ் 9:11), புறஜாதிகள் சேர்க்கப்படும்போது நிறைவேறுகிறது (அப்போஸ்தலர் 15:16–17)"], ["We are the temple; God dwells in His people (1 Cor 3:16)", "நாமே ஆலயம்; தேவன் தம் மக்களுக்குள் வாசம்பண்ணுகிறார் (1 கொரிந்தியர் 3:16)"]]
      ] },

    { id: "relational", type: "prose", title: ["The relational heart of worship", "ஆராதனையின் உறவுமுறை இருதயம்"], short: ["Relational heart", "உறவுமுறை"],
      paras: [
        ["In many religions worship is a transaction: we sing to appease or attract a distant deity. The gospel turns this around. \"We love because He first loved us\" (1 John 4:19). Worship is a response, not a payment.", "பல மதங்களில் ஆராதனை ஒரு பரிவர்த்தனை: தூரத்திலுள்ள தெய்வத்தைச் சாந்தப்படுத்த அல்லது ஈர்க்கப் பாடுகிறோம். சுவிசேஷம் இதைத் தலைகீழாக்குகிறது. \"அவர் முந்தி நம்மிடத்தில் அன்புகூர்ந்தபடியால் நாமும் அவரிடத்தில் அன்புகூருகிறோம்\" (1 யோவான் 4:19). ஆராதனை கட்டணம் அல்ல, மறுமொழி."],
        ["Hebrews 2:12 shows Jesus Himself leading the song: \"in the midst of the assembly I will sing praise to You.\" We join the Son's worship of the Father, by the Spirit. That is why worship can be honest: lament (a third of the Psalms) is worship too.", "எபிரெயர் 2:12 இயேசுவே பாடலை நடத்துவதைக் காட்டுகிறது: \"சபை நடுவில் உம்மைத் துதித்துப் பாடுவேன்.\" ஆவியானவரால் பிதாவுக்கான குமாரனின் ஆராதனையில் நாம் இணைகிறோம். அதனால்தான் ஆராதனை நேர்மையாக இருக்க முடியும்: புலம்பலும் (சங்கீதங்களில் மூன்றில் ஒன்று) ஆராதனையே."],
        ["God is not more present because the band is louder, and He is not absent when we are sad. We do not \"bring down\" His presence; we wake up to it. Music helps the heart notice what is already true.", "இசைக்குழு சத்தமாக வாசிப்பதால் தேவன் அதிகமாக இருப்பதில்லை; நாம் துக்கமாயிருக்கும்போது அவர் இல்லாமல் போவதில்லை. அவர் பிரசன்னத்தை நாம் \"இறக்குவதில்லை\"; அதை உணர்ந்து விழிக்கிறோம். ஏற்கனவே உண்மையானதை இருதயம் கவனிக்க இசை உதவுகிறது."]
      ],
      verses: [
        { t: ["I will sing with the spirit, and I will also sing with the understanding.", "ஆவியோடும் பாடுவேன், கருத்தோடும் பாடுவேன்."], r: "1 Cor 14:15" },
        { t: ["Present your bodies a living sacrifice... which is your reasonable worship.", "உங்கள் சரீரங்களைப் பரிசுத்தமும் தேவனுக்குப் பிரீதியுமான ஜீவபலியாக ஒப்புக்கொடுங்கள்; இதுவே நீங்கள் செய்யத்தக்க புத்தியுள்ள ஆராதனை."], r: "Rom 12:1" }
      ] },

    { id: "objections", type: "flip", title: ["Worship debates and honest answers", "ஆராதனை விவாதங்களும் நேர்மையான பதில்களும்"], short: ["Debates", "விவாதங்கள்"],
      items: [
        { q: ["\"Modern worship is just emotionalism.\"", "\"நவீன ஆராதனை வெறும் உணர்ச்சிவசப்படுதல்.\""], a: ["Emotion is not the enemy: David danced, wept and shouted. The question is whether emotion is responding to truth (\"spirit and truth\") or being manufactured by technique.", "உணர்ச்சி எதிரி அல்ல: தாவீது நடனமாடினான், அழுதான், ஆர்ப்பரித்தான். உணர்ச்சி சத்தியத்துக்கு மறுமொழியா (\"ஆவியோடும் உண்மையோடும்\"), அல்லது நுட்பத்தால் உருவாக்கப்படுகிறதா என்பதே கேள்வி."], r: "John 4:24" },
        { q: ["\"Instruments don't belong in church.\"", "\"இசைக்கருவிகள் சபைக்கு ஏற்றவை அல்ல.\""], a: ["Some traditions sing a cappella, citing the NT's silence. Yet Psalm 150 calls for every instrument, and Revelation pictures harps in heaven (Rev 5:8). Most churches see instruments as free to use.", "புதிய ஏற்பாட்டின் மௌனத்தைச் சுட்டி சில பாரம்பரியங்கள் இசைக்கருவியின்றிப் பாடுகின்றன. ஆனால் சங்கீதம் 150 எல்லா இசைக்கருவிகளையும் அழைக்கிறது, வெளிப்படுத்தின விசேஷம் பரலோகத்தில் சுரமண்டலங்களைக் காட்டுகிறது (5:8). பெரும்பாலான சபைகள் இசைக்கருவிகளைச் சுதந்தரமாகப் பயன்படுத்தலாம் என்று கருதுகின்றன."], r: "Ps 150" },
        { q: ["\"Worship has become a performance.\"", "\"ஆராதனை ஒரு நிகழ்ச்சியாகிவிட்டது.\""], a: ["A real danger (Amos 5:23: \"take away the noise of your songs\"). Excellence is biblical (skilled musicians, 1 Chr 25:7); the cure is leaders who lead people to God, not to themselves, and lives of justice behind the songs.", "உண்மையான ஆபத்து (ஆமோஸ் 5:23: \"உன் பாட்டுகளின் இரைச்சலை என்னைவிட்டு அகற்று\"). சிறப்பு வேதப்பூர்வமானது (தேர்ந்த இசைக்கலைஞர்கள், 1 நாளாகமம் 25:7); மருந்து: மக்களைத் தங்களிடம் அல்ல, தேவனிடம் நடத்தும் தலைவர்கள், பாடல்களுக்குப் பின் நீதியான வாழ்க்கை."], r: "Amos 5:21–24" },
        { q: ["\"Can Christians use Indian classical music?\"", "\"கிறிஸ்தவர்கள் இந்தியச் சாஸ்திரிய இசையைப் பயன்படுத்தலாமா?\""], a: ["Vedanayagam Sastriar answered yes two centuries ago. Ragas and rhythms are part of God's creation; what matters is the One the song is sung to. Every tongue and tribe brings its sound to the throne (Rev 7:9).", "இரண்டு நூற்றாண்டுகளுக்கு முன்பே வேதநாயகம் சாஸ்திரியார் ஆம் என்று பதில் சொன்னார். ராகங்களும் தாளங்களும் தேவனுடைய சிருஷ்டியின் பகுதி; பாடல் யாருக்குப் பாடப்படுகிறது என்பதே முக்கியம். ஒவ்வொரு பாஷையும் கோத்திரமும் தன் ஒலியைச் சிங்காசனத்துக்குக் கொண்டுவருகிறது (வெளிப்படுத்தின விசேஷம் 7:9)."], r: "Rev 7:9" }
      ] },

    { id: "practice", type: "steps", title: ["Practices: personal and congregational", "பழக்கங்கள்: தனிப்பட்டதும் சபைக்குரியதும்"], short: ["Practice", "நடைமுறை"],
      items: [
        { h: ["Start the day with a psalm", "ஒரு சங்கீதத்தோடு நாளைத் தொடங்குங்கள்"], p: ["Read one psalm slowly; sing a line of it in your own tune. The Psalms are God's own songbook.", "ஒரு சங்கீதத்தை மெதுவாக வாசியுங்கள்; அதில் ஒரு வரியை உங்கள் சொந்த ராகத்தில் பாடுங்கள். சங்கீதங்கள் தேவனுடைய சொந்தப் பாடல் புத்தகம்."], r: "Ps 5:3" },
        { h: ["Praise before the answer", "பதிலுக்கு முன் துதியுங்கள்"], p: ["When anxious, name three things God has done and thank Him aloud (*towdah*). Thanksgiving is a door out of anxiety (Phil 4:6–7).", "கவலையாயிருக்கும்போது தேவன் செய்த மூன்று காரியங்களைச் சொல்லி உரக்க நன்றி சொல்லுங்கள் (*தோதா*). நன்றி கவலையிலிருந்து வெளியேறும் கதவு (பிலிப்பியர் 4:6–7)."], r: "Phil 4:6–7" },
        { h: ["Sing in the spirit", "ஆவியில் பாடுங்கள்"], p: ["If you pray in tongues, sing in tongues too, then sing in your language what rises in your heart.", "நீங்கள் அந்நிய பாஷையில் ஜெபித்தால் அதிலும் பாடுங்கள்; பிறகு இருதயத்தில் எழுவதை உங்கள் மொழியில் பாடுங்கள்."], r: "1 Cor 14:15" },
        { h: ["Lead people, not a set list", "பாடல் பட்டியலை அல்ல, மக்களை நடத்துங்கள்"], p: ["For leaders: choose songs with true lyrics; follow a flow from thanksgiving to intimacy; leave space for silence and spontaneous song; watch the room with love.", "தலைவர்களுக்கு: சத்தியமான வரிகளுள்ள பாடல்களைத் தேர்ந்தெடுங்கள்; நன்றியிலிருந்து நெருக்கத்துக்கு ஓட்டத்தைப் பின்பற்றுங்கள்; அமைதிக்கும் தன்னிச்சையான பாடலுக்கும் இடம் விடுங்கள்; அன்போடு கூட்டத்தைக் கவனியுங்கள்."] },
        { h: ["Worship in warfare", "யுத்தத்தில் ஆராதனை"], p: ["Under spiritual pressure, play or sing songs that declare God's victory and goodness. Like Jehoshaphat, let praise go first.", "ஆவிக்குரிய அழுத்தத்தில், தேவனுடைய வெற்றியையும் நன்மையையும் அறிவிக்கும் பாடல்களை வாசியுங்கள் அல்லது பாடுங்கள். யோசபாத்தைப் போல, துதி முன்னே செல்லட்டும்."], r: "2 Chr 20:21" }
      ] },

    { id: "quiz", type: "quiz", title: ["Check your understanding", "உங்கள் புரிதலைச் சோதியுங்கள்"], short: ["Quiz", "வினாடி வினா"],
      items: [
        { q: ["Which Hebrew word is the root of \"Hallelujah\"?", "\"அல்லேலூயா\" என்பதன் வேர் எந்த எபிரெயச் சொல்?"], o: ["Barak", "Halal", "Zamar"], a: 1, w: ["*Halal*: to boast in, celebrate, even rave about God.", "*ஹாலால்*: தேவனில் மேன்மைபாராட்டுதல், கொண்டாடுதல்."] },
        { q: ["What happened when the singers and trumpeters were \"as one\" in 2 Chronicles 5?", "2 நாளாகமம் 5-ல் பாடகர்களும் எக்காளக்காரரும் \"ஏகோபித்து\" இருந்தபோது என்ன நடந்தது?"], o: [["The walls fell", "மதில்கள் விழுந்தன"], ["The glory cloud filled the Temple", "மகிமையின் மேகம் ஆலயத்தை நிரப்பியது"], ["Fire fell on the altar", "பலிபீடத்தின்மேல் அக்கினி இறங்கியது"]], a: 1, w: ["The priests could not stand to minister because of the cloud (2 Chr 5:14).", "மேகத்தினால் ஆசாரியர்கள் ஊழியம் செய்ய நிற்கக்கூடாமற்போனது (2 நாளாகமம் 5:14)."] },
        { q: ["Who wrote hundreds of Tamil Christian *keerthanaigal* in Carnatic ragas?", "கர்நாடக ராகங்களில் நூற்றுக்கணக்கான தமிழ்க் கிறிஸ்தவக் கீர்த்தனைகளை எழுதியவர் யார்?"], o: [["H.A. Krishna Pillai", "எச்.ஏ. கிருஷ்ணபிள்ளை"], ["Vedanayagam Sastriar", "வேதநாயகம் சாஸ்திரியார்"], ["Pandita Ramabai", "பண்டிதா ரமாபாய்"]], a: 1, w: ["Vedanayagam Sastriar of Tanjore (1774–1864).", "தஞ்சாவூர் வேதநாயகம் சாஸ்திரியார் (1774–1864)."] }
      ] }
  ]
});

PP.studies.push({
  id: "freedom", n: 4, accent: "rose",
  title: ["Curses, Demonology & Deliverance", "சாபங்கள், பிசாசியல் & விடுதலை"],
  short: ["Curses & Deliverance", "சாபமும் விடுதலையும்"], tab: ["Freedom", "விடுதலை"],
  tagline: ["Why born-again people still struggle, where curses come from, what gives darkness a foothold, and how to walk into lasting freedom.", "மறுபடி பிறந்தவர்களும் ஏன் போராடுகிறார்கள், சாபங்கள் எங்கிருந்து வருகின்றன, இருளுக்கு எது இடம் கொடுக்கிறது, நிலையான விடுதலைக்குள் எப்படி நடப்பது."],
  verse: { t: ["Christ has redeemed us from the curse of the law, having become a curse for us... that the blessing of Abraham might come upon the Gentiles in Christ Jesus.", "கிறிஸ்து நமக்காகச் சாபமாகி, நியாயப்பிரமாணத்தின் சாபத்திற்கு நம்மை நீங்கலாக்கி மீட்டுக்கொண்டார்... ஆபிரகாமுக்கு உண்டான ஆசீர்வாதம் கிறிஸ்து இயேசுவினால் புறஜாதிகள்மேல் வரும்படிக்கு."], r: "Gal 3:13–14" },
  sections: [
    { id: "question", type: "prose", title: ["The honest question", "நேர்மையான கேள்வி"], short: ["The question", "கேள்வி"],
      paras: [
        ["Many sincere, Spirit-filled believers see the same painful patterns repeat: early deaths, broken marriages, addictions, chronic illness, poverty that won't lift, fear that won't leave. They ask: *if Christ became a curse for me, why does it feel like a curse is still on my family?*", "பல உண்மையான, ஆவியால் நிறைந்த விசுவாசிகள் ஒரே வேதனையான போக்குகள் திரும்பத் திரும்ப வருவதைக் காண்கிறார்கள்: அகால மரணங்கள், உடைந்த திருமணங்கள், அடிமைத்தனங்கள், நீண்டகால நோய், நீங்காத வறுமை, போகாத பயம். அவர்கள் கேட்கிறார்கள்: *கிறிஸ்து எனக்காகச் சாபமானார் என்றால், ஏன் என் குடும்பத்தின்மேல் இன்னும் சாபம் இருப்பது போல் உணர்கிறேன்?*"],
        ["This study answers on three levels. **Position:** at the cross every curse was legally broken for the believer (Gal 3:13; Col 2:14–15). **Experience:** what is true in Christ must be received, applied and walked out, because doors opened by sin, occult practice, unforgiveness, trauma and agreement with lies can still be used by the enemy (Eph 4:27). **Discernment:** not every struggle is a curse; many are medical, psychological, relational, or simply the brokenness of a fallen world.", "இந்தப் படிப்பு மூன்று நிலைகளில் பதில் சொல்கிறது. **நிலை:** சிலுவையில் விசுவாசிக்கு ஒவ்வொரு சாபமும் சட்டப்பூர்வமாக முறிக்கப்பட்டது (கலாத்தியர் 3:13; கொலோசெயர் 2:14–15). **அனுபவம்:** கிறிஸ்துவில் உண்மையானது பெறப்பட்டு, பயன்படுத்தப்பட்டு, வாழ்ந்து காட்டப்பட வேண்டும்; ஏனெனில் பாவம், மாந்திரீகப் பழக்கம், மன்னியாமை, அதிர்ச்சி, பொய்களோடு ஒப்பந்தம் திறந்த கதவுகளைச் சத்துரு இன்னும் பயன்படுத்தலாம் (எபேசியர் 4:27). **பகுத்தறிவு:** எல்லாப் போராட்டமும் சாபம் அல்ல; பல மருத்துவம், உளவியல், உறவுமுறை சார்ந்தவை, அல்லது விழுந்துபோன உலகின் உடைவு மட்டுமே."],
        ["**Is it exaggerated?** Both yes and no. Some ministries see a demon behind every headache and a curse behind every setback, which breeds fear, blame and even abuse. Others deny the spiritual realm entirely, leaving people with no answer for what Jesus clearly confronted. The goal of this study is the balance Jesus modelled: no fear of the devil, no blindness to him, and eyes fixed on the Father's love.", "**இது மிகைப்படுத்தப்பட்டதா?** ஆம், இல்லை இரண்டும். சில ஊழியங்கள் ஒவ்வொரு தலைவலிக்குப் பின்னும் பிசாசையும் ஒவ்வொரு பின்னடைவுக்குப் பின்னும் சாபத்தையும் காண்கின்றன; இது பயம், குற்றச்சாட்டு, துஷ்பிரயோகத்தையும் வளர்க்கிறது. மற்றவர்கள் ஆவிக்குரிய உலகத்தையே மறுக்கிறார்கள்; இயேசு தெளிவாக எதிர்கொண்டதற்கு மக்களுக்குப் பதிலில்லாமல் போகிறது. இந்தப் படிப்பின் நோக்கம் இயேசு காட்டிய சமநிலை: பிசாசுக்குப் பயமும் இல்லை, அவனைப் பற்றிய குருட்டுத்தனமும் இல்லை, கண்கள் பிதாவின் அன்பின்மேல்."]
      ],
      verses: [
        { t: ["Like a flitting sparrow, like a flying swallow, so a curse without cause shall not alight.", "அடைக்கலான் குருவி அலைந்துபோவதுபோலவும், தகைவிலான் குருவி பறந்துபோவதுபோலவும், காரணமில்லாமல் இட்ட சாபம் தங்காது."], r: "Prov 26:2" },
        { t: ["Nor give place to the devil.", "பிசாசுக்கு இடங்கொடாமலும் இருங்கள்."], r: "Eph 4:27" },
        { t: ["The ruler of this world is coming, and he has nothing in Me.", "இந்த உலகத்தின் அதிபதி வருகிறான், அவனுக்கு என்னிடத்தில் ஒன்றுமில்லை."], r: "John 14:30" }
      ] },

    { id: "words", type: "cards", title: ["The vocabulary of blessing and curse", "ஆசீர்வாதம், சாபத்தின் சொற்கள்"], short: ["Vocabulary", "சொற்கள்"],
      lead: ["In Scripture a curse is not magic. It is a word or condition that cuts off life, favour and relationship; blessing releases them.", "வேதத்தில் சாபம் மாயவித்தை அல்ல. ஜீவனையும் தயவையும் உறவையும் துண்டிக்கும் வார்த்தை அல்லது நிலை அது; ஆசீர்வாதம் அவற்றை விடுவிக்கிறது."],
      items: [
        { tag: "אָרַר arar", h: ["To bind, hem in", "கட்டுதல், சுற்றி அடைத்தல்"], p: ["The curse on the serpent and the ground (Gen 3:14, 17). A curse restricts and blocks flourishing.", "சர்ப்பத்தின்மேலும் நிலத்தின்மேலும் வந்த சாபம் (ஆதியாகமம் 3:14, 17). சாபம் தடுத்து, செழிப்பை அடைக்கிறது."], r: "Gen 3:14" },
        { tag: "קָלַל qalal", h: ["To make light, despise", "இலேசாக்குதல், அற்பமாக்குதல்"], p: ["To treat as worthless: \"I will curse him who curses (despises) you\" (Gen 12:3). The opposite of honour (*kabod*, weight).", "மதிப்பற்றதாக நடத்துதல்: \"உன்னை சபிக்கிறவனை (அற்பமாக்குகிறவனை) சபிப்பேன்\" (ஆதியாகமம் 12:3). கனத்துக்கு (*காபோத்*, எடை) எதிரானது."], r: "Gen 12:3" },
        { tag: "אָלָה alah", h: ["Oath-curse", "ஆணைச் சாபம்"], p: ["A curse attached to a covenant oath: blessings for keeping it, curses for breaking it (Deut 29:12–21).", "உடன்படிக்கை ஆணையோடு இணைந்த சாபம்: கைக்கொண்டால் ஆசீர்வாதம், மீறினால் சாபம் (உபாகமம் 29:12–21)."], r: "Deut 29:12" },
        { tag: "κατάρα katara", h: ["Curse (NT)", "சாபம் (பு.ஏ.)"], p: ["\"Christ redeemed us from the curse of the law, having become a curse for us\" (Gal 3:13). The cross is God's answer to every curse.", "\"கிறிஸ்து நமக்காகச் சாபமாகி, நியாயப்பிரமாணத்தின் சாபத்திற்கு நம்மை நீங்கலாக்கி மீட்டுக்கொண்டார்\" (கலாத்தியர் 3:13). ஒவ்வொரு சாபத்துக்கும் சிலுவையே தேவனுடைய பதில்."], r: "Gal 3:13" },
        { tag: "בָּרַךְ barak", h: ["To bless", "ஆசீர்வதித்தல்"], p: ["To kneel, to give life and favour. God's first word over humanity was blessing (Gen 1:28). Blessing is the original design; curse is the intruder.", "முழங்காற்படியிடுதல், ஜீவனையும் தயவையும் கொடுத்தல். மனிதகுலத்தின்மேல் தேவனுடைய முதல் வார்த்தை ஆசீர்வாதம் (ஆதியாகமம் 1:28). ஆசீர்வாதமே மூல வடிவமைப்பு; சாபம் அத்துமீறி நுழைந்தது."], r: "Gen 1:28" },
        { tag: ["Key principle", "முக்கியக் கொள்கை"], h: ["No cause, no landing", "காரணமில்லை, தங்குவதில்லை"], p: ["\"A curse without cause shall not alight\" (Prov 26:2). Deliverance ministry builds on this: find and remove the cause, and the curse has nothing to rest on.", "\"காரணமில்லாமல் இட்ட சாபம் தங்காது\" (நீதிமொழிகள் 26:2). விடுதலை ஊழியம் இதன்மேல் கட்டப்படுகிறது: காரணத்தைக் கண்டுபிடித்து நீக்கினால், சாபம் தங்க இடமில்லை."], r: "Prov 26:2" }
      ] },

    { id: "roots", type: "map", title: ["Root causes of curses: a visual map", "சாபங்களின் வேர்க் காரணங்கள்: காட்சி வரைபடம்"], short: ["Root causes", "வேர்க் காரணங்கள்"],
      center: ["Why a curse can land", "சாபம் ஏன் தங்கலாம்"],
      hint: ["The main roots named by deliverance teachers such as Derek Prince, each with its biblical basis. Tap a branch.", "டெரெக் பிரின்ஸ் போன்ற விடுதலைப் போதகர்கள் குறிப்பிடும் முக்கிய வேர்கள், ஒவ்வொன்றும் வேத ஆதாரத்தோடு. ஒரு கிளையைத் தொடுங்கள்."],
      nodes: [
        { h: ["Idolatry & the occult", "விக்கிரக ஆராதனை & மாந்திரீகம்"], r: "Deut 18:10–12; Exod 20:3–5", p: ["The most serious root in Scripture: other gods, witchcraft, mediums, astrology, charms. In Indian settings this can include family deities, temple dedications, *thayathu* amulets, black threads and consulting soothsayers.", "வேதத்தில் மிகக் கடுமையான வேர்: அந்நிய தேவர்கள், சூனியம், குறிசொல்பவர்கள், ஜோதிடம், தாயத்துகள். இந்தியச் சூழலில் குலதெய்வங்கள், கோவில் நேர்த்திக்கடன்கள், தாயத்துகள், கருப்புக் கயிறுகள், குறி கேட்டல் இதில் அடங்கலாம்."] },
        { h: ["Personal sin & disobedience", "தனிப்பட்ட பாவமும் கீழ்ப்படியாமையும்"], r: "Deut 28:15; Gal 6:7", p: ["Deuteronomy 28 lists blessings for obedience and curses for disobedience. Much of this works as consequence: we reap what we sow.", "உபாகமம் 28 கீழ்ப்படிதலுக்கு ஆசீர்வாதங்களையும் கீழ்ப்படியாமைக்குச் சாபங்களையும் பட்டியலிடுகிறது. இதில் பெரும்பகுதி விளைவாகச் செயல்படுகிறது: விதைத்ததை அறுக்கிறோம்."] },
        { h: ["Generational iniquity", "தலைமுறைப் பாவக்கேடு"], r: "Exod 20:5; Lam 5:7; Lev 26:40", p: ["\"Visiting the iniquity of the fathers on the children... of those who hate Me.\" Patterns of sin, trauma and spiritual agreement pass down families until someone repents and breaks them.", "\"என்னைப் பகைக்கிறவர்களைக் குறித்துப் பிதாக்களுடைய அக்கிரமத்தைப் பிள்ளைகளிடத்தில் விசாரிக்கிறேன்.\" பாவம், அதிர்ச்சி, ஆவிக்குரிய ஒப்பந்தங்களின் போக்குகள் யாராவது மனந்திரும்பி முறிக்கும்வரை குடும்பங்களில் இறங்குகின்றன."] },
        { h: ["Words spoken", "பேசப்பட்ட வார்த்தைகள்"], r: "Prov 18:21; Jas 3:9–10", p: ["Words from parents, teachers, spouses or authority figures (\"you will never amount to anything\") and inner vows (\"I will never trust anyone\") can bind like curses when believed.", "பெற்றோர், ஆசிரியர், வாழ்க்கைத்துணை அல்லது அதிகாரத்திலுள்ளோரின் வார்த்தைகள் (\"நீ ஒருபோதும் உருப்படமாட்டாய்\"), உள் சபதங்கள் (\"நான் யாரையும் நம்பமாட்டேன்\") நம்பப்படும்போது சாபம் போலக் கட்டலாம்."] },
        { h: ["Self-imposed curses & vows", "தானே வருவித்த சாபங்கள் & சபதங்கள்"], r: "Matt 27:25; Judg 11:30–35", p: ["\"His blood be on us and on our children.\" Rash oaths (Jephthah), curses on oneself (\"let me die if...\"), and covenants in secret societies.", "\"அவனுடைய இரத்தம் எங்கள்மேலும் எங்கள் பிள்ளைகள்மேலும் இருக்கட்டும்.\" அவசரச் சபதங்கள் (யெப்தா), தன்மேலே சாபங்கள் (\"...என்றால் நான் சாகட்டும்\"), இரகசியச் சங்கங்களின் உடன்படிக்கைகள்."] },
        { h: ["Witchcraft by others", "மற்றவர்களின் சூனியம்"], r: "Num 22–24; Gal 3:1", p: ["Balaam was hired to curse Israel. Malicious spiritual practice (*seivinai*, *billi soonyam*) is real in Scripture, but it could not curse whom God had blessed (Num 23:8). Its power depends largely on open doors and fear.", "இஸ்ரவேலைச் சபிக்கப் பிலேயாம் கூலிக்கு அமர்த்தப்பட்டான். தீய ஆவிக்குரிய செயல் (*செய்வினை*, *பில்லி சூனியம்*) வேதத்தில் உண்மையானது; ஆனால் தேவன் ஆசீர்வதித்தவர்களை அது சபிக்க முடியவில்லை (எண்ணாகமம் 23:8). அதன் வல்லமை பெரும்பாலும் திறந்த கதவுகளையும் பயத்தையும் சார்ந்தது."] },
        { h: ["Unforgiveness & bitterness", "மன்னியாமையும் கசப்பும்"], r: "Matt 18:34–35; Heb 12:15", p: ["The unforgiving servant was handed to \"the tormentors\". A root of bitterness defiles many. This is the most common foothold deliverance ministers report.", "மன்னிக்காத வேலைக்காரன் \"உபாதிக்கிறவர்களிடத்தில்\" ஒப்புக்கொடுக்கப்பட்டான். கசப்பான வேர் அநேகரைத் தீட்டுப்படுத்துகிறது. விடுதலை ஊழியர்கள் குறிப்பிடும் மிகப் பொதுவான இடம் இதுவே."] },
        { h: ["Injustice & cursed objects", "அநீதியும் சாபத்துக்குரிய பொருட்களும்"], r: "Deut 27:17–19; Deut 7:26; Acts 19:19", p: ["Oppressing the poor, orphan and widow; stolen or occult objects brought into the home (Achan, Josh 7). The Ephesians burned their magic books.", "ஏழை, அனாதை, விதவையை ஒடுக்குதல்; திருடப்பட்ட அல்லது மாந்திரீகப் பொருட்கள் வீட்டுக்குள் (ஆகான், யோசுவா 7). எபேசியர் தங்கள் மாய மந்திரப் புஸ்தகங்களைச் சுட்டெரித்தார்கள்."] }
      ] },

    { id: "doors", type: "cycle", title: ["How a foothold becomes bondage", "ஓர் இடம் எப்படி அடிமைத்தனமாகிறது"], short: ["Foothold cycle", "இடச் சுழற்சி"],
      lead: ["Paul's word *topos* (Eph 4:27) means a place or piece of ground. Watch how a small opening can become a cycle. Press play.", "பவுலின் *டோபோஸ்* (எபேசியர் 4:27) என்ற சொல் இடம் அல்லது நிலப்பகுதி என்று பொருள்படும். ஒரு சிறிய திறப்பு எப்படிச் சுழற்சியாகிறது என்று பாருங்கள். இயக்குங்கள்."],
      center: ["The cycle Jesus breaks", "இயேசு முறிக்கும் சுழற்சி"],
      nodes: [
        { h: ["Open door", "திறந்த கதவு"], r: "Eph 4:26–27", p: ["A sin, a trauma, an occult contact, a family dedication, or an unhealed wound. Often not chosen, especially in childhood.", "ஒரு பாவம், அதிர்ச்சி, மாந்திரீகத் தொடர்பு, குடும்ப நேர்த்திக்கடன், அல்லது ஆறாத காயம். பெரும்பாலும் தேர்ந்தெடுக்கப்படாதது, குறிப்பாகக் குழந்தைப்பருவத்தில்."] },
        { h: ["A lie believed", "நம்பப்பட்ட பொய்"], r: "John 8:44", p: ["\"I am worthless.\" \"God doesn't protect me.\" \"Our family is cursed.\" The enemy's power works through deception (Rev 12:9).", "\"நான் மதிப்பற்றவன்.\" \"தேவன் என்னைக் காப்பதில்லை.\" \"எங்கள் குடும்பம் சபிக்கப்பட்டது.\" சத்துருவின் வல்லமை வஞ்சகத்தின் மூலம் செயல்படுகிறது (வெளிப்படுத்தின விசேஷம் 12:9)."] },
        { h: ["Agreement", "ஒப்பந்தம்"], r: "Amos 3:3", p: ["When we agree with a lie, we give it authority in our life. Fear is often faith in the enemy's report.", "ஒரு பொய்யோடு ஒப்புக்கொள்ளும்போது, நம் வாழ்வில் அதற்கு அதிகாரம் கொடுக்கிறோம். பயம் பெரும்பாலும் சத்துருவின் அறிக்கையில் விசுவாசம்."] },
        { h: ["Foothold", "கால் ஊன்றும் இடம்"], r: "Eph 4:27", p: ["A place from which pressure, torment or temptation can operate, like a squatter on unused land.", "அழுத்தம், வேதனை, சோதனை செயல்படக்கூடிய இடம், பயன்படாத நிலத்தில் அத்துமீறிக் குடியேறியவன் போல."] },
        { h: ["Stronghold", "அரண்"], r: "2 Cor 10:4–5", p: ["A fortified pattern of thinking and feeling that \"exalts itself against the knowledge of God.\"", "\"தேவனை அறிகிற அறிவுக்கு விரோதமாய் எழும்புகிற\" பலப்படுத்தப்பட்ட சிந்தனை, உணர்வுப் போக்கு."] },
        { h: ["Bondage & repetition", "அடிமைத்தனமும் மீண்டும் நிகழ்தலும்"], r: "Rom 7:15; Gal 5:1", p: ["Compulsive behaviour, recurring crises, torment. The behaviour opens more doors, and the cycle feeds itself until truth, repentance and authority break it.", "கட்டாய நடத்தை, மீண்டும் மீண்டும் வரும் நெருக்கடிகள், வேதனை. நடத்தை மேலும் கதவுகளைத் திறக்கிறது; சத்தியம், மனந்திரும்புதல், அதிகாரம் முறிக்கும்வரை சுழற்சி தன்னைத்தானே வளர்க்கிறது."] }
      ] },

    { id: "legal", type: "table", title: ["Legal rights: what gives ground, and how it is closed", "சட்ட உரிமைகள்: எது இடம் கொடுக்கிறது, அது எப்படி மூடப்படுகிறது"], short: ["Legal rights", "சட்ட உரிமைகள்"],
      lead: ["Deliverance ministry often uses courtroom language: Satan is \"the accuser\" (Rev 12:10) who looks for legal grounds. At the cross Jesus \"wiped out the handwriting of requirements that was against us\" (Col 2:14). Our part is to agree with that verdict and withdraw any consent we gave. Tap a row to focus.", "விடுதலை ஊழியம் அடிக்கடி நீதிமன்ற மொழியைப் பயன்படுத்துகிறது: சாத்தான் சட்ட ஆதாரங்களைத் தேடும் \"குற்றஞ்சாட்டுகிறவன்\" (வெளிப்படுத்தின விசேஷம் 12:10). சிலுவையில் இயேசு \"நமக்கு எதிரிடையாயிருந்த கையெழுத்தைக் குலைத்துப் போட்டார்\" (கொலோசெயர் 2:14). அந்தத் தீர்ப்போடு ஒப்புக்கொண்டு நாம் கொடுத்த சம்மதத்தைத் திரும்பப் பெறுவதே நம் பங்கு. கவனம் செலுத்த ஒரு வரிசையைத் தொடுங்கள்."],
      cols: [["Ground", "ஆதாரம்"], ["Scripture", "வேதவாக்கியம்"], ["How it is closed", "எப்படி மூடப்படுகிறது"]], filter: true,
      rows: [
        [["Unconfessed sin", "அறிக்கையிடப்படாத பாவம்"], "1 John 1:9; Prov 28:13", ["Specific confession and turning; receiving the blood's cleansing.", "குறிப்பிட்ட அறிக்கையும் திரும்புதலும்; இரத்தத்தின் சுத்திகரிப்பைப் பெறுதல்."]],
        [["Unforgiveness", "மன்னியாமை"], "Matt 18:34–35; Mark 11:25", ["Forgive by name, as a decision, releasing the debt to God (feelings follow later).", "பெயர் சொல்லி, ஒரு தீர்மானமாக மன்னித்து, கடனைத் தேவனிடம் விடுவித்தல் (உணர்வுகள் பின்னர் வரும்)."]],
        [["Occult involvement", "மாந்திரீகத் தொடர்பு"], "Deut 18:10–12; Acts 19:18–19", ["Renounce each practice by name; destroy objects, charms and books.", "ஒவ்வொரு பழக்கத்தையும் பெயர் சொல்லி மறுதலித்தல்; பொருட்கள், தாயத்துகள், புத்தகங்களை அழித்தல்."]],
        [["Dedications & covenants", "நேர்த்திக்கடன்களும் உடன்படிக்கைகளும்"], "Josh 9; 2 Cor 6:14–18", ["Renounce dedications made for you (to deities, temples, secret societies) and rededicate to Christ.", "உங்களுக்காகச் செய்யப்பட்ட நேர்த்திக்கடன்களை (தெய்வங்கள், கோவில்கள், இரகசியச் சங்கங்களுக்கு) மறுதலித்து கிறிஸ்துவுக்கு மீண்டும் அர்ப்பணித்தல்."]],
        [["Generational iniquity", "தலைமுறைப் பாவக்கேடு"], "Lev 26:40–42; Neh 9:2; Dan 9:5–8", ["Identificational confession of ancestors' sins (not guilt for them), then claiming Gal 3:13.", "முன்னோரின் பாவங்களை அடையாளப்படுத்தும் அறிக்கை (அவற்றுக்கான குற்றம் அல்ல), பிறகு கலாத்தியர் 3:13-ஐ உரிமைகோருதல்."]],
        [["Inner vows & word curses", "உள் சபதங்களும் வார்த்தைச் சாபங்களும்"], "Matt 5:33–37; Luke 6:28", ["Break your own vows; forgive and bless those who cursed you; replace lies with God's word.", "உங்கள் சொந்தச் சபதங்களை முறித்தல்; உங்களைச் சபித்தவர்களை மன்னித்து ஆசீர்வதித்தல்; பொய்களைத் தேவ வார்த்தையால் மாற்றுதல்."]],
        [["Ungodly soul ties", "தேவபக்தியற்ற ஆத்தும பிணைப்புகள்"], "1 Cor 6:16–18", ["Confess sexual sin or controlling relationships; ask God to sever unhealthy bonds and restore your soul.", "பாலியல் பாவம் அல்லது கட்டுப்படுத்தும் உறவுகளை அறிக்கையிடுதல்; ஆரோக்கியமற்ற பிணைப்புகளை அறுத்து ஆத்துமாவைச் சீர்ப்படுத்தத் தேவனிடம் கேட்டல்."]],
        [["Trauma & fear", "அதிர்ச்சியும் பயமும்"], "Ps 34:4; 2 Tim 1:7", ["Invite Jesus into the memory; grieve; replace fear with His love; get trauma-informed counselling where needed.", "நினைவுக்குள் இயேசுவை அழைத்தல்; துக்கித்தல்; பயத்தை அவர் அன்பால் மாற்றுதல்; தேவையானால் அதிர்ச்சி அறிந்த ஆலோசனை பெறுதல்."]]
      ] },

    { id: "generational", type: "lens", title: ["Generational curses: five perspectives", "தலைமுறைச் சாபங்கள்: ஐந்து கண்ணோட்டங்கள்"], short: ["Generational", "தலைமுறை"],
      q: ["Exodus 20:5 says iniquity is visited to the third and fourth generation. Ezekiel 18:20 says \"the son shall not bear the guilt of the father.\" How do these fit?", "யாத்திராகமம் 20:5 அக்கிரமம் மூன்றாம் நான்காம் தலைமுறை வரை விசாரிக்கப்படும் என்கிறது. எசேக்கியேல் 18:20 \"தகப்பனுடைய அக்கிரமத்தைக் குமாரன் சுமப்பதில்லை\" என்கிறது. இவை எப்படிப் பொருந்துகின்றன?"],
      views: [
        { name: ["Deliverance ministry", "விடுதலை ஊழியம்"], who: ["Derek Prince, Frank Hammond, many African & Indian ministries", "டெரெக் பிரின்ஸ், ஃபிராங்க் ஹேமண்ட், பல ஆப்பிரிக்க, இந்திய ஊழியங்கள்"], p: ["Ancestral sin, especially idolatry and occult covenants, opens a door that spirits use down the family line. Ezekiel removes guilt, but not necessarily influence. Believers should confess the family's iniquity (Lev 26:40; Neh 9:2) and specifically break the curse in Jesus' name.", "முன்னோரின் பாவம், குறிப்பாக விக்கிரக ஆராதனையும் மாந்திரீக உடன்படிக்கைகளும், குடும்ப வரிசையில் ஆவிகள் பயன்படுத்தும் கதவைத் திறக்கிறது. எசேக்கியேல் குற்றத்தை நீக்குகிறது, ஆனால் தாக்கத்தை அவசியம் நீக்குவதில்லை. விசுவாசிகள் குடும்பத்தின் அக்கிரமத்தை அறிக்கையிட்டு (லேவியராகமம் 26:40; நெகேமியா 9:2) இயேசுவின் நாமத்தில் சாபத்தைக் குறிப்பாக முறிக்க வேண்டும்."], c: ["Gives real tools and names real patterns, but can create fear that one is never \"fully free\" and send people endlessly digging into ancestry.", "உண்மையான கருவிகளைத் தருகிறது, உண்மையான போக்குகளைப் பெயரிடுகிறது; ஆனால் ஒருபோதும் \"முழுமையாக விடுதலையில்லை\" என்ற பயத்தை உருவாக்கி முன்னோர் வரலாற்றில் முடிவில்லாமல் தோண்ட வைக்கலாம்."] },
        { name: ["Reformed / evangelical critics", "சீர்திருத்த / சுவிசேஷ விமர்சகர்கள்"], p: ["Exodus 20:5 is conditional (\"of those who hate Me\") and is immediately followed by mercy to thousands (20:6). Ezekiel 18 and Jeremiah 31:29–30 announce a new era of personal responsibility. In Christ there is \"no condemnation\" (Rom 8:1). Family patterns are learned behaviour, genetics and family systems, not spirits.", "யாத்திராகமம் 20:5 நிபந்தனையுள்ளது (\"என்னைப் பகைக்கிறவர்களைக் குறித்து\"), உடனே ஆயிரம் தலைமுறைக்கு இரக்கம் பின்தொடர்கிறது (20:6). எசேக்கியேல் 18-ம் எரேமியா 31:29–30-ம் தனிப்பட்ட பொறுப்பின் புதிய காலத்தை அறிவிக்கின்றன. கிறிஸ்துவில் \"ஆக்கினைத்தீர்ப்பில்லை\" (ரோமர் 8:1). குடும்பப் போக்குகள் கற்ற நடத்தை, மரபியல், குடும்ப அமைப்புகள், ஆவிகள் அல்ல."], c: ["Rightly guards the finished work, but has little to offer families facing what looks like intergenerational spiritual oppression.", "முடிக்கப்பட்ட கிரியையைச் சரியாகக் காக்கிறது; ஆனால் தலைமுறை ஆவிக்குரிய ஒடுக்குதல் போலத் தோன்றுவதை எதிர்கொள்ளும் குடும்பங்களுக்குக் கொடுப்பது குறைவு."] },
        { name: ["Word of Faith", "விசுவாச வார்த்தை"], who: ["Kenneth Hagin, Kenneth Copeland", "கென்னத் ஹேகின், கென்னத் கோப்லாண்ட்"], p: ["\"Redeemed from the curse\" is a finished legal fact (Gal 3:13). Poverty, sickness and spiritual death (Deut 28) are all included. The believer enforces this by knowing it, confessing it and refusing the curse's symptoms.", "\"சாபத்திலிருந்து மீட்கப்பட்டோம்\" என்பது முடிக்கப்பட்ட சட்ட உண்மை (கலாத்தியர் 3:13). வறுமை, நோய், ஆவிக்குரிய மரணம் (உபாகமம் 28) எல்லாம் இதில் அடங்கும். விசுவாசி இதை அறிந்து, அறிக்கையிட்டு, சாபத்தின் அறிகுறிகளை மறுப்பதன் மூலம் அமல்படுத்துகிறார்."], c: ["Strong confidence; risks denying real wounds and blaming continued struggle on weak confession.", "வலுவான நம்பிக்கை; உண்மையான காயங்களை மறுத்து, தொடரும் போராட்டத்தைப் பலவீனமான அறிக்கையின்மேல் சுமத்தும் அபாயம்."] },
        { name: ["Grace", "கிருபை"], who: ["Joseph Prince and grace teachers", "ஜோசப் பிரின்ஸ் மற்றும் கிருபைப் போதகர்கள்"], p: ["You cannot be both blessed and cursed. Balaam could not curse those God blessed (Num 23:8, 20). Stop looking for curses and start seeing yourself in Christ; focusing on curses magnifies them, focusing on Jesus releases the blessing.", "நீங்கள் ஒரே நேரத்தில் ஆசீர்வதிக்கப்பட்டவரும் சபிக்கப்பட்டவருமாக இருக்க முடியாது. தேவன் ஆசீர்வதித்தவர்களைப் பிலேயாமால் சபிக்க முடியவில்லை (எண்ணாகமம் 23:8, 20). சாபங்களைத் தேடுவதை நிறுத்தி, கிறிஸ்துவில் உங்களைப் பாருங்கள்; சாபங்களில் கவனம் அவற்றைப் பெரிதாக்குகிறது, இயேசுவில் கவனம் ஆசீர்வாதத்தை விடுவிக்கிறது."], c: ["Wonderful antidote to fear; can overlook the NT's own practices of renouncing and casting out (Acts 19:18–19; Mark 16:17).", "பயத்துக்கு அருமையான மாற்று மருந்து; மறுதலித்தல், துரத்துதல் போன்ற புதிய ஏற்பாட்டுப் பழக்கங்களைக் கவனிக்காமல் விடலாம் (அப்போஸ்தலர் 19:18–19; மாற்கு 16:17)."] },
        { name: ["Relational gospel", "உறவுமுறை சுவிசேஷம்"], p: ["Legally, the curse is broken: you are a new creation in a new family, with God as your Father (2 Cor 5:17; Gal 4:4–7). Experientially, family patterns live on in beliefs, wounds, habits and agreements until they are healed in relationship with Jesus and His people. So we don't fear ancestry, and we don't ignore it either: we bring each pattern into the light, forgive our parents, renounce agreements, receive the Father's blessing that our earthly fathers may not have given, and build a new family culture.", "சட்டப்படி, சாபம் முறிக்கப்பட்டது: நீங்கள் புதிய குடும்பத்தில் புதிய சிருஷ்டி, தேவன் உங்கள் பிதா (2 கொரிந்தியர் 5:17; கலாத்தியர் 4:4–7). அனுபவத்தில், குடும்பப் போக்குகள் இயேசுவோடும் அவர் மக்களோடும் உள்ள உறவில் சுகமாகும்வரை நம்பிக்கைகள், காயங்கள், பழக்கங்கள், ஒப்பந்தங்களில் வாழ்கின்றன. எனவே முன்னோர் வரலாற்றுக்குப் பயப்படுவதுமில்லை, புறக்கணிப்பதுமில்லை: ஒவ்வொரு போக்கையும் வெளிச்சத்துக்குக் கொண்டுவந்து, பெற்றோரை மன்னித்து, ஒப்பந்தங்களை மறுதலித்து, பூமிக்குரிய தகப்பன்மார் கொடுக்காதிருக்கக்கூடிய பிதாவின் ஆசீர்வாதத்தைப் பெற்று, புதிய குடும்பக் கலாச்சாரத்தைக் கட்டுகிறோம்."], c: ["Integrates the cross, deliverance and healing; slower than a one-time prayer, because transformation happens in relationship over time.", "சிலுவை, விடுதலை, சுகத்தை ஒருங்கிணைக்கிறது; ஒருமுறை ஜெபத்தை விட மெதுவானது, ஏனெனில் மாற்றம் காலப்போக்கில் உறவில் நடக்கிறது."] }
      ], start: 4 },

    { id: "who", type: "lens", title: ["Does God allow this, or does Satan do it?", "தேவன் இதை அனுமதிக்கிறாரா, அல்லது சாத்தான் செய்கிறானா?"], short: ["God or Satan?", "தேவனா சாத்தானா?"],
      q: ["Deuteronomy 28 says \"the LORD will send on you cursing.\" Jesus says \"the thief comes to steal, kill and destroy; I have come that they may have life\" (John 10:10). Who is behind a curse?", "உபாகமம் 28 \"கர்த்தர் உன்மேல் சாபத்தை அனுப்புவார்\" என்கிறது. இயேசு \"திருடன் திருடவும் கொல்லவும் அழிக்கவுமே வருகிறான்; நானோ அவர்களுக்கு ஜீவன் உண்டாயிருக்கவும் வந்தேன்\" என்கிறார் (யோவான் 10:10). சாபத்துக்குப் பின்னால் யார்?"],
      views: [
        { name: ["Classic Reformed", "பாரம்பரியச் சீர்திருத்தம்"], p: ["God is sovereign over all, including evil, which He permits and uses for good (Gen 50:20; Job 1–2). Curses in Deuteronomy are God's covenant judgements. For the believer, hardship is fatherly discipline, never punishment (Heb 12:6).", "தீமை உட்பட எல்லாவற்றின்மேலும் தேவன் இறையாண்மையுள்ளவர்; அதை அனுமதித்து நன்மைக்காகப் பயன்படுத்துகிறார் (ஆதியாகமம் 50:20; யோபு 1–2). உபாகமத்தின் சாபங்கள் தேவனுடைய உடன்படிக்கை நியாயத்தீர்ப்புகள். விசுவாசிக்கு, கஷ்டம் தகப்பனின் சிட்சை, ஒருபோதும் தண்டனை அல்ல (எபிரெயர் 12:6)."], c: ["Upholds God's control, but can make Him look like the author of the very things Jesus healed and cast out.", "தேவனுடைய கட்டுப்பாட்டை உயர்த்துகிறது; ஆனால் இயேசு சுகமாக்கித் துரத்தியவற்றின் ஆசிரியராக அவரைக் காட்டலாம்."] },
        { name: ["Deliverance ministry", "விடுதலை ஊழியம்"], p: ["God set up a moral universe where sin and occult covenants carry spiritual consequences; Satan and demons are the agents who enforce curses when given legal ground. God \"allows\" in the sense that He honours human choices, but He has provided full redemption.", "பாவமும் மாந்திரீக உடன்படிக்கைகளும் ஆவிக்குரிய விளைவுகளைச் சுமக்கும் நெறிமுறை உலகத்தைத் தேவன் அமைத்தார்; சட்ட ஆதாரம் கொடுக்கப்படும்போது சாபங்களை அமல்படுத்தும் முகவர்கள் சாத்தானும் பிசாசுகளும். மனிதத் தேர்வுகளை மதிக்கிறார் என்ற அர்த்தத்தில் தேவன் \"அனுமதிக்கிறார்\"; ஆனால் முழு மீட்பை அளித்திருக்கிறார்."], c: ["Explains experience well; must guard against making the devil bigger than he is.", "அனுபவத்தை நன்றாக விளக்குகிறது; பிசாசை அவன் இருப்பதைவிடப் பெரியவனாக்காமல் காக்க வேண்டும்."] },
        { name: ["Word of Faith", "விசுவாச வார்த்தை"], p: ["God is never the source of sickness, poverty or curse; Satan is (Acts 10:38). Hebrew verbs in Deut 28 are often read as permissive (\"the LORD will allow\"). Believers have authority and must use it; God has done His part.", "நோய், வறுமை, சாபத்துக்குத் தேவன் ஒருபோதும் மூலமல்ல; சாத்தானே (அப்போஸ்தலர் 10:38). உபாகமம் 28-ன் எபிரெய வினைச்சொற்கள் அனுமதிக்கும் பொருளில் (\"கர்த்தர் அனுமதிப்பார்\") அடிக்கடி வாசிக்கப்படுகின்றன. விசுவாசிகளுக்கு அதிகாரம் உண்டு, அதைப் பயன்படுத்த வேண்டும்; தேவன் தம் பங்கைச் செய்துவிட்டார்."], c: ["Protects God's goodness; can make prayer feel like it all depends on us.", "தேவனுடைய நன்மையைக் காக்கிறது; எல்லாம் நம்மையே சார்ந்தது என்று ஜெபத்தை உணர வைக்கலாம்."] },
        { name: ["Grace", "கிருபை"], p: ["Under the New Covenant God is not dealing with you by the curses of the Law; Jesus bore them all. Bad things are not God punishing you. Rest in His favour, and the enemy's lies lose their grip.", "புதிய உடன்படிக்கையின் கீழ் நியாயப்பிரமாணத்தின் சாபங்களின்படி தேவன் உங்களை நடத்துவதில்லை; இயேசு அவை எல்லாவற்றையும் சுமந்தார். கெட்ட காரியங்கள் தேவன் உங்களைத் தண்டிப்பது அல்ல. அவர் தயவில் இளைப்பாறுங்கள், சத்துருவின் பொய்கள் பிடியை இழக்கும்."], c: ["Liberating; needs to stay honest that real spiritual opposition still exists (1 Pet 5:8).", "விடுதலை தருவது; உண்மையான ஆவிக்குரிய எதிர்ப்பு இன்னும் இருக்கிறது என்பதில் நேர்மையாக இருக்க வேண்டும் (1 பேதுரு 5:8)."] },
        { name: ["Relational gospel", "உறவுமுறை சுவிசேஷம்"], p: ["Look at Jesus: He never put a curse on anyone or made anyone sick, and He undid every curse He met. That is what the Father is like (John 14:9). In the Old Testament, \"God sending curses\" is mostly the language of covenant consequence: turning away from the Source of life brings death, the way leaving the sun brings cold. The thief comes to destroy; the Father gives life. God permits freedom in a fallen world, but He is not the author of the curse. He became the curse to end it.", "இயேசுவைப் பாருங்கள்: அவர் யார்மேலும் சாபம் வைக்கவில்லை, யாரையும் நோயாளியாக்கவில்லை; சந்தித்த ஒவ்வொரு சாபத்தையும் நீக்கினார். பிதா அப்படிப்பட்டவரே (யோவான் 14:9). பழைய ஏற்பாட்டில் \"தேவன் சாபங்களை அனுப்புதல்\" பெரும்பாலும் உடன்படிக்கை விளைவின் மொழி: சூரியனை விட்டு விலகுவது குளிரைக் கொண்டுவருவது போல, ஜீவனின் ஊற்றை விட்டு விலகுவது மரணத்தைக் கொண்டுவருகிறது. திருடன் அழிக்க வருகிறான்; பிதா ஜீவன் தருகிறார். விழுந்த உலகில் தேவன் சுதந்தரத்தை அனுமதிக்கிறார், ஆனால் சாபத்தின் ஆசிரியர் அவர் அல்ல. அதை முடிக்க அவரே சாபமானார்."], c: ["Keeps God's character Christlike; requires reading the Old Testament through Jesus.", "தேவனுடைய குணத்தைக் கிறிஸ்துவைப் போல வைக்கிறது; பழைய ஏற்பாட்டை இயேசு வழியாக வாசிக்க வேண்டும்."] }
      ], start: 4 },

    { id: "why-believers", type: "map", title: ["Why are believers affected?", "விசுவாசிகள் ஏன் பாதிக்கப்படுகிறார்கள்?"], short: ["Why believers?", "ஏன் விசுவாசிகள்?"],
      center: ["Saved, yet struggling", "இரட்சிக்கப்பட்டும் போராட்டம்"],
      hint: ["Salvation is complete in the spirit, being worked out in the soul, and awaited in the body (1 Thess 5:23; Phil 2:12–13). Tap the reasons.", "இரட்சிப்பு ஆவியில் முழுமையானது, ஆத்துமாவில் நிறைவேற்றப்படுகிறது, சரீரத்தில் எதிர்பார்க்கப்படுகிறது (1 தெசலோனிக்கேயர் 5:23; பிலிப்பியர் 2:12–13). காரணங்களைத் தொடுங்கள்."],
      nodes: [
        { h: ["Already and not yet", "ஏற்கனவேயும் இன்னும் இல்லையும்"], r: "Rom 8:22–23", p: ["We have the firstfruits of the Spirit yet still groan, waiting for full redemption. Not every pain is a curse; some is simply life in a fallen world.", "ஆவியின் முதற்பலன்களைப் பெற்றும் முழு மீட்புக்குக் காத்திருந்து தவிக்கிறோம். எல்லா வேதனையும் சாபம் அல்ல; சில விழுந்த உலகில் வாழ்வது மட்டுமே."] },
        { h: ["Ignorance", "அறியாமை"], r: "Hos 4:6", p: ["\"My people are destroyed for lack of knowledge.\" Many believers don't know what Christ has done or how to apply it.", "\"என் ஜனங்கள் அறிவில்லாமையினால் சங்காரமானார்கள்.\" கிறிஸ்து என்ன செய்தார், அதை எப்படிப் பயன்படுத்துவது என்று பல விசுவாசிகளுக்குத் தெரியாது."] },
        { h: ["Doors never closed", "மூடப்படாத கதவுகள்"], r: "Acts 19:18–19", p: ["The Ephesians had believed, yet later came confessing and burning occult books. Conversion does not automatically renounce every past covenant.", "எபேசியர் விசுவாசித்திருந்தார்கள், ஆனாலும் பின்னர் வந்து அறிக்கையிட்டு மாந்திரீகப் புத்தகங்களைச் சுட்டெரித்தார்கள். மனமாற்றம் ஒவ்வொரு கடந்த உடன்படிக்கையையும் தானாக மறுதலிப்பதில்லை."] },
        { h: ["Unhealed soul", "ஆறாத ஆத்துமா"], r: "3 John 2; Ps 23:3", p: ["\"As your soul prospers.\" Trauma, shame and lies live in the soul and need renewal (Rom 12:2). Demons exploit wounds, like flies on an open sore.", "\"உன் ஆத்துமா வாழ்கிறதுபோல.\" அதிர்ச்சி, வெட்கம், பொய்கள் ஆத்துமாவில் வாழ்கின்றன, புதுப்பித்தல் தேவை (ரோமர் 12:2). திறந்த புண்ணில் ஈக்கள் போல, பிசாசுகள் காயங்களைப் பயன்படுத்துகின்றன."] },
        { h: ["Ongoing agreement", "தொடரும் ஒப்பந்தம்"], r: "Jas 4:7", p: ["Continuing in sin, bitterness, or family occult practice keeps ground open. \"Submit to God; resist the devil\": both halves matter.", "பாவம், கசப்பு, அல்லது குடும்ப மாந்திரீகப் பழக்கத்தில் தொடர்வது இடத்தைத் திறந்தே வைக்கிறது. \"தேவனுக்குக் கீழ்ப்படியுங்கள்; பிசாசுக்கு எதிர்த்து நில்லுங்கள்\": இரண்டு பகுதிகளும் முக்கியம்."] },
        { h: ["Targeted because fruitful", "கனி தருவதால் இலக்காக்கப்படுதல்"], r: "Eph 6:12; 1 Pet 5:8–9", p: ["Spiritual warfare is a sign you matter in the Kingdom, not a sign you are cursed. Paul was buffeted by \"a messenger of Satan\" (2 Cor 12:7).", "ஆவிக்குரிய யுத்தம் நீங்கள் ராஜ்யத்தில் முக்கியம் என்பதன் அடையாளம், சபிக்கப்பட்டவர் என்பதன் அடையாளம் அல்ல. \"சாத்தானுடைய தூதனால்\" பவுல் குட்டப்பட்டார் (2 கொரிந்தியர் 12:7)."] },
        { h: ["Isolation", "தனிமை"], r: "Eccl 4:9–12; Jas 5:16", p: ["Lions pick off the isolated. Freedom is sustained in community where we confess, pray for one another and are known.", "சிங்கங்கள் தனித்திருப்பவர்களைப் பிடிக்கின்றன. அறிக்கையிட்டு, ஒருவருக்காக ஒருவர் ஜெபித்து, அறியப்படும் சமூகத்தில் விடுதலை நிலைத்திருக்கிறது."] },
        { h: ["Misdiagnosis", "தவறான கண்டறிதல்"], r: "Luke 10:34", p: ["Depression, thyroid problems, epilepsy, bipolar disorder or abuse in the home can look \"spiritual\". The Good Samaritan used oil, wine and an inn: practical care is love too.", "மனச்சோர்வு, தைராய்டு கோளாறு, வலிப்பு, இருமுனைக் கோளாறு அல்லது வீட்டில் துஷ்பிரயோகம் \"ஆவிக்குரியது\" போலத் தோன்றலாம். நல்ல சமாரியன் எண்ணெய், திராட்சரசம், சத்திரம் பயன்படுத்தினான்: நடைமுறைக் கவனிப்பும் அன்பே."] }
      ] },

    { id: "demons", type: "cards", title: ["Demonology: what Scripture says", "பிசாசியல்: வேதம் என்ன சொல்கிறது"], short: ["Demonology", "பிசாசியல்"],
      lead: ["Scripture gives us enough to recognise and resist evil spirits, not enough to become fascinated by them.", "தீய ஆவிகளை அடையாளம் கண்டு எதிர்க்கப் போதுமானதை வேதம் தருகிறது, அவற்றில் மோகம் கொள்ளும் அளவுக்கு அல்ல."],
      items: [
        { tag: ["Origin", "தோற்றம்"], h: ["Where demons come from", "பிசாசுகள் எங்கிருந்து வருகின்றன"], p: ["Fallen angels who followed Satan's rebellion.", "சாத்தானின் கலகத்தைப் பின்பற்றிய விழுந்த தூதர்கள்."], r: "Rev 12:4, 9; Jude 6", more: [["The main view: angels who fell with Satan (Rev 12:4, 9; Matt 25:41). Isaiah 14 and Ezekiel 28 are often read as describing Satan's fall behind earthly kings.", "முக்கியக் கருத்து: சாத்தானோடு விழுந்த தூதர்கள் (வெளிப்படுத்தின விசேஷம் 12:4, 9; மத்தேயு 25:41). ஏசாயா 14-ம் எசேக்கியேல் 28-ம் பூமிக்குரிய ராஜாக்களுக்குப் பின்னால் சாத்தானின் வீழ்ச்சியை விவரிப்பதாக அடிக்கடி வாசிக்கப்படுகின்றன."], ["An ancient Jewish view (1 Enoch), held by some early Christians, saw demons as the disembodied spirits of the Nephilim (Gen 6:1–4). Scripture does not settle the detail; it settles their defeat.", "சில ஆதிக் கிறிஸ்தவர்களும் கொண்டிருந்த பண்டைய யூதக் கருத்து (1 ஏனோக்கு), பிசாசுகளை நெபிலீம்களின் உடலற்ற ஆவிகளாகக் கருதியது (ஆதியாகமம் 6:1–4). விவரத்தை வேதம் தீர்க்கவில்லை; அவற்றின் தோல்வியைத் தீர்த்திருக்கிறது."]] },
        { tag: ["Structure", "அமைப்பு"], h: ["Ranks of darkness", "இருளின் படிநிலைகள்"], p: ["Principalities, powers, rulers, spiritual hosts.", "துரைத்தனங்கள், அதிகாரங்கள், அதிபதிகள், ஆவிகளின் சேனைகள்."], r: "Eph 6:12", more: [["Paul names *archai* (principalities), *exousiai* (authorities), *kosmokratores* (world-rulers of darkness) and spiritual hosts of wickedness. Daniel 10:13 speaks of \"the prince of Persia\" resisting an angel, suggesting territorial powers.", "பவுல் *ஆர்க்காய்* (துரைத்தனங்கள்), *எக்ஸூசியாய்* (அதிகாரங்கள்), *காஸ்மோக்ரேட்டோரஸ்* (இருளின் உலகாதிபதிகள்), பொல்லாத ஆவிகளின் சேனைகளைக் குறிப்பிடுகிறார். ஒரு தூதனை எதிர்த்த \"பெர்சியா ராஜ்யத்தின் அதிபதியைப்\" பற்றி தானியேல் 10:13 பேசுகிறது, பிரதேச அதிகாரங்களைக் குறிக்கிறது."], ["Some ministries map and confront \"territorial spirits\" (C. Peter Wagner). Many scholars caution that Scripture never instructs believers to address these directly; the church overcomes them by the gospel, prayer and holy living (Eph 3:10).", "சில ஊழியங்கள் \"பிரதேச ஆவிகளை\" வரைபடமிட்டு எதிர்கொள்கின்றன (சி. பீட்டர் வாக்னர்). இவற்றை நேரடியாக எதிர்கொள்ள வேதம் ஒருபோதும் விசுவாசிகளுக்குக் கட்டளையிடவில்லை என்று பல அறிஞர்கள் எச்சரிக்கிறார்கள்; சுவிசேஷம், ஜெபம், பரிசுத்த வாழ்க்கை மூலம் சபை அவற்றை மேற்கொள்கிறது (எபேசியர் 3:10)."]] },
        { tag: ["Activity", "செயல்பாடு"], h: ["What demons do", "பிசாசுகள் என்ன செய்கின்றன"], p: ["Deceive, tempt, accuse, afflict, oppress.", "வஞ்சித்தல், சோதித்தல், குற்றஞ்சாட்டுதல், வாதித்தல், ஒடுக்குதல்."], r: "John 10:10; 2 Cor 4:4", more: [["The Gospels name spirits by their effects: a spirit of infirmity (Luke 13:11), a deaf and mute spirit (Mark 9:25), unclean spirits (Mark 1:23), a spirit of divination (Acts 16:16), a lying spirit (1 Kgs 22:22).", "சுவிசேஷங்கள் ஆவிகளை அவற்றின் விளைவுகளால் பெயரிடுகின்றன: பலவீனப்படுத்தும் ஆவி (லூக்கா 13:11), ஊமையும் செவிடுமான ஆவி (மாற்கு 9:25), அசுத்த ஆவிகள் (மாற்கு 1:23), குறிசொல்லும் ஆவி (அப்போஸ்தலர் 16:16), பொய்யின் ஆவி (1 இராஜாக்கள் 22:22)."], ["Their main weapon is deception (John 8:44). That is why truth is central to freedom (John 8:32).", "அவற்றின் முக்கிய ஆயுதம் வஞ்சகம் (யோவான் 8:44). அதனால்தான் விடுதலைக்குச் சத்தியம் மையமானது (யோவான் 8:32)."]] },
        { tag: ["Limits", "எல்லைகள்"], h: ["What demons cannot do", "பிசாசுகள் என்ன செய்ய முடியாது"], p: ["They are created, limited and defeated.", "அவை சிருஷ்டிக்கப்பட்டவை, வரம்புள்ளவை, தோற்கடிக்கப்பட்டவை."], r: "Col 2:15; 1 John 4:4", more: [["They are not all-knowing, all-present or all-powerful. They must obey Jesus' name (Luke 10:17). They cannot separate us from God's love (Rom 8:38–39) or snatch us from the Father's hand (John 10:28–29).", "அவை எல்லாம் அறிந்தவை, எங்கும் இருப்பவை, சர்வ வல்லமையுள்ளவை அல்ல. இயேசுவின் நாமத்துக்குக் கீழ்ப்படிய வேண்டும் (லூக்கா 10:17). தேவ அன்பிலிருந்து நம்மைப் பிரிக்க முடியாது (ரோமர் 8:38–39), பிதாவின் கையிலிருந்து பறிக்க முடியாது (யோவான் 10:28–29)."], ["\"He who is in you is greater than he who is in the world.\"", "\"உங்களிலிருக்கிறவர் உலகத்திலிருக்கிறவனிலும் பெரியவர்.\""]] },
        { tag: ["Debate", "விவாதம்"], h: ["Can a Christian have a demon?", "ஒரு கிறிஸ்தவனுக்குப் பிசாசு இருக்க முடியுமா?"], p: ["Possession: no. Demonisation in part: debated.", "முழு ஆட்கொள்ளுதல்: இல்லை. பகுதியளவு பிசாசின் தாக்கம்: விவாதம்."], r: "Mark 5:15; 1 Cor 6:19", more: [["The Greek *daimonizomai* means \"to be demonised\", not \"possessed\". No believer can be owned by Satan, because they belong to Christ and are indwelt by the Holy Spirit.", "கிரேக்க *டைமொனிஸொமாய்* என்பது \"பிசாசின் தாக்கத்தில் இருத்தல்\", \"ஆட்கொள்ளப்படுதல்\" அல்ல. எந்த விசுவாசியும் சாத்தானுக்குச் சொந்தமாக முடியாது; அவர்கள் கிறிஸ்துவுக்குச் சொந்தம், பரிசுத்த ஆவி அவர்களுக்குள் வாசம்பண்ணுகிறார்."], ["**View A:** a believer can be oppressed from outside but not inhabited (many evangelicals). **View B:** a believer's spirit is sealed, but demons can attach to areas of soul or body given to them (Derek Prince; Clinton Arnold argues believers can be demonised in some measure). **View C (Neil Anderson):** avoid the inside/outside debate; focus on truth, repentance and resisting, and the person is free either way.", "**கருத்து A:** விசுவாசி வெளியிலிருந்து ஒடுக்கப்படலாம், உள்ளே வாசம்பண்ணப்பட முடியாது (பல சுவிசேஷகர்கள்). **கருத்து B:** விசுவாசியின் ஆவி முத்திரையிடப்பட்டது; ஆனால் இடம் கொடுக்கப்பட்ட ஆத்துமா அல்லது சரீரப் பகுதிகளில் பிசாசுகள் ஒட்டிக்கொள்ளலாம் (டெரெக் பிரின்ஸ்; விசுவாசிகள் ஓரளவு பிசாசின் தாக்கத்தில் இருக்கலாம் என்று கிளிண்டன் ஆர்னல்ட் வாதிடுகிறார்). **கருத்து C (நீல் ஆண்டர்சன்):** உள்ளே/வெளியே விவாதத்தைத் தவிர்க்கவும்; சத்தியம், மனந்திரும்புதல், எதிர்த்தலில் கவனம் செலுத்தினால், எப்படியிருந்தாலும் அவர் விடுதலையாவார்."]] },
        { tag: ["Jesus' method", "இயேசுவின் முறை"], h: ["How Jesus dealt with demons", "இயேசு பிசாசுகளை எப்படிக் கையாண்டார்"], p: ["A word of authority. No long rituals, no fear.", "அதிகாரமுள்ள ஒரு வார்த்தை. நீண்ட சடங்குகள் இல்லை, பயம் இல்லை."], r: "Matt 8:16; Luke 4:35", more: [["\"He cast out the spirits with a word.\" He silenced them, never debated them, and never sought information from them beyond one question (Mark 5:9). He restored the person to dignity, family and community (Mark 5:15, 19).", "\"ஆவிகளை வார்த்தையினாலே துரத்தினார்.\" அவற்றை அமைதிப்படுத்தினார், விவாதிக்கவில்லை, ஒரு கேள்விக்கு மேல் அவற்றிடம் தகவல் தேடவில்லை (மாற்கு 5:9). அந்த மனிதரை மானம், குடும்பம், சமூகத்துக்கு மீட்டெடுத்தார் (மாற்கு 5:15, 19)."]] }
      ] }
  ]
});

      lead: ["Pew Research's 2010 survey of 19 sub-Saharan countries found that in every country at least one in five people believe in the evil eye or that certain people can cast curses, with majorities in five countries. In India, folk religion, family deities and fear of *seivinai* shape daily life. The dots below are a qualitative comparison of contributing factors, not measured data.", "19 துணை சஹாரா நாடுகளில் பியூ ஆய்வு மையத்தின் 2010 கணக்கெடுப்பு, ஒவ்வொரு நாட்டிலும் குறைந்தது ஐந்தில் ஒருவர் கண்திருஷ்டியையோ சிலர் சாபம் இட முடியும் என்பதையோ நம்புவதாகக் கண்டது; ஐந்து நாடுகளில் பெரும்பான்மை. இந்தியாவில் நாட்டுப்புற மதம், குலதெய்வங்கள், *செய்வினை* பயம் அன்றாட வாழ்க்கையை வடிவமைக்கின்றன. கீழே உள்ள புள்ளிகள் பங்களிக்கும் காரணிகளின் தரமான ஒப்பீடு, அளவிடப்பட்ட தரவு அல்ல."],
